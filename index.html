<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1830">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pompes Royale">
<meta name="description" content="Duels de pompes en temps reel : la camera compte tes repetitions.">
<title>Pompes Royale</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AA%3C/text%3E%3C/svg%3E">

<!-- IMPORTS POUR L'INTELLIGENCE ARTIFICIELLE (TENSORFLOW & MOVENET) -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

<style>
/* ============================================================
   POMPES ROYALE — interface minimaliste (TON CODE INTACT)
   ============================================================ */
:root{
  --bg:#0d1117; --bg2:#0a0e14;
  --surf:#161b22; --surf2:#1c232c; --line:#252c37; --line2:#333c49;
  --tx:#e6edf3; --tx2:#9aa7b5; --tx3:#6b7684;
  --acc:#f0b429; --acc2:#ffd166;
  --ok:#3fb950; --no:#f85149; --info:#58a6ff; --vio:#a371f7;
  --gold-200:var(--acc2); --grey-300:var(--tx2); --grey-500:var(--tx3);
  --r-common:#8b949e; --r-rare:#58a6ff; --r-epic:#a371f7; --r-legend:#f0b429; --r-champ:#f778ba;
  --nav-h:60px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --ft:-apple-system,'Segoe UI',system-ui,Roboto,sans-serif;
  --fb:-apple-system,'Segoe UI',system-ui,Roboto,sans-serif;
  --pop:cubic-bezier(.2,.9,.3,1); --out:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;height:100dvh;overflow:hidden;position:fixed;inset:0;
  background:var(--bg);color:var(--tx);font-family:var(--fb);font-weight:500;font-size:15px;
  user-select:none;-webkit-user-select:none;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;touch-action:manipulation;
  -webkit-font-smoothing:antialiased}
.hide{display:none!important}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;padding:0}
input,textarea{font-family:inherit;-webkit-appearance:none;border-radius:0}
::-webkit-scrollbar{width:0;height:0}
.t{font-weight:700;letter-spacing:-.01em}
.gold{color:var(--acc)}

/* ---------- caméra source : hors écran mais RENDUE (indispensable sur iOS) ---------- */
#cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:-1}
#cam.camfeed{position:absolute;inset:0;width:100%;height:100%;opacity:1;z-index:0;
  object-fit:cover;pointer-events:none}

/* ---------- chargement ---------- */
#boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:20px;background:var(--bg);transition:opacity .35s}
#boot.out{opacity:0;pointer-events:none}
.bootIco{font-size:44px}
.bootT{font-size:22px;font-weight:700;letter-spacing:.16em;text-align:center;margin:0;color:var(--tx)}
.bootT small{display:block;font-size:.62em;letter-spacing:.34em;color:var(--acc);margin-top:4px}
.bootBar{width:min(220px,60vw);height:2px;background:var(--line);overflow:hidden;border-radius:2px}
.bootBar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s var(--out)}
.bootTip{font-size:12px;color:var(--tx3);letter-spacing:.04em;text-align:center;padding:0 20px}

/* ---------- app ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
#bgfx,.grid3d{display:none}

/* ---------- boutons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 16px;border-radius:10px;font-size:14px;font-weight:600;letter-spacing:.01em;
  color:var(--tx);background:var(--surf2);border:1px solid var(--line2);white-space:nowrap;
  transition:background .15s,transform .08s,opacity .15s}
.btn:active{transform:scale(.97);background:var(--line)}
.btn[disabled],.btn.off{opacity:.4;pointer-events:none}
.bg{background:var(--acc);border-color:var(--acc);color:#1a1205;font-weight:700}
.bg:active{background:var(--acc2)}
.br{background:transparent;border-color:#5c2a28;color:#ff8b82}
.br:active{background:#2a1615}
.bv{background:var(--ok);border-color:var(--ok);color:#06210c;font-weight:700}
.bv:active{background:#4ecb60}
.bp{background:var(--vio);border-color:var(--vio);color:#150a26;font-weight:700}
.bn{background:transparent;border-color:var(--line2);color:var(--tx2)}
.bn:active{background:var(--surf2)}
.lg{padding:15px 22px;font-size:16px;border-radius:12px}
.sm{padding:8px 12px;font-size:13px;border-radius:9px;min-height:36px}
.blk{width:100%}
.pulse{animation:none}

/* ---------- panneaux ---------- */
.pan{position:relative;border-radius:12px;padding:14px;background:var(--surf);border:1px solid var(--line)}
.pan.dk{background:var(--bg2)}
.pan.au{border-color:#4a3a12;background:#191509}
.panT{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);
  margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:7px}

/* ---------- barre du haut ---------- */
#top{position:relative;z-index:20;flex:0 0 auto;padding:calc(var(--safe-t) + 10px) 12px 10px;
  display:flex;flex-direction:column;gap:9px;background:var(--bg);border-bottom:1px solid var(--line)}
.trow{display:flex;align-items:center;gap:8px}
.res{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--tx2)}
.res b{font-weight:600;color:var(--tx);font-size:13px}
.res .ic{font-size:13px;opacity:.85}
.plus{width:17px;height:17px;border-radius:9px;display:grid;place-items:center;font-size:13px;
  line-height:1;background:var(--surf2);color:var(--tx2);border:1px solid var(--line2)}
.king{flex:1;display:flex;align-items:center;gap:9px;min-width:0;padding:0}
.av{border-radius:9px;display:grid;place-items:center;overflow:hidden;background:var(--surf2);
  border:1px solid var(--line2)}
.av.au{border-color:#4a3a12}
.kav{position:relative;width:36px;height:36px;flex:0 0 auto}
.kav .av{width:100%;height:100%;font-size:19px}
.klv{position:absolute;left:-4px;bottom:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  display:grid;place-items:center;font-size:10px;font-weight:700;color:#1a1205;background:var(--acc);
  border:2px solid var(--bg)}
.knm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kxp{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:5px;max-width:150px}
.kxp i{display:block;height:100%;background:var(--info);transition:width .4s var(--out)}
.ktr{font-size:14px;font-weight:600;color:var(--acc);display:flex;align-items:center;gap:4px}
.tbtn{width:36px;height:36px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;
  font-size:15px;position:relative;background:var(--surf);border:1px solid var(--line);color:var(--tx2)}
.tbtn:active{background:var(--surf2)}
.dot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--no);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;
  border:2px solid var(--bg)}

/* ---------- écrans ---------- */
#scr{position:relative;flex:1 1 auto;min-height:0;z-index:10}
.sc{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;
  padding:6px calc(12px + var(--safe-l)) calc(var(--nav-h) + var(--safe-b) + 20px) calc(12px + var(--safe-r));
  -webkit-overflow-scrolling:touch}
.sc.on{display:block;animation:scIn .22s var(--out) both}
@keyframes scIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec{margin:16px 0}
.secH{display:flex;align-items:center;justify-content:space-between;margin:0 0 9px;gap:8px}
.secT{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.secA{font-size:12px;color:var(--acc);font-weight:500}

/* ---------- navigation ---------- */
#nav{position:relative;z-index:30;flex:0 0 auto;display:flex;
  height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);
  background:var(--bg);border-top:1px solid var(--line)}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  position:relative;color:var(--tx3);transition:color .15s}
.nv i{font-size:18px;font-style:normal;filter:grayscale(1) opacity(.65);transition:filter .15s}
.nv b{font-size:9.5px;letter-spacing:.05em;font-weight:600}
.nv.on{color:var(--tx)}
.nv.on i{filter:none}
.nv.on::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:22px;height:2px;background:var(--acc);border-radius:0 0 2px 2px}
.nv:active{opacity:.6}

/* ---------- listes ---------- */
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;margin-bottom:6px;
  background:var(--surf);border:1px solid var(--line)}
.row:active{background:var(--surf2)}
.rowM{flex:1;min-width:0}
.rowT{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowS{font-size:12px;color:var(--tx3);margin-top:2px}
.rowR{font-size:14px;font-weight:600;color:var(--acc);text-align:right}
.rk{width:24px;height:24px;flex:0 0 auto;border-radius:6px;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:var(--surf2);color:var(--tx2);border:1px solid var(--line)}
.rk.r1{background:var(--acc);color:#1a1205;border-color:var(--acc)}
.rk.r2{background:#8b949e;color:#0d1117;border-color:#8b949e}
.rk.r3{background:#a4703c;color:#0d1117;border-color:#a4703c}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;font-size:11.5px;
  font-weight:600;background:var(--surf2);border:1px solid var(--line2);color:var(--tx2)}
.chip.au{border-color:#4a3a12;color:var(--acc)}
.chip.gr{border-color:#1e4a26;color:var(--ok)}
.chip.rd{border-color:#5c2a28;color:var(--no)}
.empty{text-align:center;padding:28px 12px;color:var(--tx3);font-size:13px;line-height:1.6}
.empty i{font-size:30px;opacity:.4;display:block;margin-bottom:8px;font-style:normal}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s var(--out)}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:700;
  color:var(--tx);text-shadow:0 1px 2px rgba(0,0,0,.8)}
.tabs{display:flex;gap:0;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:10px 4px;text-align:center;font-size:12.5px;font-weight:600;
  background:none;border:none;color:var(--tx3);position:relative}
.tab.on{color:var(--tx)}
.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--acc)}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--tx3);margin-bottom:6px;font-weight:600}
.inp{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line2);color:var(--tx);
  background:var(--bg2);outline:none;font-size:16px}
.inp:focus{border-color:var(--acc)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick>button{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;font-size:20px;
  background:var(--surf);border:1px solid var(--line);position:relative}
.pick>button.on{border-color:var(--acc);background:var(--surf2)}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 0;
  border-bottom:1px solid var(--line);font-size:14px}
.sw:last-child{border-bottom:none}
.swk{width:42px;height:24px;border-radius:12px;background:var(--line2);position:relative;flex:0 0 auto;
  transition:background .18s}
.swk::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:10px;
  background:var(--tx2);transition:transform .18s var(--pop),background .18s}
.sw.on .swk{background:var(--ok)}
.sw.on .swk::after{transform:translateX(18px);background:#fff}
.sld{width:100%;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;
  background:var(--line2);outline:none}
.sld::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:10px;
  background:var(--acc);border:none}
.sld::-moz-range-thumb{width:20px;height:20px;border-radius:10px;background:var(--acc);border:none}

/* ---------- animations ---------- */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ring{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes flip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shine{to{opacity:1}}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.72}}
.apop{animation:pop .25s var(--pop) both}

/* ---------- toasts ---------- */
#toasts{position:fixed;left:0;right:0;top:calc(var(--safe-t) + 8px);z-index:4000;display:flex;
  flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{display:flex;align-items:center;gap:8px;max-width:94vw;padding:10px 14px;border-radius:10px;
  font-size:13px;background:var(--surf2);border:1px solid var(--line2);animation:tin .22s var(--out) both;
  box-shadow:0 6px 20px rgba(0,0,0,.5)}
.toast.g{border-color:#1e4a26}
.toast.b{border-color:#5c2a28}
.toast.a{border-color:#4a3a12}
.toast.out{animation:tout .2s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

/* ---------- modales ---------- */
#ovl{position:fixed;inset:0;z-index:3000;pointer-events:none}
.mod{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(1,4,9,.78);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  pointer-events:auto;animation:fin .18s ease both}
@keyframes fin{from{opacity:0}to{opacity:1}}
.mod.out{animation:fin .16s ease reverse both}
.modB{position:relative;width:min(400px,94vw);max-height:86vh;overflow:auto;padding:20px;
  border-radius:14px;background:var(--surf);border:1px solid var(--line2);animation:min .24s var(--out) both}
@keyframes min{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.modT{font-size:17px;font-weight:700;text-align:center;margin:0 0 6px;color:var(--tx)}
.modX{text-align:center;font-size:13.5px;color:var(--tx2);line-height:1.55;margin:0 0 14px}
.modA{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.modC{position:absolute;top:10px;right:10px;min-height:30px;padding:5px 9px}
#cfti{position:fixed;inset:0;z-index:3500;pointer-events:none}
#netb{position:fixed;z-index:2500;right:10px;bottom:calc(var(--nav-h) + var(--safe-b) + 8px);
  display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;font-size:9.5px;
  letter-spacing:.05em;color:var(--tx3);pointer-events:none;background:var(--surf);border:1px solid var(--line)}
#netb i{width:5px;height:5px;border-radius:3px;background:var(--tx3);font-style:normal}
#netb.on i{background:var(--ok)}
#netb.wt i{background:var(--acc);animation:ring 1.4s infinite}

/* ============================================================
   DUEL
   ============================================================ */
.duel{position:fixed;inset:0;z-index:2800;display:flex;flex-direction:column;overflow:hidden;
  padding-top:var(--safe-t);padding-bottom:var(--safe-b);background:#000;animation:fin .25s ease both}
.duel.out{animation:fin .2s ease reverse forwards}
.stage{position:absolute;inset:0;overflow:hidden;background:#0a0a0b}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.vig{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,
  rgba(0,0,0,.66) 0%,rgba(0,0,0,.10) 20%,rgba(0,0,0,.06) 58%,rgba(0,0,0,.86) 100%)}

/* ---------- bandeau des combattants ---------- */
.dTop{position:relative;z-index:3;padding:8px 10px 0}
.hud{background:rgba(24,24,27,.58);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:10px 12px 12px}
.hudR{display:flex;align-items:center;justify-content:space-between;gap:6px}
.pl{display:flex;flex-direction:column;align-items:center;gap:5px;width:60px;flex:0 0 auto}
.plav{width:50px;height:50px;border-radius:50%;padding:2.5px;background:var(--pc);
  transition:box-shadow .25s}
.plav .av{width:100%;height:100%;border-radius:50%;font-size:25px;border:2px solid #141416;
  background:#23272e}
.pl.led .plav{box-shadow:0 0 0 3px rgba(255,255,255,.22)}
.pln{font-size:11px;font-weight:600;color:#fff;max-width:62px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.pl.me{--pc:#31dd63}
.pl.op{--pc:#ff3b7f}
.plsc{font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;
  min-width:32px;text-align:center}
.plsc.me{color:#31dd63}
.plsc.op{color:#ff3b7f}
.plsc.bump{animation:sbump .24s var(--pop)}
@keyframes sbump{0%{transform:scale(1)}45%{transform:scale(1.3)}100%{transform:scale(1)}}
.hudC{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.hudC s{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.5);
  text-decoration:none;padding-left:.24em}
.hudC b{font-size:25px;font-weight:800;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.hudC.urg b{color:#ff5b52}
.sbar{position:relative;height:14px;border-radius:9px;overflow:hidden;margin-top:11px;
  background:#ff3b7f;box-shadow:0 0 0 2px rgba(255,255,255,.92)}
.sbar i{position:absolute;inset:0 auto 0 0;background:#31dd63;transition:width .35s var(--out);
  box-shadow:2px 0 0 rgba(255,255,255,.92)}

/* ---------- compteur central ---------- */
.dMid{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:6px 12px;min-height:0}
.repL{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:rgba(255,255,255,.6);
  text-shadow:0 2px 10px rgba(0,0,0,.9);padding-left:.42em;margin-bottom:-4px}
.rN{font-size:min(148px,38vw);font-weight:800;line-height:1;color:#fff;letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;text-shadow:0 8px 34px rgba(0,0,0,.8),0 2px 8px rgba(0,0,0,.7)}
.rN.bump{animation:rbump .24s var(--pop)}
@keyframes rbump{0%{transform:scale(1)}38%{transform:scale(1.14)}100%{transform:scale(1)}}
.ring,.rPulse,.rL{display:none}

/* ---------- bas d'écran ---------- */
.dBot{position:relative;z-index:3;padding:0 14px 12px;display:flex;flex-direction:column;gap:9px}
.dhint{font-size:11.5px;color:rgba(255,255,255,.72);text-align:center;line-height:1.4;
  text-shadow:0 1px 5px rgba(0,0,0,.9);min-height:16px}
.dstat{display:flex;align-items:center;justify-content:center;gap:9px;font-size:11px;
  color:rgba(255,255,255,.6);text-shadow:0 1px 4px rgba(0,0,0,.9);flex-wrap:wrap}
.dstat b{color:#fff;font-weight:700}
.post{display:flex;align-items:center;gap:5px;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:600}
.post i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.35);font-style:normal;
  transition:background .12s}
.post.down i{background:#ff3b7f}

<body>

  <!-- STRUCTURE DE L'ARÈNE (DUEL) BASEE SUR TES CLASSES CSS -->
  <div class="duel">
    <!-- Camera + Canvas par dessus -->
    <div class="stage">
      <!-- On l'appelle camfeed pour que ton CSS l'affiche en fond -->
      <video id="cam" class="camfeed" autoplay playsinline muted></video>
      <canvas id="trackerCanvas"></canvas>
    </div>
    
    <!-- Filtre sombre pour que le texte soit lisible -->
    <div class="vig"></div>

    <!-- Interface Haut -->
    <div class="dTop">
      <div class="hud">
        <div class="hudR">
          <div class="pl me">
            <div class="plav"><div class="av">🧑‍💻</div></div>
            <div class="pln">Toi</div>
          </div>
          <div class="hudC">
            <s>TIME</s>
            <b>17</b>
            <div class="sbar"><i style="width: 50%;"></i></div>
          </div>
          <div class="pl op">
            <div class="plav"><div class="av">🤖</div></div>
            <div class="pln">Adversaire</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Centre avec les répétitions -->
    <div class="dMid">
      <div class="repL">REPS</div>
      <div class="rN" id="scoreDisplay">0</div>
    </div>
  </div>

  <!-- SCRIPT DU TRACKER DE CORPS INTELLIGENT (TENSORFLOW) -->
  <script>
    const video = document.getElementById('cam');
    const canvas = document.getElementById('trackerCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('scoreDisplay');
    
    let detector;
    let pushupsCount = 0;
    let isDown = false;

    // 1. Démarrer la webcam
    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      });
      video.srcObject = stream;
      
      return new Promise((resolve) => {
        video.onloadedmetadata = () => resolve(video);
      });
    }

    // 2. Initialiser MoveNet (Tracker de Corps)
    async function loadPoseDetectionModel() {
      const detectorConfig = { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING };
      detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, detectorConfig);
    }

    // 3. Boucle principale d'analyse
    async function detectPose() {
      if (video.readyState >= 2) {
        // Aligner la taille du canvas sur la vidéo
        canvas.width = video.offsetWidth;
        canvas.height = video.offsetHeight;
        
        // Ratio pour redimensionner les coordonnées (car on utilise object-fit: cover)
        const scaleX = canvas.width / video.videoWidth;
        const scaleY = canvas.height / video.videoHeight;

        // Détection
        const poses = await detector.estimatePoses(video);
        
        // Nettoyer l'image précédente
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (poses.length > 0) {
          const keypoints = poses[0].keypoints.map(kp => ({
            ...kp,
            x: kp.x * scaleX,
            y: kp.y * scaleY
          }));

          drawSkeletonStyle(keypoints);
          analyzePushupMovement(keypoints);
        }
      }
      // Reboucler à chaque frame
      requestAnimationFrame(detectPose);
    }

    // 4. Dessiner le squelette (Style de la photo : orange avec des points blancs)
    function drawSkeletonStyle(keypoints) {
      const colorOrange = '#ff6a2b';
      const scoreThreshold = 0.4;
      
      ctx.lineWidth = 6;
      ctx.strokeStyle = colorOrange;
      ctx.fillStyle = colorOrange;

      // Dessiner les barres de connexion
      const adjacentKeyPoints = poseDetection.util.getAdjacentPairs(poseDetection.SupportedModels.MoveNet);
      adjacentKeyPoints.forEach(([i, j]) => {
        const kp1 = keypoints[i];
        const kp2 = keypoints[j];
        if (kp1.score > scoreThreshold && kp2.score > scoreThreshold) {
          ctx.beginPath();
          ctx.moveTo(kp1.x, kp1.y);
          ctx.lineTo(kp2.x, kp2.y);
          ctx.stroke();
        }
      });

      // Dessiner les ronds sur les articulations
      keypoints.forEach(point => {
        if (point.score > scoreThreshold) {
          // Gros cercle extérieur
          ctx.beginPath();
          ctx.arc(point.x, point.y, 8, 0, 2 * Math.PI);
          ctx.fill();
          
          // Petit point blanc intérieur (style "joint")
          ctx.beginPath();
          ctx.arc(point.x, point.y, 3, 0, 2 * Math.PI);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.fillStyle = colorOrange; // Reset pour le prochain
        }
      });
    }

    // 5. Logique pour compter les pompes automatiquement
    function analyzePushupMovement(keypoints) {
      const leftShoulder = keypoints.find(k => k.name === 'left_shoulder');
      const leftElbow = keypoints.find(k => k.name === 'left_elbow');
      const leftWrist = keypoints.find(k => k.name === 'left_wrist');

      // Si on voit bien le bras
      if (leftShoulder?.score > 0.4 && leftElbow?.score > 0.4 && leftWrist?.score > 0.4) {
        
        // Calcul très simple de la distance verticale entre l'épaule et le poignet
        // Quand tu descends, ton épaule se rapproche de ton poignet
        const armDistance = Math.abs(leftShoulder.y - leftWrist.y);
        
        // SEUILS (à calibrer selon l'angle du téléphone, ici par défaut)
        const thresholdDown = 60; // Distance courte = tu es en bas
        const thresholdUp = 130;  // Distance longue = tu as tendu le bras

        if (armDistance < thresholdDown && !isDown) {
          // On enregistre qu'on est descendu
          isDown = true; 
        } else if (armDistance > thresholdUp && isDown) {
          // On est remonté ! On compte la pompe
          isDown = false;
          pushupsCount++;
          
          // Mettre à jour l'interface avec la classe 'bump' de ton CSS pour l'animation
          scoreElement.innerText = pushupsCount;
          scoreElement.classList.add('bump');
          setTimeout(() => {
            scoreElement.classList.remove('bump');
          }, 250);
        }
      }
    }

    // 6. Lancement de l'app 
    async function initGame() {
      await startCamera();
      await loadPoseDetectionModel();
      detectPose();
    }

    // Démarrer dès le chargement
    initGame();
  </script>
