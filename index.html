<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1830">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pompes Royale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone.svg">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/duel.css">
</head>
<body>

<!-- ============ ÉCRAN DE CHARGEMENT ============ -->
<div id="boot">
  <div class="boot__logo">
    <div class="boot__crown">👑</div>
    <h1 class="boot__title">POMPES<span>ROYALE</span></h1>
  </div>
  <div class="boot__bar"><i></i></div>
  <div class="boot__tip">Chargement de l'arène…</div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <canvas id="bgfx" aria-hidden="true"></canvas>
  <div id="bgscene" aria-hidden="true">
    <div class="bg-layer bg-layer--far"></div>
    <div class="bg-layer bg-layer--mid"></div>
    <div class="bg-layer bg-layer--near"></div>
    <div class="bg-glow"></div>
  </div>

  <!-- Barre du haut -->
  <header id="topbar"></header>

  <!-- Écrans -->
  <main id="screens">
    <section class="screen" data-screen="shop"></section>
    <section class="screen" data-screen="talents"></section>
    <section class="screen" data-screen="arena"></section>
    <section class="screen" data-screen="social"></section>
    <section class="screen" data-screen="clan"></section>
    <section class="screen" data-screen="profile"></section>
    <section class="screen" data-screen="stats"></section>
    <section class="screen" data-screen="pass"></section>
    <section class="screen" data-screen="quests"></section>
    <section class="screen" data-screen="ranking"></section>
    <section class="screen" data-screen="settings"></section>
  </main>

  <!-- Navigation basse -->
  <nav id="nav"></nav>
</div>

<!-- Couches flottantes -->
<div id="overlays"></div>
<div id="toasts"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="netbadge" class="netbadge hidden"><i></i><span>hors-ligne</span></div>

<!-- Éléments techniques du tracker -->
<video id="camfeed" playsinline muted autoplay class="hidden"></video>
<canvas id="camwork" class="hidden" width="128" height="96"></canvas>

<!-- ============ SCRIPTS ============ -->
<script src="js/util.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/net.js"></script>
<script src="js/tracker.js"></script>
<script src="js/ui.js"></script>
<script src="js/screen_arena.js"></script>
<script src="js/screen_shop.js"></script>
<script src="js/screen_talents.js"></script>
<script src="js/screen_social.js"></script>
<script src="js/screen_clan.js"></script>
<script src="js/screen_profile.js"></script>
<script src="js/duel.js"></script>
<script src="js/main.js"></script>
</body>
</html>
