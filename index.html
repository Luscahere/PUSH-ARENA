<script>
        // ===================== ETAT ET AUTHENTIFICATION =====================
        let user = { 
            username: "", pass: "", pin: "", email: "", avatar: "🦍", bio: "Prêt à en découdre !", levelTitle: "Machine à Pompes ⚙️",
            elo: 1000, maxElo: 1000, gamesPlayed: 0, gamesWon: 0, history: [0, 0, 0, 0, 0, 0, 0],
            friends: [], myCode: "", currentLobby: "Aucun"
        };

        const RANKS = [
            { min: 0, max: 599, name: "BRONZE", short: "BRZ", gem: "var(--brz-gem)", glow: "var(--brz-glow)" },
            { min: 600, max: 1199, name: "ARGENT", short: "ARG", gem: "var(--arg-gem)", glow: "var(--arg-glow)" },
            { min: 1200, max: 1799, name: "OR", short: "OR", gem: "var(--or-gem)", glow: "var(--or-glow)" },
            { min: 1800, max: 2499, name: "PLATINE", short: "PLT", gem: "var(--plt-gem)", glow: "var(--plt-glow)" },
            { min: 2500, max: 9999, name: "DIAMANT", short: "DIA", gem: "var(--dia-gem)", glow: "var(--dia-glow)" }
        ];

        let resetState = { generatedCode: null, targetEmail: null };

        // ===================== SAUVEGARDE ET COMPTE =====================
        function loadAccount() {
            const savedData = localStorage.getItem('pushArenaUser');
            if (savedData) {
                user = JSON.parse(savedData);
                document.getElementById('auth-username-title').innerText = user.username;
                document.getElementById('reg-screen').style.display = 'none';
                document.getElementById('pin-screen').style.display = 'block';
                document.getElementById('auth-overlay').style.display = 'flex';
            } else {
                document.getElementById('reg-screen').style.display = 'block';
                document.getElementById('pin-screen').style.display = 'none';
                document.getElementById('auth-overlay').style.display = 'flex';
            }
        }

        // ===================== GESTION DU CLAVIER PIN =====================
        let currentPinEntry = "";
        function pressPin(num) {
            if (currentPinEntry.length < 4) {
                currentPinEntry += num;
                document.getElementById(`dot-${currentPinEntry.length - 1}`).classList.add('filled');
                if (currentPinEntry.length === 4) setTimeout(checkPin, 200);
            }
        }

        function clearPin() {
            currentPinEntry = "";
            for(let i=0; i<4; i++) document.getElementById(`dot-${i}`).classList.remove('filled');
        }

        function checkPin() {
            if (currentPinEntry === user.pin) {
                document.getElementById('auth-overlay').style.display = 'none';
                updateUI();
                initMultiplayer();
                goToTab(1);
            } else {
                alert("Code PIN incorrect !");
                clearPin();
            }
        }

        function switchAuthMode(mode) { alert("Connexion par mot de passe classique en cours de développement."); }

        function submitRegister() {
            const pseudo = document.getElementById('reg-pseudo').value;
            const pass = document.getElementById('reg-pass').value;
            const pin = document.getElementById('reg-pin').value;
            const email = document.getElementById('reg-email').value;
            
            if (!pseudo || !pass || pin.length !== 4 || !email.includes('@')) {
                alert("Veuillez remplir tous les champs correctement (Email valide + PIN à 4 chiffres)."); return;
            }

            user.username = pseudo; user.pass = pass; user.pin = pin; user.email = email;
            user.bio = document.getElementById('reg-bio').value || user.bio;
            
            localStorage.setItem('pushArenaUser', JSON.stringify(user));
            document.getElementById('auth-overlay').style.display = 'none';
            
            updateUI(); initMultiplayer(); goToTab(1);
        }

        function resetAccount() {
            if (confirm("Es-tu sûr de vouloir supprimer ton compte ?")) {
                localStorage.removeItem('pushArenaUser'); location.reload();
            }
        }

        // ===================== RECUPERATION MOT DE PASSE =====================
        function showResetScreen() {
            document.getElementById('pin-screen').style.display = 'none';
            document.getElementById('reg-screen').style.display = 'none';
            document.getElementById('reset-screen').style.display = 'block';
            document.getElementById('reset-step-1').style.display = 'block';
            document.getElementById('reset-step-2').style.display = 'none';
            document.getElementById('reset-step-3').style.display = 'none';
        }

        function cancelReset() {
            document.getElementById('reset-screen').style.display = 'none';
            if (user.username) document.getElementById('pin-screen').style.display = 'block';
            else document.getElementById('reg-screen').style.display = 'block';
        }

        function sendResetEmail() {
            const inputEmail = document.getElementById('reset-email-input').value.trim();
            if (!user.email || inputEmail.toLowerCase() !== user.email.toLowerCase()) {
                alert("Erreur: Adresse email introuvable ou incorrecte."); return;
            }
            resetState.generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
            alert(`[SIMULATION E-MAIL]\nUn e-mail a été envoyé à ${inputEmail}.\nVotre code : ${resetState.generatedCode}`);
            document.getElementById('reset-step-1').style.display = 'none';
            document.getElementById('reset-step-2').style.display = 'block';
        }

        function verifyResetCode() {
            if (document.getElementById('reset-code-input').value.trim() === resetState.generatedCode) {
                alert("Code validé !");
                document.getElementById('reset-step-2').style.display = 'none';
                document.getElementById('reset-step-3').style.display = 'block';
            } else { alert("Code incorrect."); }
        }

        function saveNewCredentials() {
            const newPass = document.getElementById('new-pass-input').value;
            const newPin = document.getElementById('new-pin-input').value;
            if (!newPass || newPin.length !== 4) return alert("Mot de passe ou PIN invalide.");
            user.pass = newPass; user.pin = newPin;
            localStorage.setItem('pushArenaUser', JSON.stringify(user));
            alert("Identifiants réinitialisés !");
            document.getElementById('auth-overlay').style.display = 'none';
            updateUI(); initMultiplayer(); goToTab(1);
        }

        // ===================== NAVIGATION & RANGS =====================
        function updateUI() {
            document.getElementById('display-username').innerText = user.username;
            document.getElementById('profile-username').innerText = user.username;
            document.getElementById('display-elo').innerText = user.elo;
            document.getElementById('stat-current-elo').innerText = user.elo;
            document.getElementById('stat-max-elo').innerText = user.maxElo;
            document.getElementById('profile-bio').innerText = '"' + user.bio + '"';
            updateRankDisplay();
        }

        function goToTab(index) {
            document.getElementById('swipe-container').style.transform = `translateX(-${index * 25}%)`;
            document.querySelectorAll('.nav-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
        }

        function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }

        function updateRankDisplay() {
            let currentRank = RANKS[0];
            for (let r of RANKS) if (user.elo >= r.min) currentRank = r;
            document.getElementById('rank-gem').innerText = currentRank.short;
            document.getElementById('rank-gem').style.background = currentRank.gem;
            document.getElementById('rank-gem').style.boxShadow = `0 0 25px ${currentRank.glow}`;
            document.getElementById('rank-name').innerText = currentRank.name;
        }

        function openRankViewer() {
            const container = document.getElementById('rank-scroll-area'); container.innerHTML = ''; 
            RANKS.forEach(r => {
                const isCurrent = user.elo >= r.min && user.elo <= r.max;
                container.innerHTML += `
                    <div style="background: ${isCurrent ? 'rgba(0,229,255,0.2)' : 'rgba(30,41,59,0.8)'}; 
                                border: 2px solid ${isCurrent ? '#00e5ff' : '#334155'}; 
                                border-radius: 10px; padding: 15px; margin-bottom: 10px; text-align: center;">
                        <div class="text-3d" style="font-size: 1.5rem; color: ${isCurrent ? '#00e5ff' : '#fff'}; text-shadow: 0 0 10px ${r.glow}">
                            ${r.name}
                        </div>
                        <div style="color: #aaa; font-size: 0.8rem; margin-top: 5px;">${r.min} - ${r.max > 9000 ? 'MAX' : r.max} Trophées</div>
                    </div>
                `;
            });
            document.getElementById('modal-ranks').style.display = 'flex';
        }

        // ===================== MULTIJOUEUR PEERJS & MATCHMAKING =====================
        let peer;
        let activeConnection = null;
        let isSearching = false;
        let aiTimeout = null;
        
        // Les canaux publics pour le matchmaking
        let currentHubIndex = 0;
        const HUBS = ['pa-hub-1', 'pa-hub-2', 'pa-hub-3'];

        function initMultiplayer() {
            if (peer) peer.destroy();
            peer = new Peer(); // ID aléatoire classique pour être invité par un ami
            
            peer.on('open', (id) => {
                user.myCode = id;
                renderFriendsList();
            });

            // GESTION DES REQUETES ENTRANTES (Amis ou Matchmaking)
            peer.on('connection', (conn) => {
                // BUG CORRIGÉ : On attend l'ouverture du tunnel AVANT de confirmer/envoyer
                conn.on('open', () => {
                    // Si c'est un joueur aléatoire qui nous trouve sur un canal public
                    if (conn.metadata && conn.metadata.type === 'random') {
                        if (isSearching) {
                            clearTimeout(aiTimeout); isSearching = false;
                            activeConnection = conn; setupGameConnection(conn);
                            conn.send({ type: 'ACCEPTED', username: user.username });
                            startGameUI(conn.metadata.username || "Inconnu");
                        } else {
                            conn.send({ type: 'REJECTED' }); // Nous sommes en jeu, on refuse.
                        }
                        return;
                    }

                    // Si c'est un ami
                    if (confirm(`Le joueur ${conn.metadata?.username || 'Un ami'} te défie ! Accepter ?`)) {
                        activeConnection = conn; setupGameConnection(conn);
                        conn.send({ type: 'ACCEPTED', username: user.username });
                        startGameUI(conn.metadata?.username || "Ami");
                    } else {
                        conn.send({ type: 'REJECTED' });
                        setTimeout(() => conn.close(), 500);
                    }
                });
            });

            // GESTION DES ERREURS DE MATCHMAKING (Canal vide)
            peer.on('error', (err) => {
                if (err.type === 'peer-unavailable') {
                    if (isSearching) {
                        // Le canal public ciblé est vide : On le réquisitionne !
                        becomeHub(HUBS[currentHubIndex]);
                    } else {
                        alert("Joueur introuvable ou hors ligne.");
                        cancelMatchmaking();
                    }
                } else if (err.type === 'unavailable-id' && isSearching) {
                    currentHubIndex++; tryNextHub(); // Quelqu'un a volé le canal à la dernière ms
                }
            });
        }

        // --- MATCHMAKING ALÉATOIRE SANS SERVEUR ---
        function startSmartMatchmaking() {
            document.getElementById('screen-matchmaking').style.display = 'flex';
            isSearching = true; currentHubIndex = 0;
            tryNextHub();
        }

        function tryNextHub() {
            if (!isSearching) return;
            if (currentHubIndex >= HUBS.length) {
                startAIGame(); return; // Plus de canaux libres -> On lance l'IA
            }
            
            document.getElementById('mm-status').innerText = `Recherche (Canal ${currentHubIndex + 1}/${HUBS.length})...`;
            const conn = peer.connect(HUBS[currentHubIndex], { metadata: { username: user.username, type: 'random' } });
            
            conn.on('data', (data) => {
                if (data.type === 'REJECTED') {
                    // L'hôte du canal est déjà en combat, on passe au suivant
                    currentHubIndex++; tryNextHub();
                } else if (data.type === 'ACCEPTED') {
                    isSearching = false; clearTimeout(aiTimeout);
                    activeConnection = conn; setupGameConnection(conn);
                    startGameUI(data.username || "Adversaire");
                }
            });
        }

        function becomeHub(hubId) {
            document.getElementById('mm-status').innerText = "Attente d'un adversaire... (Max 30s)";
            peer.destroy(); // On lâche notre ID d'ami
            
            setTimeout(() => {
                peer = new Peer(hubId); // On devient le Canal Public
                peer.on('open', () => {
                    // Si personne ne rejoint dans les 30s, on lance l'IA
                    aiTimeout = setTimeout(() => { if (isSearching) startAIGame(); }, 30000);
                });
                // peer.on('connection') s'occupera de la suite grâce à initMultiplayer (qui doit être réattribué ici)
                peer.on('connection', (conn) => {
                    conn.on('open', () => {
                        if (conn.metadata && conn.metadata.type === 'random' && isSearching) {
                            clearTimeout(aiTimeout); isSearching = false;
                            activeConnection = conn; setupGameConnection(conn);
                            conn.send({ type: 'ACCEPTED', username: user.username });
                            startGameUI(conn.metadata.username || "Adversaire");
                        } else { conn.send({ type: 'REJECTED' }); }
                    });
                });
            }, 500);
        }

        // --- MATCHMAKING AMIS ---
        function shareFriendLink() {
            if (!user.myCode) return alert("Connexion en cours...");
            const code = prompt("Copie ton ID, ou colle celui d'un ami pour le rejoindre :", user.myCode);
            if (code && code !== user.myCode) joinFriendLobby(code);
        }

        function joinFriendLobby(friendId) {
            document.getElementById('screen-matchmaking').style.display = 'flex';
            document.getElementById('mm-status').innerText = "Connexion à l'ami...";
            isSearching = false; // Ce n'est pas aléatoire

            const conn = peer.connect(friendId, { metadata: { username: user.username, type: 'friend' } });
            conn.on('open', () => document.getElementById('mm-status').innerText = "En attente de l'hôte...");
            
            conn.on('data', (data) => {
                if (data.type === 'REJECTED') {
                    alert("L'invitation a été refusée."); cancelMatchmaking();
                } else if (data.type === 'ACCEPTED') {
                    activeConnection = conn; setupGameConnection(conn);
                    startGameUI(data.username || "Ami");
                }
            });
        }

        function cancelMatchmaking() {
            isSearching = false; clearTimeout(aiTimeout);
            document.getElementById('screen-matchmaking').style.display = 'none';
            peer.destroy(); setTimeout(initMultiplayer, 500); // Retour au lobby classique
        }

        function renderFriendsList() {
            document.getElementById('friends-catalog-list').innerHTML = `
                <div class="list-item">
                    <div style="display:flex; align-items:center;"><span class="status-dot"></span><span class="text-3d" style="font-size: 0.9rem;">Mon ID (Copier)</span></div>
                    <div style="font-size: 0.7rem; color: #aaa;">${user.myCode}</div>
                </div>`;
        }

        // ===================== LOGIQUE DU JEU ET I.A =====================
        let battleTimerInterval = null;
        let aiInterval = null;
        let myScore = 0;

        function setupGameConnection(conn) {
            conn.on('data', (data) => {
                if (data.type === 'SCORE_UPDATE') document.getElementById('p2-score').innerText = data.score;
            });
        }

        function startGameUI(opponentName) {
            document.getElementById('screen-matchmaking').style.display = 'none';
            document.getElementById('screen-battle').style.display = 'flex';
            
            document.getElementById('p1-name').innerText = user.username.substring(0, 10);
            document.getElementById('p2-name').innerText = opponentName.substring(0, 10);
            
            myScore = 0;
            document.getElementById('p1-score').innerText = "0";
            document.getElementById('p2-score').innerText = "0";
            
            let timeLeft = 30;
            document.getElementById('battle-timer').innerText = timeLeft;
            
            clearInterval(battleTimerInterval);
            battleTimerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('battle-timer').innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(battleTimerInterval);
                    endSimulationBattle();
                }
            }, 1000);
        }

        function startAIGame() {
            isSearching = false; clearTimeout(aiTimeout);
            
            const randomId = Math.floor(1000 + Math.random() * 9000);
            const aiName = "Joueur_" + randomId;
            startGameUI(aiName);

            // Simulation intelligente de l'IA (vitesse calquée sur ton classement)
            let aiScore = 0;
            let aiSpeed = 2500; // 2.5 secondes par pompe de base
            if (user.elo > 1500) aiSpeed = 1500;
            else if (user.elo > 1000) aiSpeed = 2000;

            clearInterval(aiInterval);
            aiInterval = setInterval(() => {
                if(Math.random() > 0.2) { // 80% de chance d'incrémenter à chaque tick
                    aiScore++;
                    document.getElementById('p2-score').innerText = aiScore;
                }
            }, aiSpeed);
        }

        function endSimulationBattle() {
            document.getElementById('screen-battle').style.display = 'none';
            document.getElementById('screen-result').style.display = 'flex';
            
            // Nettoyage complet
            if (activeConnection) { activeConnection.close(); activeConnection = null; }
            clearInterval(aiInterval);
            clearInterval(battleTimerInterval);
            
            // Attribution des points (Simulation de +30)
            user.elo += 30;
            if(user.elo > user.maxElo) user.maxElo = user.elo;
            user.gamesPlayed++; user.gamesWon++;
            localStorage.setItem('pushArenaUser', JSON.stringify(user));
            
            // Restauration de l'identité P2P initiale
            peer.destroy();
            setTimeout(initMultiplayer, 500); 
        }

        function returnToMenu() {
            document.getElementById('screen-result').style.display = 'none';
            updateUI();
        }

        // Lancement
        window.onload = loadAccount;

    </script>
