<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1830">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pompes Royale">
<meta name="description" content="Duels de pompes en temps reel : la camera compte tes repetitions.">
<title>Pompes Royale</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AA%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   POMPES ROYALE — interface minimaliste
   Fond neutre, une seule couleur d'accent, aplats, 1px de bordure.
   ============================================================ */
:root{
  --bg:#0d1117; --bg2:#0a0e14;
  --surf:#161b22; --surf2:#1c232c; --line:#252c37; --line2:#333c49;
  --tx:#e6edf3; --tx2:#9aa7b5; --tx3:#6b7684;
  --acc:#f0b429; --acc2:#ffd166;
  --ok:#3fb950; --no:#f85149; --info:#58a6ff; --vio:#a371f7;
  --gold-200:var(--acc2); --grey-300:var(--tx2); --grey-500:var(--tx3);
  --r-common:#8b949e; --r-rare:#58a6ff; --r-epic:#a371f7; --r-legend:#f0b429; --r-champ:#f778ba;
  --nav-h:60px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --ft:-apple-system,'Segoe UI',system-ui,Roboto,sans-serif;
  --fb:-apple-system,'Segoe UI',system-ui,Roboto,sans-serif;
  --pop:cubic-bezier(.2,.9,.3,1); --out:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;height:100dvh;overflow:hidden;position:fixed;inset:0;
  background:var(--bg);color:var(--tx);font-family:var(--fb);font-weight:500;font-size:15px;
  user-select:none;-webkit-user-select:none;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;touch-action:manipulation;
  -webkit-font-smoothing:antialiased}
.hide{display:none!important}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;padding:0}
input,textarea{font-family:inherit;-webkit-appearance:none;border-radius:0}
::-webkit-scrollbar{width:0;height:0}
.t{font-weight:700;letter-spacing:-.01em}
.gold{color:var(--acc)}

/* ---------- caméra source : hors écran mais RENDUE (indispensable sur iOS) ---------- */
#cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:-1}

/* ---------- chargement ---------- */
#boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:20px;background:var(--bg);transition:opacity .35s}
#boot.out{opacity:0;pointer-events:none}
.bootIco{font-size:44px}
.bootT{font-size:22px;font-weight:700;letter-spacing:.16em;text-align:center;margin:0;color:var(--tx)}
.bootT small{display:block;font-size:.62em;letter-spacing:.34em;color:var(--acc);margin-top:4px}
.bootBar{width:min(220px,60vw);height:2px;background:var(--line);overflow:hidden;border-radius:2px}
.bootBar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s var(--out)}
.bootTip{font-size:12px;color:var(--tx3);letter-spacing:.04em;text-align:center;padding:0 20px}

/* ---------- app ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
#bgfx,.grid3d{display:none}

/* ---------- boutons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 16px;border-radius:10px;font-size:14px;font-weight:600;letter-spacing:.01em;
  color:var(--tx);background:var(--surf2);border:1px solid var(--line2);white-space:nowrap;
  transition:background .15s,transform .08s,opacity .15s}
.btn:active{transform:scale(.97);background:var(--line)}
.btn[disabled],.btn.off{opacity:.4;pointer-events:none}
.bg{background:var(--acc);border-color:var(--acc);color:#1a1205;font-weight:700}
.bg:active{background:var(--acc2)}
.br{background:transparent;border-color:#5c2a28;color:#ff8b82}
.br:active{background:#2a1615}
.bv{background:var(--ok);border-color:var(--ok);color:#06210c;font-weight:700}
.bv:active{background:#4ecb60}
.bp{background:var(--vio);border-color:var(--vio);color:#150a26;font-weight:700}
.bn{background:transparent;border-color:var(--line2);color:var(--tx2)}
.bn:active{background:var(--surf2)}
.lg{padding:15px 22px;font-size:16px;border-radius:12px}
.sm{padding:8px 12px;font-size:13px;border-radius:9px;min-height:36px}
.blk{width:100%}
.pulse{animation:none}

/* ---------- panneaux ---------- */
.pan{position:relative;border-radius:12px;padding:14px;background:var(--surf);border:1px solid var(--line)}
.pan.dk{background:var(--bg2)}
.pan.au{border-color:#4a3a12;background:#191509}
.panT{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);
  margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:7px}

/* ---------- barre du haut ---------- */
#top{position:relative;z-index:20;flex:0 0 auto;padding:calc(var(--safe-t) + 10px) 12px 10px;
  display:flex;flex-direction:column;gap:9px;background:var(--bg);border-bottom:1px solid var(--line)}
.trow{display:flex;align-items:center;gap:8px}
.res{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--tx2)}
.res b{font-weight:600;color:var(--tx);font-size:13px}
.res .ic{font-size:13px;opacity:.85}
.plus{width:17px;height:17px;border-radius:9px;display:grid;place-items:center;font-size:13px;
  line-height:1;background:var(--surf2);color:var(--tx2);border:1px solid var(--line2)}
.king{flex:1;display:flex;align-items:center;gap:9px;min-width:0;padding:0}
.av{border-radius:9px;display:grid;place-items:center;overflow:hidden;background:var(--surf2);
  border:1px solid var(--line2)}
.av.au{border-color:#4a3a12}
.kav{position:relative;width:36px;height:36px;flex:0 0 auto}
.kav .av{width:100%;height:100%;font-size:19px}
.klv{position:absolute;left:-4px;bottom:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  display:grid;place-items:center;font-size:10px;font-weight:700;color:#1a1205;background:var(--acc);
  border:2px solid var(--bg)}
.knm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kxp{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:5px;max-width:150px}
.kxp i{display:block;height:100%;background:var(--info);transition:width .4s var(--out)}
.ktr{font-size:14px;font-weight:600;color:var(--acc);display:flex;align-items:center;gap:4px}
.tbtn{width:36px;height:36px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;
  font-size:15px;position:relative;background:var(--surf);border:1px solid var(--line);color:var(--tx2)}
.tbtn:active{background:var(--surf2)}
.dot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--no);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;
  border:2px solid var(--bg)}

/* ---------- écrans ---------- */
#scr{position:relative;flex:1 1 auto;min-height:0;z-index:10}
.sc{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;
  padding:6px calc(12px + var(--safe-l)) calc(var(--nav-h) + var(--safe-b) + 20px) calc(12px + var(--safe-r));
  -webkit-overflow-scrolling:touch}
.sc.on{display:block;animation:scIn .22s var(--out) both}
@keyframes scIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec{margin:16px 0}
.secH{display:flex;align-items:center;justify-content:space-between;margin:0 0 9px;gap:8px}
.secT{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.secA{font-size:12px;color:var(--acc);font-weight:500}

/* ---------- navigation ---------- */
#nav{position:relative;z-index:30;flex:0 0 auto;display:flex;
  height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);
  background:var(--bg);border-top:1px solid var(--line)}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  position:relative;color:var(--tx3);transition:color .15s}
.nv i{font-size:18px;font-style:normal;filter:grayscale(1) opacity(.65);transition:filter .15s}
.nv b{font-size:9.5px;letter-spacing:.05em;font-weight:600}
.nv.on{color:var(--tx)}
.nv.on i{filter:none}
.nv.on::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:22px;height:2px;background:var(--acc);border-radius:0 0 2px 2px}
.nv:active{opacity:.6}

/* ---------- listes ---------- */
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;margin-bottom:6px;
  background:var(--surf);border:1px solid var(--line)}
.row:active{background:var(--surf2)}
.rowM{flex:1;min-width:0}
.rowT{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowS{font-size:12px;color:var(--tx3);margin-top:2px}
.rowR{font-size:14px;font-weight:600;color:var(--acc);text-align:right}
.rk{width:24px;height:24px;flex:0 0 auto;border-radius:6px;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:var(--surf2);color:var(--tx2);border:1px solid var(--line)}
.rk.r1{background:var(--acc);color:#1a1205;border-color:var(--acc)}
.rk.r2{background:#8b949e;color:#0d1117;border-color:#8b949e}
.rk.r3{background:#a4703c;color:#0d1117;border-color:#a4703c}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;font-size:11.5px;
  font-weight:600;background:var(--surf2);border:1px solid var(--line2);color:var(--tx2)}
.chip.au{border-color:#4a3a12;color:var(--acc)}
.chip.gr{border-color:#1e4a26;color:var(--ok)}
.chip.rd{border-color:#5c2a28;color:var(--no)}
.empty{text-align:center;padding:28px 12px;color:var(--tx3);font-size:13px;line-height:1.6}
.empty i{font-size:30px;opacity:.4;display:block;margin-bottom:8px;font-style:normal}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s var(--out)}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:700;
  color:var(--tx);text-shadow:0 1px 2px rgba(0,0,0,.8)}
.tabs{display:flex;gap:0;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:10px 4px;text-align:center;font-size:12.5px;font-weight:600;
  background:none;border:none;color:var(--tx3);position:relative}
.tab.on{color:var(--tx)}
.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--acc)}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--tx3);margin-bottom:6px;font-weight:600}
.inp{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line2);color:var(--tx);
  background:var(--bg2);outline:none;font-size:16px}
.inp:focus{border-color:var(--acc)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick>button{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;font-size:20px;
  background:var(--surf);border:1px solid var(--line);position:relative}
.pick>button.on{border-color:var(--acc);background:var(--surf2)}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 0;
  border-bottom:1px solid var(--line);font-size:14px}
.sw:last-child{border-bottom:none}
.swk{width:42px;height:24px;border-radius:12px;background:var(--line2);position:relative;flex:0 0 auto;
  transition:background .18s}
.swk::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:10px;
  background:var(--tx2);transition:transform .18s var(--pop),background .18s}
.sw.on .swk{background:var(--ok)}
.sw.on .swk::after{transform:translateX(18px);background:#fff}
.sld{width:100%;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;
  background:var(--line2);outline:none}
.sld::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:10px;
  background:var(--acc);border:none}
.sld::-moz-range-thumb{width:20px;height:20px;border-radius:10px;background:var(--acc);border:none}

/* ---------- animations ---------- */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ring{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes flip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shine{to{opacity:1}}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.72}}
.apop{animation:pop .25s var(--pop) both}

/* ---------- toasts ---------- */
#toasts{position:fixed;left:0;right:0;top:calc(var(--safe-t) + 8px);z-index:4000;display:flex;
  flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{display:flex;align-items:center;gap:8px;max-width:94vw;padding:10px 14px;border-radius:10px;
  font-size:13px;background:var(--surf2);border:1px solid var(--line2);animation:tin .22s var(--out) both;
  box-shadow:0 6px 20px rgba(0,0,0,.5)}
.toast.g{border-color:#1e4a26}
.toast.b{border-color:#5c2a28}
.toast.a{border-color:#4a3a12}
.toast.out{animation:tout .2s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

/* ---------- modales ---------- */
#ovl{position:fixed;inset:0;z-index:3000;pointer-events:none}
.mod{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(1,4,9,.78);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  pointer-events:auto;animation:fin .18s ease both}
@keyframes fin{from{opacity:0}to{opacity:1}}
.mod.out{animation:fin .16s ease reverse both}
.modB{position:relative;width:min(400px,94vw);max-height:86vh;overflow:auto;padding:20px;
  border-radius:14px;background:var(--surf);border:1px solid var(--line2);animation:min .24s var(--out) both}
@keyframes min{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.modT{font-size:17px;font-weight:700;text-align:center;margin:0 0 6px;color:var(--tx)}
.modX{text-align:center;font-size:13.5px;color:var(--tx2);line-height:1.55;margin:0 0 14px}
.modA{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.modC{position:absolute;top:10px;right:10px;min-height:30px;padding:5px 9px}
#cfti{position:fixed;inset:0;z-index:3500;pointer-events:none}
#netb{position:fixed;z-index:2500;right:10px;bottom:calc(var(--nav-h) + var(--safe-b) + 8px);
  display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;font-size:9.5px;
  letter-spacing:.05em;color:var(--tx3);pointer-events:none;background:var(--surf);border:1px solid var(--line)}
#netb i{width:5px;height:5px;border-radius:3px;background:var(--tx3);font-style:normal}
#netb.on i{background:var(--ok)}
#netb.wt i{background:var(--acc);animation:ring 1.4s infinite}

/* ============================================================
   DUEL
   ============================================================ */
.duel{position:fixed;inset:0;z-index:2800;display:flex;flex-direction:column;overflow:hidden;
  padding-top:var(--safe-t);padding-bottom:var(--safe-b);background:var(--bg);
  animation:fin .25s ease both}
.duel.out{animation:fin .2s ease reverse forwards}
.stage{position:absolute;inset:0;overflow:hidden;background:#000}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5;
  transition:opacity .3s}
.duel.camon .stage video{opacity:.9}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.vig{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(3,6,11,.9) 0%,rgba(3,6,11,.25) 26%,rgba(3,6,11,.25) 56%,rgba(3,6,11,.94) 100%)}

.dTop{position:relative;z-index:3;padding:8px 12px 0}
.fgs{display:flex;align-items:stretch;gap:8px}
.fg{flex:1;padding:8px 10px;border-radius:10px;min-width:0;background:rgba(13,17,23,.72);
  border:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:border-color .25s}
.fg.led{border-color:var(--acc)}
.fgH{display:flex;align-items:center;gap:7px}
.fgH .av{width:26px;height:26px;font-size:14px;flex:0 0 auto}
.fgN{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fgT{font-size:10px;color:var(--tx3)}
.fgS{font-size:34px;font-weight:700;line-height:1.1;text-align:center;letter-spacing:-.02em}
.fg.op .fgS{color:var(--tx2)}
.fgS.bump{animation:sbump .22s var(--pop)}
@keyframes sbump{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
.fgB{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.fgB i{display:block;height:100%;background:var(--info);transition:width .3s var(--out)}
.fg.op .fgB i{background:var(--no)}
.fgX{font-size:9.5px;color:var(--tx3);text-align:center;margin-top:4px;height:12px;overflow:hidden}
.vs{align-self:center;flex:0 0 auto;font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:.1em}

.dTim{position:relative;z-index:3;text-align:center;margin:10px 0 0}
.dTim b{font-size:26px;font-weight:700;display:block;line-height:1;letter-spacing:.02em;
  font-variant-numeric:tabular-nums}
.dTim small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)}
.dTim.urg b{color:var(--no)}

.dMid{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;padding:6px 12px;min-height:0}
.ring{position:relative;width:min(168px,44vw);aspect-ratio:1;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.rbg{stroke:rgba(255,255,255,.08);stroke-width:3}
.rfg{stroke:var(--acc);stroke-width:3;transition:stroke-dashoffset .18s linear}
.rN{font-size:min(62px,16vw);font-weight:700;line-height:1;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.rN.bump{animation:rbump .22s var(--pop)}
@keyframes rbump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.rL{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);margin-top:2px}
.rPulse{position:absolute;inset:-2px;border-radius:50%;border:1px solid var(--acc);opacity:0}
.ring.fl .rPulse{animation:rfl .4s var(--out)}
@keyframes rfl{0%{opacity:.8;transform:scale(.96)}100%{opacity:0;transform:scale(1.1)}}

.post{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tx2);font-weight:600}
.post i{width:7px;height:7px;border-radius:4px;background:var(--tx3);font-style:normal}
.post.down i{background:var(--no)}
.post.up i{background:var(--ok)}

.gauges{display:flex;gap:8px;width:100%;max-width:380px}
.gg{flex:1;padding:8px 10px;border-radius:10px;background:rgba(13,17,23,.72);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ggH{display:flex;justify-content:space-between;align-items:baseline;font-size:9.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.ggV{font-size:16px;font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums}
.ggV.warn{color:var(--acc)}
.ggV.bad{color:var(--no)}
.ggB{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.ggB i{display:block;height:100%;background:var(--tx2);transition:width .12s linear}

.chat{display:flex;flex-direction:column}

.bars s{font-size:8.5px;color:var(--tx3);text-decoration:none}
.bars b{font-size:8.5px;color:var(--tx3);font-weight:600}
.qst{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;margin-bottom:6px;

.pt div.can{border-color:var(--acc)}

function decode(str){try{let s=String(str).trim().replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4)s+='=';const bin=atob(s);const b=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(b));}catch(e){return null;}}

const Bus=(()=>{const m={};return{
  on(e,f){(m[e]=m[e]||[]).push(f);return()=>Bus.off(e,f);},
  off(e,f){if(m[e])m[e]=m[e].filter(x=>x!==f);},
  emit(e,d){(m[e]||[]).slice().forEach(f=>{try{f(d);}catch(x){console.error('[bus:'+e+']',x);}});}
};})();

const Loop=(()=>{const s=new Set();let run=0,last=0;
  function fr(t){if(!run)return;const dt=Math.min(64,t-last)||16;last=t;
    s.forEach(f=>{try{f(dt,t);}catch(e){console.error(e);}});requestAnimationFrame(fr);}
  return{add(f){s.add(f);if(!run){run=1;last=performance.now();requestAnimationFrame(fr);}return()=>s.delete(f);}};
})();

function debounce(f,ms){let t;return function(){clearTimeout(t);const a=arguments,c=this;t=setTimeout(()=>f.apply(c,a),ms);};}

  if(!t||!root.contains(t))return;const f=map[t.dataset.a];if(f){e.preventDefault();f(t,e);}});}
/** angle ABC en degrés (B = sommet) */
function angleAt(a,b,c){
  const v1x=a.x-b.x,v1y=a.y-b.y,v2x=c.x-b.x,v2y=c.y-b.y;
  const d=Math.sqrt(v1x*v1x+v1y*v1y)*Math.sqrt(v2x*v2x+v2y*v2y);
  if(d<1e-6)return 0;
  return Math.acos(clamp((v1x*v2x+v1y*v2y)/d,-1,1))*180/Math.PI;
}

function deepMerge(b,o){
  if(o==null||typeof o!=='object'||Array.isArray(o))return o===undefined?b:o;
  const out=Array.isArray(b)?b.slice():Object.assign({},b);
  for(const k in o){if(!Object.prototype.hasOwnProperty.call(o,k))continue;
    const bv=out[k],ov=o[k];
    out[k]=(bv&&typeof bv==='object'&&!Array.isArray(bv)&&ov&&typeof ov==='object'&&!Array.isArray(ov))
      ?deepMerge(bv,ov):ov;}
  return out;
}

  if(c.gold)S.profile.gold-=c.gold;if(c.gems)S.profile.gems-=c.gems;Bus.emit('res:any');save();return 1;}
function addTrophies(n){const p=S.profile,b=arenaFor(p.trophies);
  p.trophies=Math.max(0,p.trophies+Math.round(n));
  if(p.trophies>p.bestTrophies)p.bestTrophies=p.trophies;
  const a=arenaFor(p.trophies);
  if(a.id>b.id)Bus.emit('arenaup',a);
  Bus.emit('res:any');save();}

function effect(fx){let t=0;
  for(const id of S.deck){const T=TAL[id];if(!T)continue;const c=S.cards[id];if(!c)continue;
    if(T.fx===fx)t+=tVal(T,c.l);
    if(T.fx==='royalPct'&&(fx==='goldPct'||fx==='xpPct'||fx==='trophyPct'))t+=tVal(T,c.l);
    if(T.fx==='goldAllPct'&&fx==='goldPct')t+=tVal(T,c.l);}
  return t;}

function addCard(id,n){const T=TAL[id];if(!T)return null;let c=S.cards[id];const isNew=!c;
  if(!c)c=S.cards[id]={c:0,l:1};c.c+=n;save();return{isNew,card:c,t:T};}
function cardNeed(id){const T=TAL[id],c=S.cards[id];if(!T||!c)return 0;
  const u=RAR[T.r].up;return c.l-1<u.length?u[c.l-1]:Infinity;}
function cardCost(id){const T=TAL[id],c=S.cards[id];if(!T||!c)return 0;
  const g=RAR[T.r].gold;return c.l-1<g.length?g[c.l-1]:Infinity;}
function canUp(id){const c=S.cards[id];if(!c)return 0;
  const n=cardNeed(id);return isFinite(n)&&c.c>=n&&S.profile.gold>=cardCost(id);}
function upCard(id){if(!canUp(id))return 0;const n=cardNeed(id),g=cardCost(id),c=S.cards[id];
  c.c-=n;c.l++;S.profile.gold-=g;addXp(8+c.l*3);Bus.emit('res:any');save();return 1;}

const chestDur=t=>Math.round((CHESTS[t].h||0)*36e5*(1-Math.min(.6,effect('chestSpeed')/100)));
function grantChest(t){const i=S.chests.findIndex(c=>!c);if(i<0)return 0;
  S.chests[i]={type:t,state:'locked',start:0,dur:chestDur(t)};Bus.emit('chests');save();return 1;}
const randChest=()=>weighted(CHEST_POOL.map(k=>({k,w:CHESTS[k].w}))).k;
function startUnlock(i){const c=S.chests[i];if(!c||c.state!=='locked')return 0;
  if(S.chests.some(x=>x&&x.state==='unlocking'))return 0;
  c.state='unlocking';c.start=Date.now();Bus.emit('chests');save();return 1;}
const chestLeft=c=>!c?0:c.state!=='unlocking'?(c.state==='ready'?0:c.dur):Math.max(0,c.start+c.dur-Date.now());
const chestRdy=c=>c&&(c.state==='ready'||(c.state==='unlocking'&&chestLeft(c)<=0));
const gemSkip=c=>Math.max(1,Math.ceil(chestLeft(c)/36e5*10));

function rollLoot(type){
  const C=CHESTS[type],luck=1+effect('luckPct')/100,out={gold:0,gems:0,cards:[]};
  out.gold=rndI(C.g[0],C.g[1]);if(C.m)out.gems=rndI(C.m[0],C.m[1]);
  const by={common:[],rare:[],epic:[],legend:[],champ:[]};
  TALENTS.forEach(t=>by[t.r].push(t));
  const total=C.c;let left=total;
  const give=(t,n)=>{const e=out.cards.find(x=>x.id===t.id);if(e)e.n+=n;else out.cards.push({id:t.id,n,rar:t.r});};
  if(C.fl){give(pick(Math.random()<.1*luck&&by.champ.length?by.champ:by.legend),1);return out;}
  const tryR=(k,ch,cnt)=>{if(left<=0||!by[k].length)return;
    if(Math.random()<Math.min(.95,ch*luck)){const n=Math.min(left,cnt);give(pick(by[k]),n);left-=n;}};
  tryR('champ',C.champ,1);tryR('legend',C.legend,1);tryR('epic',C.epic,Math.max(1,Math.floor(total*.06)));
  let rn=Math.floor(C.rare)+(Math.random()<(C.rare%1)?1:0);
  for(let i=0;i<rn&&left>0;i++){const n=Math.min(left,Math.max(1,Math.floor(total*.12)));give(pick(by.rare),n);left-=n;}
  let guard=40;
  while(left>0&&guard-->0){const n=Math.min(left,Math.max(1,Math.ceil(total*.25)));give(pick(by.common),n);left-=n;}
  return out;
}
function applyLoot(l){
  const r={gold:l.gold,gems:l.gems,cards:[]};
  addGold(l.gold,1);addGems(l.gems,1);
  l.cards.forEach(c=>{const x=addCard(c.id,c.n);r.cards.push({id:c.id,n:c.n,rar:c.rar,isNew:x&&x.isNew});});
  addXp(Math.round(l.cards.reduce((a,c)=>a+c.n,0)*1.5));
  qProgress('chests',1);Bus.emit('res:any');save();return r;
}
function openChest(i){const c=S.chests[i];if(!chestRdy(c))return null;
  const l=rollLoot(c.type);S.chests[i]=null;Bus.emit('chests');return{type:c.type,loot:l};}
function addCrowns(n){const c=S.crown;if(c.rdy)return;c.c=Math.min(10,c.c+n);S.stats.crowns+=n;
  if(c.c>=10)c.rdy=1;Bus.emit('chests');save();}
function claimCrown(){const c=S.crown;if(!c.rdy)return null;c.c=0;c.rdy=0;save();
  return{type:'couronne',loot:rollLoot('couronne')};}

function touchDay(){
  const d=today(),st=S.stats;
  if(st.lastPlayDay===d)return{changed:0,streak:st.streak};
  let broke=0;
  if(st.lastPlayDay){const gap=daysBetween(st.lastPlayDay,d),guard=Math.floor(effect('streakGuard'));
    if(gap>1+guard){st.streak=0;broke=1;}}
  st.streak++;st.lastPlayDay=d;st.sessionCount++;
  if(st.streak>st.bestStreak)st.bestStreak=st.streak;
  save();return{changed:1,streak:st.streak,broke};
}
const streakMult=()=>1+Math.min(.5,S.stats.streak*.04);

function rollQuests(){
  const d=today();if(S.quests.day===d&&S.quests.list.length)return;
  S.quests.day=d;
  S.quests.list=shuffle(QPOOL).slice(0,4).map(q=>{const n=pick(q.ns);
    return{id:q.id+'_'+n,t:q.t.replace('{n}',n),i:q.i,k:q.k,goal:n,p:0,rw:q.rw,done:0,claimed:0};});

function qProgress(k,n){let any=0;
  (S.quests.list||[]).forEach(q=>{if(q.k!==k||q.claimed)return;
    if(k==='bestset'||k==='pr'||k==='form')q.p=Math.max(q.p,n);else q.p+=n;
    if(q.p>=q.goal&&!q.done){q.done=1;any=1;Bus.emit('questdone',q);}});

function claimQuest(id){const q=S.quests.list.find(x=>x.id===id);

function statFor(k){const st=S.stats,p=S.profile;

const passTier=()=>Math.min(PASS_T,Math.floor(S.pass.xp/PASS_XP));
const passPct=()=>(S.pass.xp%PASS_XP)/PASS_XP;
function passClaim(t,p){const k=(p?'p':'f')+t;
  if(S.pass.claimed.indexOf(k)>=0||t>passTier()||t<1)return null;
  if(p&&!S.pass.premium)return null;
  S.pass.claimed.push(k);const rw=passRw(t,p);
  if(rw.type==='gold')addGold(rw.v,1);if(rw.type==='gems')addGems(rw.v,1);
  if(rw.type==='chest')grantChest(rw.v);
  Bus.emit('res:any');save();return rw;}

function recordSession(reps,sec,bestSet,form){
  const st=S.stats;st.totalReps+=reps;st.totalTimeSec+=Math.round(sec);
  st.calories+=Math.round(reps*.32*(1+effect('calPct')/100));
  if(bestSet>st.bestSet){st.bestSet=bestSet;qProgress('pr',1);}
  if(form>0){st.formSum+=form;st.formN++;if(form>st.bestForm)st.bestForm=Math.round(form);qProgress('form',Math.round(form));}
  const d=today();st.repsByDay[d]=(st.repsByDay[d]||0)+reps;
  const ks=Object.keys(st.repsByDay);
  if(ks.length>120)ks.sort().slice(0,ks.length-120).forEach(k=>delete st.repsByDay[k]);
  qProgress('reps',reps);qProgress('bestset',bestSet);checkAchs();
  Bus.emit('session:reps',reps);save();
}
function recordDuel(r){
  const st=S.stats;st.totalDuels++;
  if(r.result==='win'){st.wins++;st.winStreak++;if(st.winStreak>st.bestWinStreak)st.bestWinStreak=st.winStreak;}
  else if(r.result==='lose'){st.losses++;st.winStreak=0;}else st.draws++;
  if(r.mode==='sprint'&&r.myReps>st.bestSprint60)st.bestSprint60=r.myReps;
  if(r.mode==='sprint30'&&r.myReps>st.bestSprint30)st.bestSprint30=r.myReps;
  S.history.unshift({id:uid(8),ts:Date.now(),mode:r.mode,opp:r.oppName,oppAv:r.oppAvatar,
    my:r.myReps,op:r.oppReps,res:r.result,dt:r.delta||0,dur:Math.round(r.seconds||0),
    form:Math.round(r.form||0),bot:!!r.bot});

function pubProfile(){return{id:S.profile.id,code:S.profile.code,name:S.profile.name||'Athlète',

const SND=(()=>{
  let ctx=null,mas=null,sfxG=null,musG=null,musT=null,step=0,ready=0;

    ctx=new AC();mas=ctx.createGain();mas.gain.value=.9;mas.connect(ctx.destination);
    sfxG=ctx.createGain();sfxG.gain.value=.85;sfxG.connect(mas);
    musG=ctx.createGain();musG.gain.value=.16;musG.connect(mas);ready=1;return ctx;}
  function unlock(){init();if(ctx&&ctx.state==='suspended')ctx.resume();}
  const on=()=>S.settings.sfx!==0;
  function tone(o){if(!ready||!on())return;const t0=ctx.currentTime+(o.delay||0);
    const os=ctx.createOscillator(),g=ctx.createGain();
    os.type=o.type||'sine';os.frequency.setValueAtTime(o.f||440,t0);

    let node=os;
    if(o.filter){const f=ctx.createBiquadFilter();f.type=o.filter;f.frequency.value=o.cut||1200;os.connect(f);node=f;}
    node.connect(g);g.connect(o.bus||sfxG);os.start(t0);os.stop(t0+(o.dur||.2)+.05);}
  function noise(o){if(!ready||!on())return;o=o||{};const dur=o.dur||.25;

    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,o.decay||2);

    const g=ctx.createGain();g.gain.value=o.vol==null?.25:o.vol;

  const L={

    error(){tone({f:200,f2:120,dur:.22,type:'sawtooth',vol:.18,filter:'lowpass',cut:900});},
    coin(){tone({f:980,dur:.07,type:'square',vol:.15});tone({f:1460,dur:.13,type:'square',vol:.12,delay:.06});},
    gem(){tone({f:1200,dur:.08,vol:.17});tone({f:1800,dur:.16,vol:.13,delay:.07});},
    rep(){tone({f:760,f2:1180,dur:.1,type:'triangle',vol:.26});noise({f:1800,dur:.06,vol:.08});},
    down(){tone({f:300,f2:220,dur:.09,vol:.11});},
    beep(){tone({f:620,dur:.16,type:'square',vol:.24});},
    go(){tone({f:980,dur:.3,type:'square',vol:.3});tone({f:1470,dur:.4,type:'square',vol:.2,delay:.05});},
    swoosh(){noise({f:1400,dur:.3,vol:.16,filter:'highpass',decay:1.4});},
    unlock(){[523,659,784].forEach((f,i)=>tone({f,dur:.18,type:'triangle',vol:.2,delay:i*.06}));},
    shake(){noise({f:420,dur:.14,vol:.18,filter:'lowpass'});},
    chest(){noise({f:700,dur:.5,vol:.3,filter:'lowpass',decay:1.2});
      [523,659,784,1047,1319].forEach((f,i)=>tone({f,dur:.5,type:'triangle',vol:.18,delay:i*.07}));},
    rare(){[784,1047].forEach((f,i)=>tone({f,dur:.3,vol:.2,delay:i*.08}));},
    epic(){[659,880,1175].forEach((f,i)=>tone({f,dur:.35,type:'triangle',vol:.22,delay:i*.09}));},
    legend(){[523,659,784,1047,1319,1568].forEach((f,i)=>tone({f,dur:.6,type:'sawtooth',vol:.15,delay:i*.1,filter:'lowpass',cut:3000}));
      noise({f:2600,dur:.9,vol:.12,filter:'highpass',decay:1});},
    win(){[523,659,784,1047].forEach((f,i)=>tone({f,dur:.5,type:'square',vol:.16,delay:i*.11,filter:'lowpass',cut:2400}));
      tone({f:1568,dur:.8,type:'triangle',vol:.2,delay:.46});},
    lose(){[440,392,330,262].forEach((f,i)=>tone({f,dur:.4,type:'sawtooth',vol:.13,delay:i*.13,filter:'lowpass',cut:1200}));},
    levelup(){[392,523,659,784,1047].forEach((f,i)=>tone({f,dur:.45,type:'triangle',vol:.2,delay:i*.08}));},
    arena(){[523,784,1047,1568].forEach((f,i)=>tone({f,dur:.7,type:'square',vol:.17,delay:i*.12,filter:'lowpass',cut:2800}));
      noise({f:1200,dur:1,vol:.12,decay:1.4});},
    msg(){tone({f:880,f2:1180,dur:.1,vol:.13});},
    emote(){tone({f:500,f2:1100,dur:.18,type:'triangle',vol:.17});},
    lead(){tone({f:1046,dur:.12,type:'triangle',vol:.17});tone({f:1568,dur:.16,type:'triangle',vol:.11,delay:.08});},

  function confetti(n,o){if(!C.cx)cfInit();if(!C.cx)return;o=o||{};
    const x=o.x==null?C.W/2:o.x,y=o.y==null?C.H*.38:o.y,sp=o.spread||1;
    for(let i=0;i<(n||80);i++){const a=o.dir!=null?o.dir+rnd(-.6,.6):rnd(0,6.283),s=rnd(3,12)*sp;
      C.l.push({x:x+rnd(-14,14),y:y+rnd(-14,14),vx:Math.cos(a)*s,vy:Math.sin(a)*s-rnd(1,5),
        g:rnd(.16,.3),w:rnd(5,10),h:rnd(7,14),rot:rnd(0,6.283),vr:rnd(-.28,.28),
        c:o.color||pick(COL),life:rnd(70,145),t:0,sh:Math.random()<.25?1:0});}
    if(!C.on){C.on=1;requestAnimationFrame(cfFrame);}}
  function cfFrame(){const cx=C.cx;cx.clearRect(0,0,C.W,C.H);
    for(let i=C.l.length-1;i>=0;i--){const p=C.l[i];p.t++;p.vy+=p.g;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      const a=p.t>p.life*.7?1-(p.t-p.life*.7)/(p.life*.3):1;
      if(p.t>p.life||p.y>C.H+40){C.l.splice(i,1);continue;}
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.globalAlpha=Math.max(0,a);cx.fillStyle=p.c;
      if(p.sh){cx.beginPath();cx.arc(0,0,p.w/2,0,6.283);cx.fill();}else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      cx.restore();}
    cx.globalAlpha=1;
    if(C.l.length)requestAnimationFrame(cfFrame);else{C.on=0;cx.clearRect(0,0,C.W,C.H);}}
  function toast(m,k,i){const host=$('#toasts');if(!host)return;
    const el=h('<div class="toast '+(k||'')+'">'+(i?'<span style="font-size:18px">'+i+'</span>':'')+
      '<span>'+esc(m)+'</span></div>');
    host.appendChild(el);while(host.children.length>4)host.firstElementChild.remove();
    setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300);},k==='b'?2900:2100);}
  function floatText(t,x,y,c){
    const el=h('<div style="position:fixed;z-index:3400;pointer-events:none;font-family:var(--ft);'+
      'font-size:20px;color:'+(c||'#ffd24a')+';text-shadow:0 3px 0 rgba(0,0,0,.6);left:'+x+'px;top:'+y+
      'px;transform:translate(-50%,-50%)">'+esc(t)+'</div>');
    document.body.appendChild(el);
    el.animate([{transform:'translate(-50%,-50%) scale(.6)',opacity:0},
      {transform:'translate(-50%,-140%) scale(1.15)',opacity:1,offset:.35},
      {transform:'translate(-50%,-250%) scale(1)',opacity:0}],
      {duration:1050,easing:'cubic-bezier(.16,1,.3,1)'}).onfinish=()=>el.remove();}
  let shT=0;
  function shake(p,ms){const a=$('#app');if(!a)return;p=p||6;ms=ms||330;const t0=performance.now();
    clearInterval(shT);
    shT=setInterval(()=>{const k=1-(performance.now()-t0)/ms;
      if(k<=0){clearInterval(shT);a.style.transform='';return;}
      a.style.transform='translate('+(rnd(-1,1)*p*k)+'px,'+(rnd(-1,1)*p*k)+'px)';},16);}
  function burstAt(n,c){const r=n.getBoundingClientRect();
    confetti(24,{x:r.left+r.width/2,y:r.top+r.height/2,color:c,spread:.8});}
  function bindPress(){document.addEventListener('pointerdown',e=>{
    const b=e.target.closest('.btn,.tbtn,.nv,.mo,.ch,.tc,.of,.row,.emo,.tab,.pick>button');
    if(!b)return;SND.unlock();SND.play(b.classList.contains('nv')?'nav':'tap');vibrate(8);},{passive:true});}
  function init(){bgInit();cfInit();bindPress();}
  return{init,confetti,toast,floatText,shake,burstAt};
})();

/* ============================ 6. RÉSEAU P2P (sans serveur) ============================
   1) Trystero + relais publics gratuits  → matchmaking, chat, amis
   2) BroadcastChannel                    → plusieurs onglets d'un même appareil
   3) WebRTC manuel par code              → marche partout, zéro infrastructure
   4) Rien                                → adversaires simulés
   ==================================================================================== */
const NET=(()=>{
  const APP='pompes-royale-v1',ROOM='lobby-fr',HELLO=6000,TTL=22000,HS=5000;
  const N={status:'off',transport:null,selfId:'me_'+uid(10),peers:{},hs:{},seeking:null,
    mmState:null,duel:null,pendingStart:{}};
  const env=(t,d)=>({t,f:N.selfId,d,ts:Date.now()});
  function dispatch(m,from){if(!m||!m.t)return;const p=N.peers[from];if(p)p.last=Date.now();
    (N.hs[m.t]||[]).forEach(f=>{try{f(m.d,from,m);}catch(e){console.error(e);}});}
  function on(t,f){(N.hs[t]=N.hs[t]||[]).push(f);return()=>off(t,f);}
  function off(t,f){if(N.hs[t])N.hs[t]=N.hs[t].filter(x=>x!==f);}
  function send(t,d,to){if(!N.transport)return 0;try{N.transport.send(env(t,d),to);return 1;}catch(e){return 0;}}

  const CDN=['https://esm.sh/trystero@0.21.5/nostr',
             'https://cdn.jsdelivr.net/npm/trystero@0.21.5/+esm',
             'https://esm.sh/trystero@0.21.5/torrent'];
  async function tryP2P(){
    let mod=null;
    for(const u of CDN){
      try{mod=await Promise.race([import(u),new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),9000))]);
        if(mod&&mod.joinRoom)break;mod=null;}catch(e){mod=null;}}
    if(!mod)throw new Error('P2P indisponible');
    const room=mod.joinRoom({appId:APP},ROOM);
    const[snd,get]=room.makeAction('m');
    get((p,id)=>dispatch(p,id));
    room.onPeerJoin(id=>{N.peers[id]=N.peers[id]||{id,profile:null,last:Date.now(),rtt:0};
      Bus.emit('net:peers');hello(id);});
    room.onPeerLeave(id=>{delete N.peers[id];Bus.emit('net:peers');});
    return{name:'p2p',send(m,to){snd(m,to||undefined);},close(){try{room.leave();}catch(e){}}};
  }
  function tryLocal(){
    if(!window.BroadcastChannel)throw new Error('BroadcastChannel absent');
    const bc=new BroadcastChannel('pr:'+ROOM);
    bc.onmessage=ev=>{const m=ev.data;if(!m||m.f===N.selfId)return;if(m.to&&m.to!==N.selfId)return;
      if(!N.peers[m.f]){N.peers[m.f]={id:m.f,profile:null,last:Date.now(),rtt:0};Bus.emit('net:peers');hello(m.f);}
      dispatch(m,m.f);};
    return{name:'local',send(m,to){m.to=to||null;bc.postMessage(m);},close(){try{bc.close();}catch(e){}}};
  }
  function hello(to){send('hello',pubProfile(),to);}
  let pT=null;
  function startPresence(){stopPresence();hello();
    pT=setInterval(()=>{hello();const n=Date.now();let ch=0;
      for(const id in N.peers)if(n-N.peers[id].last>TTL){delete N.peers[id];ch=1;}
      if(ch)Bus.emit('net:peers');},HELLO);}
  function stopPresence(){if(pT)clearInterval(pT);pT=null;}
  on('hello',(p,from)=>{const x=N.peers[from]=N.peers[from]||{id:from,last:Date.now(),rtt:0};
    const was=!x.profile;x.profile=p;x.last=Date.now();if(was){Bus.emit('net:peers');ping(from);}});
  const pings={};
  function ping(to){const k=uid(6);pings[k]=performance.now();send('ping',{k,t:Date.now()},to);}
  on('ping',(d,f)=>send('pong',{k:d.k,t1:Date.now()},f));
  on('pong',(d,f)=>{const t=pings[d.k];if(!t)return;delete pings[d.k];
    const rtt=performance.now()-t,p=N.peers[f];
    if(p){p.rtt=Math.round(rtt);p.off=(d.t1+rtt/2)-Date.now();}});

  function chatSend(txt,ch){txt=String(txt).slice(0,220).trim();if(!txt)return null;
    const P=pubProfile();
    const m={id:uid(8),ch:ch||'public',txt,n:P.name,av:P.avatar,tr:P.trophies,ts:Date.now(),
      clan:S.clan?S.clan.name:null};
    send('chat',m);return m;}
  on('chat',(m,f)=>{if(!m||!m.txt)return;m.from=f;Bus.emit('chat:in',m);});

  function lockHs(role,id,peer){N.mmState={role,id,peer,at:Date.now()};}
  function unlockHs(){N.mmState=null;}
  function isPending(){if(!N.mmState)return 0;
    if(Date.now()-N.mmState.at>HS){unlockHs();return 0;}return 1;}
  let seekT=null;
  function bcastSeek(){if(!N.seeking)return;const s=N.seeking;
    send('mm',{mode:s.mode,tr:s.tr,since:s.since,name:s.name,av:s.av});}
  function seekMatch(o){const P=pubProfile();
    N.seeking={mode:o.mode,tr:P.trophies,since:Date.now(),name:P.name,av:P.avatar,onFound:o.onFound};
    bcastSeek();clearInterval(seekT);
    seekT=setInterval(()=>{if(!N.seeking){clearInterval(seekT);seekT=null;return;}bcastSeek();},1200);
    return cancelSeek;}
  function cancelSeek(){N.seeking=null;if(seekT){clearInterval(seekT);seekT=null;}}
  const windowFor=s=>150+(Date.now()-s)/1000*90;
  on('mm',(d,from,msg)=>{
    const s=N.seeking;if(!s||!d||d.mode!==s.mode||isPending())return;
    const w=Math.max(windowFor(s.since),windowFor(d.since||Date.now()));
    if(Math.abs(d.tr-s.tr)>w)return;
    // départage sur deux identifiants du MÊME espace de noms
    const theirs=(msg&&msg.f)||from;
    if(N.selfId<theirs){
      const id='d_'+uid(10),startAt=Date.now()+4600;
      N.pendingStart[id]=startAt;lockHs('prop',id,from);
      send('mm:req',{id,mode:s.mode,startAt,tr:s.tr,name:s.name,av:s.av},from);}
  });
  on('mm:req',(d,from)=>{
    const s=N.seeking;
    if(!s||d.mode!==s.mode||isPending()){send('mm:no',{id:d.id},from);return;}
    lockHs('resp',d.id,from);cancelSeek();
    const P=pubProfile();
    send('mm:ok',{id:d.id,tr:P.trophies,name:P.name,av:P.avatar},from);
    const opp={id:from,name:d.name,avatar:d.av,trophies:d.tr,bot:0};
    startNetDuel(d.id,d.mode,opp,d.startAt,from);unlockHs();
    if(s.onFound)s.onFound(opp,d.mode,d.startAt,d.id);});
  on('mm:ok',(d,from)=>{
    const s=N.seeking;if(!s||!N.mmState||N.mmState.id!==d.id)return;
    unlockHs();const mode=s.mode,cb=s.onFound;cancelSeek();
    const opp={id:from,name:d.name,avatar:d.av,trophies:d.tr,bot:0};
    const startAt=N.pendingStart[d.id]||(Date.now()+4600);
    startNetDuel(d.id,mode,opp,startAt,from);
    if(cb)cb(opp,mode,startAt,d.id);});
  on('mm:no',d=>{if(N.mmState&&N.mmState.id===d.id)unlockHs();});

  function startNetDuel(id,mode,opp,startAt,peer){N.duel={id,mode,opp,startAt,peer,oppReps:0};}
  function endNetDuel(){N.duel=null;}
  function duelSend(t,d){if(!N.duel)return;send('duel:'+t,Object.assign({id:N.duel.id},d),N.duel.peer);}
  on('duel:rep',d=>{if(!N.duel||d.id!==N.duel.id)return;N.duel.oppReps=d.n;
    Bus.emit('duel:opp',{reps:d.n,form:d.fm});});
  on('duel:sync',d=>{if(!N.duel||d.id!==N.duel.id)return;N.duel.oppReps=d.n;
    Bus.emit('duel:opp',{reps:d.n,form:d.fm});});
  on('duel:emote',d=>{if(N.duel&&d.id===N.duel.id)Bus.emit('duel:emote',d.e);});
  on('duel:end',d=>{if(N.duel&&d.id===N.duel.id)Bus.emit('duel:oppend',d);});
  on('duel:quit',d=>{if(N.duel&&d.id===N.duel.id)Bus.emit('duel:oppquit',d);});

  function invite(peerId,mode){const P=pubProfile(),id='d_'+uid(10),startAt=Date.now()+5600;
    send('inv',{id,mode,startAt,name:P.name,av:P.avatar,tr:P.trophies},peerId);return{id,startAt};}
  on('inv',(d,from)=>Bus.emit('net:invite',{from,id:d.id,mode:d.mode,startAt:d.startAt,
    opp:{id:from,name:d.name,avatar:d.av,trophies:d.tr,bot:0}}));
  function inviteAccept(i){const P=pubProfile();
    send('inv:ok',{id:i.id,name:P.name,av:P.avatar,tr:P.trophies},i.from);
    startNetDuel(i.id,i.mode,i.opp,i.startAt,i.from);return i;}
  function inviteRefuse(i){send('inv:no',{id:i.id},i.from);}
  on('inv:ok',(d,f)=>Bus.emit('net:inviteok',{from:f,d}));
  on('inv:no',()=>Bus.emit('net:inviteno'));

  const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},
    {urls:'stun:global.stun.twilio.com:3478'}]};
  const Manual={pc:null,dc:null,
    async createOffer(){Manual.close();const pc=Manual.pc=new RTCPeerConnection(ICE);
      const dc=Manual.dc=pc.createDataChannel('pr',{ordered:true});wire(dc);
      await pc.setLocalDescription(await pc.createOffer());await waitIce(pc);
      return encode({r:'o',sdp:pc.localDescription.sdp,p:pubProfile()});},
    async acceptOffer(code){const d=decode(code);if(!d||d.r!=='o')throw new Error('Code invalide');
      Manual.close();const pc=Manual.pc=new RTCPeerConnection(ICE);
      pc.ondatachannel=e=>{Manual.dc=e.channel;wire(e.channel);};
      await pc.setRemoteDescription({type:'offer',sdp:d.sdp});
      await pc.setLocalDescription(await pc.createAnswer());await waitIce(pc);
      return{code:encode({r:'a',sdp:pc.localDescription.sdp,p:pubProfile()}),profile:d.p};},
    async acceptAnswer(code){const d=decode(code);if(!d||d.r!=='a')throw new Error('Code invalide');
      await Manual.pc.setRemoteDescription({type:'answer',sdp:d.sdp});return d.p;},
    close(){try{if(Manual.dc)Manual.dc.close();}catch(e){}try{if(Manual.pc)Manual.pc.close();}catch(e){}
      Manual.pc=Manual.dc=null;}};
  function waitIce(pc){return new Promise(res=>{if(pc.iceGatheringState==='complete')return res();
    const t=setTimeout(res,3500);
    pc.onicegatheringstatechange=()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);res();}};});}
  function wire(dc){
    dc.onopen=()=>{N.peers.manual=N.peers.manual||{id:'manual',profile:null,last:Date.now(),rtt:0};
      N.transport={name:'manual',send(m){try{if(dc.readyState==='open')dc.send(JSON.stringify(m));}catch(e){}},
        close(){Manual.close();}};
      setStatus('online');hello('manual');Bus.emit('net:manual',{open:1});};
    dc.onmessage=e=>{try{dispatch(JSON.parse(e.data),'manual');}catch(x){}};
    dc.onclose=()=>{delete N.peers.manual;Bus.emit('net:manual',{open:0});};}

  function setStatus(s){N.status=s;Bus.emit('net:status',s);
    const b=$('#netb');if(!b)return;b.classList.remove('hide','on','wt');
    const lbl={off:'hors-ligne',connecting:'connexion…',online:'en ligne',local:'local',solo:'solo'}[s]||s;
    b.querySelector('span').textContent=lbl+(s==='online'?' · '+Object.keys(N.peers).length:'');
    if(s==='online')b.classList.add('on');else if(s==='connecting')b.classList.add('wt');}
  Bus.on('net:peers',()=>{if(N.status==='online'||N.status==='local')setStatus(N.status);});

  let inited=0;
  async function init(){
    if(inited)return N.status;inited=1;setStatus('connecting');
    if(navigator.onLine!==false){
      try{N.transport=await tryP2P();setStatus('online');startPresence();return 'online';}
      catch(e){console.info('[net] P2P :',e.message);}}
    try{N.transport=tryLocal();setStatus('local');startPresence();return 'local';}catch(e){}
    setStatus('solo');return 'solo';}
  const peerList=()=>Object.values(N.peers).filter(p=>p.profile)
    .sort((a,b)=>(b.profile.trophies||0)-(a.profile.trophies||0));
  const isOnline=()=>N.status==='online'||N.status==='local';
  return Object.assign(N,{init,on,off,send,hello,peerList,isOnline,isPending,chatSend,seekMatch,
    cancelSeek,startNetDuel,endNetDuel,duelSend,invite,inviteAccept,inviteRefuse,Manual,setStatus});
})();

/* ============================ 7. TRACKER DE POSE ============================
   Détection du squelette (MoveNet) → angle du coude → comptage des pompes.
   Repli automatique : mouvement lumineux, puis manuel.
   ============================================================================ */
const TR=(()=>{
  const T={mode:'idle',active:0,reps:0,state:'up',ready:0,loading:0,
    elbow:180,body:180,form:0,quality:0,visible:0,conf:0,
    minElbow:180,formSum:0,formN:0,repForm:0,lastRepAt:0,downAt:0,
    hist:[],repTimes:[],pose:null,smooth:null,error:null,onRep:null,onState:null,
    stream:null,fps:0,shallow:0};
  const HIST=150;
  // MoveNet / COCO
  const KP={nose:0,lEye:1,rEye:2,lEar:3,rEar:4,lSho:5,rSho:6,lElb:7,rElb:8,lWri:9,rWri:10,
    lHip:11,rHip:12,lKne:13,rKne:14,lAnk:15,rAnk:16};
  const EDGES=[[5,6],[5,7],[7,9],[6,8],[8,10],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16],
    [0,1],[0,2],[1,3],[2,4],[0,5],[0,6]];
  const MINC=0.32;

  /* ---------- caméra ---------- */
  const V={el:null,w:0,h:0};
  async function camStart(facing){
    V.el=$('#cam');
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
      throw new Error("Caméra inaccessible (il faut une page en https ou localhost).");
    const tryOne=c=>navigator.mediaDevices.getUserMedia({video:c,audio:false});
    let st=null;
    const cands=[
      {facingMode:{ideal:facing||'user'},width:{ideal:640},height:{ideal:480},frameRate:{ideal:30}},
      {facingMode:facing||'user'},{width:{ideal:640}},true];
    for(const c of cands){try{st=await tryOne(c);break;}catch(e){T.error=e.message;}}
    if(!st)throw new Error(T.error||'Caméra refusée');
    T.stream=st;V.el.srcObject=st;
    V.el.setAttribute('playsinline','');
    await V.el.play().catch(()=>{});
    for(let i=0;i<40&&!V.el.videoWidth;i++)await sleep(50);
    V.w=V.el.videoWidth||640;V.h=V.el.videoHeight||480;
    return st;
  }
  function camStop(){if(T.stream){T.stream.getTracks().forEach(t=>t.stop());T.stream=null;}
    if(V.el)V.el.srcObject=null;}

  /* ---------- chargement du modèle ---------- */
  let detector=null;
  function loadScript(src){return new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=src;s.async=true;
    const to=setTimeout(()=>rej(new Error('délai dépassé')),14000);
    s.onload=()=>{clearTimeout(to);res();};
    s.onerror=()=>{clearTimeout(to);rej(new Error('échec '+src));};
    document.head.appendChild(s);});}
  let loadPromise=null;
  /** Précharge le modèle en tâche de fond : le duel ne doit jamais l'attendre. */
  function preload(onProg){
    if(detector)return Promise.resolve(detector);
    if(!loadPromise)loadPromise=loadModel(onProg).catch(e=>{loadPromise=null;throw e;});
    return loadPromise;
  }
  async function loadModel(onProg){
    if(detector)return detector;
    T.loading=1;
    const V4='4.22.0',PD='2.1.3',cdn='https://cdn.jsdelivr.net/npm/';
    const files=[
      cdn+'@tensorflow/tfjs-core@'+V4+'/dist/tf-core.min.js',
      cdn+'@tensorflow/tfjs-converter@'+V4+'/dist/tf-converter.min.js',
      cdn+'@tensorflow/tfjs-backend-webgl@'+V4+'/dist/tf-backend-webgl.min.js',
      cdn+'@tensorflow-models/pose-detection@'+PD+'/dist/pose-detection.min.js'];
    for(let i=0;i<files.length;i++){
      if(onProg)onProg(i/(files.length+1),'Téléchargement du modèle…');
      await loadScript(files[i]);}
    if(!window.tf||!window.poseDetection)throw new Error('Modèle indisponible');
    if(onProg)onProg(.8,'Préparation…');
    try{await tf.setBackend('webgl');}catch(e){try{await tf.setBackend('cpu');}catch(x){}}
    await tf.ready();
    detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,
      {modelType:poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING});
    T.loading=0;T.ready=1;
    if(onProg)onProg(1,'Prêt');
    return detector;
  }

  /* ---------- lissage des points ---------- */
  function smoothPose(kps){
    if(!T.smooth){T.smooth=kps.map(k=>({x:k.x,y:k.y,score:k.score}));return T.smooth;}
    for(let i=0;i<kps.length;i++){
      const s=T.smooth[i],k=kps[i];
      const a=k.score>MINC?.55:.25;
      s.x+=(k.x-s.x)*a;s.y+=(k.y-s.y)*a;s.score=s.score*.6+k.score*.4;}
    return T.smooth;
  }

  /* ---------- analyse d'une pose ---------- */
  function analyse(kp){
    const g=i=>kp[i];
    const okc=(...i)=>i.every(x=>kp[x]&&kp[x].score>MINC);
    // bras : on prend le côté le plus visible
    let elbow=null,conf=0;
    if(okc(KP.lSho,KP.lElb,KP.lWri)){
      const c=(kp[KP.lSho].score+kp[KP.lElb].score+kp[KP.lWri].score)/3;
      if(c>conf){conf=c;elbow=angleAt(g(KP.lSho),g(KP.lElb),g(KP.lWri));}}
    if(okc(KP.rSho,KP.rElb,KP.rWri)){
      const c=(kp[KP.rSho].score+kp[KP.rElb].score+kp[KP.rWri].score)/3;
      if(c>conf){conf=c;elbow=angleAt(g(KP.rSho),g(KP.rElb),g(KP.rWri));}}
    // corps : épaule → hanche → cheville (ou genou si cheville absente)
    let body=null;
    const sides=[[KP.lSho,KP.lHip,KP.lAnk,KP.lKne],[KP.rSho,KP.rHip,KP.rAnk,KP.rKne]];
    let bc=0;
    for(const[s,hp,an,kn]of sides){
      const end=kp[an]&&kp[an].score>MINC?an:(kp[kn]&&kp[kn].score>MINC?kn:-1);
      if(end<0||!okc(s,hp))continue;
      const c=(kp[s].score+kp[hp].score+kp[end].score)/3;
      if(c>bc){bc=c;body=angleAt(g(s),g(hp),g(end));}}
    return{elbow,body,conf};
  }

  /* ---------- comptage ---------- */
  function thresholds(){
    const tol=effect('sensDeg');
    return{down:clamp(S.settings.tracker.downAngle+tol,60,130),
           up:clamp(S.settings.tracker.upAngle-tol,120,175)};
  }
  function feedPose(a,now){
    T.conf=a.conf;
    if(a.elbow==null){T.visible=0;push(T.elbow,T.state,0);return;}
    T.visible=1;
    T.elbow=a.elbow;
    if(a.body!=null){
      T.body=a.body;
      const f=clamp(100-Math.abs(180-a.body)*2.1,0,100);
      T.form=T.form?T.form*.85+f*.15:f;
    }
    const th=thresholds();
    const minRep=S.settings.tracker.minRepMs;
    if(T.state==='up'&&a.elbow<th.down){
      T.state='down';T.downAt=now;T.minElbow=a.elbow;T.formSum=T.form;T.formN=1;
      if(T.onState)T.onState('down');SND.play('down');
    }else if(T.state==='down'){
      if(a.elbow<T.minElbow)T.minElbow=a.elbow;
      T.formSum+=T.form;T.formN++;
      if(a.elbow>th.up){
        T.state='up';
        const held=now-T.downAt,since=now-T.lastRepAt;
        if(held>120&&since>minRep){
          const rf=T.formN?T.formSum/T.formN:T.form;
          T.repForm=rf;
          if(S.settings.tracker.strictForm&&rf<55){
            T.shallow++;SND.play('bad');
            if(T.onState)T.onState('bad');
            push(a.elbow/180,T.state,0);return;
          }
          T.lastRepAt=now;count(now,rf);
        }
        if(T.onState)T.onState('up');
      }
    }
    push(clamp(1-(a.elbow-40)/140,0,1),T.state,0);
  }
  function count(now,form){
    T.reps++;T.repTimes.push(now||performance.now());
    if(T.repTimes.length>30)T.repTimes.shift();
    quality();
    if(T.hist.length)T.hist[T.hist.length-1].r=1;
    if(T.onRep)T.onRep(T.reps,form==null?T.form:form);
    Bus.emit('tracker:rep',T.reps);
  }
  function quality(){
    const n=T.repTimes.length;if(n<3){T.quality=60;return;}
    const g=[];for(let i=1;i<n;i++)g.push(T.repTimes[i]-T.repTimes[i-1]);
    const m=g.reduce((a,b)=>a+b,0)/g.length;
    const sd=Math.sqrt(g.reduce((a,b)=>a+(b-m)*(b-m),0)/g.length)/(m||1);
    T.quality=Math.round(clamp((1-sd)*55+(T.form/100)*45,5,100));
  }
  function push(v,st,r){T.hist.push({v:clamp(v,0,1),s:st,r:r||0});if(T.hist.length>HIST)T.hist.shift();}

  /* ---------- repli : mouvement lumineux ---------- */
  const MO={cv:null,cx:null,prev:null,W:48,H:36,ema:null,lo:null,hi:null};
  function moSample(){
    if(!MO.cv){MO.cv=document.createElement('canvas');MO.cv.width=MO.W;MO.cv.height=MO.H;
      MO.cx=MO.cv.getContext('2d',{willReadFrequently:true});}
    if(!V.el||V.el.readyState<2)return null;
    MO.cx.drawImage(V.el,0,0,MO.W,MO.H);
    let d;try{d=MO.cx.getImageData(0,0,MO.W,MO.H).data;}catch(e){return null;}
    let s=0;const n=MO.W*MO.H;
    for(let i=0,p=0;i<n;i++,p+=4)s+=(d[p]*.299+d[p+1]*.587+d[p+2]*.114)/255;
    return 1-s/n;
  }
  function moFeed(raw,now){
    const a=1-Math.exp(-33/90);
    if(MO.ema==null)MO.ema=raw;MO.ema+=(raw-MO.ema)*a;
    const s=MO.ema;
    if(MO.lo==null){MO.lo=s-.01;MO.hi=s+.01;}
    const drift=(MO.hi-MO.lo)*33/9000;
    MO.lo=Math.min(s,MO.lo+drift);MO.hi=Math.max(s,MO.hi-drift);
    const amp=MO.hi-MO.lo,norm=amp>1e-6?(s-MO.lo)/amp:.5;
    if(amp<.022){push(norm,T.state,0);return;}
    const sens=clamp(60+effect('sensDeg'),5,95),band=lerp(.4,.12,sens/100);
    const dn=.5-band/2,upT=.5+band/2;
    if(T.state==='up'&&norm>upT){T.state='down';T.downAt=now;if(T.onState)T.onState('down');SND.play('down');}
    else if(T.state==='down'&&norm<dn){T.state='up';
      if(now-T.downAt>130&&now-T.lastRepAt>S.settings.tracker.minRepMs){T.lastRepAt=now;count(now,0);}
      if(T.onState)T.onState('up');}
    push(norm,T.state,0);
  }

  /* ---------- boucle ---------- */
  let loopOff=null,lastDet=0,detBusy=0,frames=0,fpsT=0,errStreak=0;
  async function tick(dt,t){
    if(!T.active)return;
    const now=performance.now();
    if(T.mode==='pose'){
      if(!detBusy&&now-lastDet>38&&V.el&&V.el.readyState>=2){
        detBusy=1;lastDet=now;
        try{
          const poses=await detector.estimatePoses(V.el,{maxPoses:1,flipHorizontal:false});
          frames++;
          if(now-fpsT>1000){T.fps=frames;frames=0;fpsT=now;}
          if(poses&&poses[0]&&poses[0].keypoints){
            const kp=smoothPose(poses[0].keypoints);
            T.pose=kp;
            feedPose(analyse(kp),now);
            errStreak=0;
          }else{T.visible=0;T.pose=null;}
        }catch(e){
          console.warn('pose',e);
          // si la détection casse en boucle, on repasse en mode simple
          if(++errStreak>=8){T.mode='motion';T.error=e.message;errStreak=0;
            Bus.emit('tracker:downgrade');}
        }
        detBusy=0;
      }
    }else if(T.mode==='motion'){
      if(now-lastDet>33){lastDet=now;const v=moSample();if(v!=null)moFeed(v,now);}
    }
  }

  /* ---------- API ---------- */
  async function start(o){
    o=o||{};
    stop(1);
    T.reps=0;T.state='up';T.hist=[];T.repTimes=[];T.quality=0;T.lastRepAt=0;
    T.form=0;T.elbow=180;T.body=180;T.smooth=null;T.pose=null;T.shallow=0;T.visible=0;
    MO.ema=MO.lo=MO.hi=null;
    const want=o.mode||S.settings.tracker.mode||'auto';
    if(want==='manual'){T.mode='manual';}
    else{
      try{
        await camStart(o.facing);
        if(want==='pose'||want==='auto'){
          if(detector){T.mode='pose';}
          else if(o.waitModel===0){
            // le modèle n'est pas prêt : on démarre en mode simple tout de suite
            // et on bascule sur le squelette dès qu'il a fini de charger.
            T.mode='motion';
            preload(o.onProg).then(()=>{if(T.active&&T.mode==='motion'){T.mode='pose';T.smooth=null;
              Bus.emit('tracker:upgrade');}}).catch(()=>{});
          }else{
            try{await preload(o.onProg);T.mode='pose';}
            catch(e){T.error=e.message;console.info('[pose]',e.message);T.mode='motion';}
          }
        }else T.mode='motion';
      }catch(e){T.error=e.message;T.mode='manual';}
    }
    T.active=1;
    if(loopOff)loopOff();
    loopOff=Loop.add(tick);
    Bus.emit('tracker:start',T.mode);
    return T.mode;
  }
  function stop(q){T.active=0;if(loopOff){loopOff();loopOff=null;}camStop();if(!q)Bus.emit('tracker:stop');}
  function manualRep(){
    const now=performance.now();
    if(now-T.lastRepAt<200)return 0;
    T.lastRepAt=now;T.state=T.state==='up'?'down':'up';
    count(now,T.form||0);push(T.state==='down'?.85:.15,T.state,1);return 1;}
  function reset(){T.reps=0;T.repTimes=[];T.hist=[];T.quality=0;T.shallow=0;}
  const modeLabel=()=>({pose:'Squelette IA',motion:'Mouvement',manual:'Manuel',idle:'—'})[T.mode]||T.mode;

  /* ---------- dessin du squelette ---------- */
  function fit(cv){
    const cw=cv.width,chh=cv.height,vw=V.w||640,vh=V.h||480;
    const sc=Math.max(cw/vw,chh/vh);
    return{sc,dx:(cw-vw*sc)/2,dy:(chh-vh*sc)/2};
  }
  function drawSkeleton(cv,opt){
    if(!cv)return;
    opt=opt||{};
    const d=Math.min(devicePixelRatio||1,2);
    const w=cv.clientWidth,hh=cv.clientHeight;
    if(!w||!hh)return;
    if(cv.width!==Math.round(w*d)){cv.width=Math.round(w*d);cv.height=Math.round(hh*d);}
    const cx=cv.getContext('2d');
    cx.setTransform(1,0,0,1,0,0);
    cx.clearRect(0,0,cv.width,cv.height);
    if(T.mode!=='pose'||!T.pose)return;
    if(!S.settings.tracker.showSkeleton&&!opt.force)return;
    const kp=T.pose,f=fit(cv);
    const P=i=>({x:kp[i].x*f.sc+f.dx,y:kp[i].y*f.sc+f.dy,s:kp[i].score});
    const mirrored=opt.mirror!==0;
    const scale=Math.max(1,cv.width/520);

    // segments
    cx.lineCap='round';cx.lineJoin='round';
    for(const[a,b]of EDGES){
      if(!kp[a]||!kp[b]||kp[a].score<MINC||kp[b].score<MINC)continue;
      const p1=P(a),p2=P(b);
      cx.beginPath();cx.moveTo(p1.x,p1.y);cx.lineTo(p2.x,p2.y);
      cx.strokeStyle='rgba(255,255,255,.92)';cx.lineWidth=4*scale;cx.stroke();
    }
    // bras actif en rouge, ligne du corps en rouge
    const armSide=kp[KP.lElb]&&kp[KP.rElb]&&kp[KP.lElb].score>=kp[KP.rElb].score?'l':'r';
    const A=armSide==='l'?[KP.lSho,KP.lElb,KP.lWri]:[KP.rSho,KP.rElb,KP.rWri];
    const Bd=armSide==='l'?[KP.lSho,KP.lHip,KP.lAnk]:[KP.rSho,KP.rHip,KP.rAnk];
    const line=(idx,col,wd)=>{
      for(let i=0;i<idx.length-1;i++){
        const a=idx[i],b=idx[i+1];
        if(!kp[a]||!kp[b]||kp[a].score<MINC||kp[b].score<MINC)continue;
        const p1=P(a),p2=P(b);
        cx.beginPath();cx.moveTo(p1.x,p1.y);cx.lineTo(p2.x,p2.y);
        cx.strokeStyle=col;cx.lineWidth=wd*scale;cx.stroke();}};
    line(A,T.state==='down'?'#ff5b3d':'#ff8d78',5);
    const bodyCol=T.form>80?'#35d15c':T.form>55?'#ffd24a':'#f4553d';
    line(Bd,bodyCol,5);

    // points
    for(let i=0;i<kp.length;i++){
      if(!kp[i]||kp[i].score<MINC)continue;
      const p=P(i);
      cx.beginPath();cx.arc(p.x,p.y,6*scale,0,6.283);
      cx.fillStyle='#25f07a';cx.fill();
      cx.lineWidth=3*scale;cx.strokeStyle='#e838ff';cx.stroke();
    }
    // étiquette d'angle (dé-miroir du texte)
    if(T.elbow&&kp[A[1]]&&kp[A[1]].score>MINC){
      const p=P(A[1]);
      const txt=Math.round(T.elbow)+'°';
      cx.save();
      cx.translate(p.x+(mirrored?-14*scale:14*scale),p.y-14*scale);
      if(mirrored)cx.scale(-1,1);
      cx.font='700 '+Math.round(17*scale)+'px system-ui,sans-serif';
      cx.textAlign=mirrored?'right':'left';cx.textBaseline='middle';
      cx.lineWidth=4*scale;cx.strokeStyle='rgba(0,0,0,.75)';cx.strokeText(txt,0,0);
      cx.fillStyle=T.state==='down'?'#ff8d78':'#5ef0ff';cx.fillText(txt,0,0);
      cx.restore();
    }
    if(T.body&&kp[Bd[1]]&&kp[Bd[1]].score>MINC){
      const p=P(Bd[1]);
      const txt=Math.round(T.body)+'°';
      cx.save();
      cx.translate(p.x,p.y+18*scale);
      if(mirrored)cx.scale(-1,1);
      cx.font='700 '+Math.round(14*scale)+'px system-ui,sans-serif';
      cx.textAlign='center';cx.textBaseline='middle';
      cx.lineWidth=4*scale;cx.strokeStyle='rgba(0,0,0,.75)';cx.strokeText(txt,0,0);
      cx.fillStyle=bodyCol;cx.fillText(txt,0,0);
      cx.restore();
    }
  }

  /* ---------- courbe du signal ---------- */
  function drawWave(cv){
    if(!cv)return;
    const d=Math.min(devicePixelRatio||1,2),W=cv.clientWidth,H=cv.clientHeight;
    if(!W||!H)return;
    if(cv.width!==Math.round(W*d)){cv.width=Math.round(W*d);cv.height=Math.round(H*d);}
    const cx=cv.getContext('2d');cx.setTransform(d,0,0,d,0,0);cx.clearRect(0,0,W,H);
    const th=thresholds();
    // zones : converties dans le même repère que la courbe (1 = tout en bas des bras)
    const toY=ang=>H-clamp(1-(ang-40)/140,0,1)*H;
    cx.fillStyle='rgba(255,120,90,.13)';cx.fillRect(0,toY(th.down),W,H-toY(th.down));
    cx.fillStyle='rgba(120,240,150,.10)';cx.fillRect(0,0,W,toY(th.up));
    cx.strokeStyle='rgba(255,255,255,.2)';cx.lineWidth=1;cx.setLineDash([3,4]);
    [th.down,th.up].forEach(a=>{cx.beginPath();cx.moveTo(0,toY(a));cx.lineTo(W,toY(a));cx.stroke();});
    cx.setLineDash([]);
    const n=T.hist.length;
    if(n<2){cx.fillStyle='rgba(255,255,255,.3)';cx.font='10px system-ui';cx.textAlign='center';
      cx.fillText('en attente…',W/2,H/2);return;}
    const step=W/(HIST-1),x0=W-(n-1)*step;
    cx.beginPath();
    for(let i=0;i<n;i++){const x=x0+i*step,y=H-T.hist[i].v*H;i?cx.lineTo(x,y):cx.moveTo(x,y);}
    const gr=cx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#ff8d78');gr.addColorStop(1,'#8bf0a4');
    cx.strokeStyle=gr;cx.lineWidth=2.2;cx.lineJoin='round';cx.stroke();
    cx.lineTo(x0+(n-1)*step,H);cx.lineTo(x0,H);cx.closePath();
    cx.fillStyle='rgba(120,190,255,.12)';cx.fill();
    for(let i=0;i<n;i++){if(!T.hist[i].r)continue;
      cx.beginPath();cx.arc(x0+i*step,H-T.hist[i].v*H,3.4,0,6.283);cx.fillStyle='#ffd24a';cx.fill();}
    const last=T.hist[n-1];
    cx.beginPath();cx.arc(W-2,H-last.v*H,4.4,0,6.283);
    cx.fillStyle=last.s==='down'?'#ff8d78':'#8bf0a4';cx.fill();
  }
  /** Injecte une pose directement dans la chaîne d'analyse (tests / debug). */
  function feedKeypoints(kps,t){
    const kp=smoothPose(kps);T.pose=kp;
    feedPose(analyse(kp),t==null?performance.now():t);
    return{elbow:T.elbow,body:T.body,form:T.form,state:T.state,reps:T.reps};}
  Object.assign(T,{start,stop,reset,manualRep,drawSkeleton,drawWave,modeLabel,thresholds,
    loadModel,preload,feedKeypoints,KP});
  Object.defineProperty(T,'video',{get(){return V.el;}});
  Object.defineProperty(T,'vw',{get(){return V.w;}});
  Object.defineProperty(T,'vh',{get(){return V.h;}});
  return T;
})();

/* ============================ 8. INTERFACE ============================ */

  function confirm(t,x,ok){return new Promise(res=>{modal({title:t,text:x,

  function prompt(t,x,ph,val,max){return new Promise(res=>{

  const RC={common:'',rare:'rare',epic:'epic',legend:'legend',champ:'champ'};
  async function openChestAnim(type,loot){

      '<div class="chBox">'+C.i+'</div><div class="chHint">Tape pour ouvrir !</div>'+
      '<div class="loot" style="position:relative;z-index:2"></div></div>');
    $('#ovl').appendChild(box);
    const chest=box.querySelector('.chBox'),hint=box.querySelector('.chHint'),
      lh=box.querySelector('.loot'),rays=box.querySelector('.rays');
    let taps=0;
    return new Promise(resolve=>{
      function onTap(){taps++;SND.play('shake');vibrate(20);
        chest.animate([{transform:'scale(1.18) rotate(-8deg)'},{transform:'scale(1) rotate(0)'}],
          {duration:230,easing:'ease-out'});
        hint.textContent=taps>=3?'':'Encore '+(3-taps)+' !';
        if(taps>=3){box.removeEventListener('click',onTap);reveal();}}
      box.addEventListener('click',onTap);
      async function reveal(){
        SND.play('chest');FX.shake(10,480);rays.style.opacity='.45';
        chest.classList.add('burst');FX.confetti(100,{y:innerHeight*.38});vibrate([30,40,60]);
        await sleep(400);chest.style.display='none';hint.textContent='';
        const ap=applyLoot(loot),items=[];
        if(ap.gold)items.push({i:'🪙',n:'Or',v:'+'+fmt.f(ap.gold),c:''});
        if(ap.gems)items.push({i:'💎',n:'Gemmes',v:'+'+ap.gems,c:''});
        ap.cards.forEach(c=>{const t=TAL[c.id];
          items.push({i:t.i,n:t.n+(c.isNew?' ✨':''),v:'×'+c.n,c:RC[c.rar],rar:c.rar});});
        for(const it of items){
          const card=h('<div class="lc '+it.c+'"><u>'+it.i+'</u><s>'+esc(it.n)+'</s><b>'+it.v+'</b></div>');
          lh.appendChild(card);
          if(it.rar==='legend'||it.rar==='champ'){SND.play('legend');FX.burstAt(card,'#ffd24a');}
          else if(it.rar==='epic')SND.play('epic');
          else if(it.rar==='rare')SND.play('rare');else SND.play('coin');
          await sleep(180);}
        const b=h('<button class="btn bg lg" style="margin-top:4px">Récupérer</button>');
        b.onclick=()=>{SND.play('tap');box.style.opacity='0';box.style.transition='opacity .3s';
          setTimeout(()=>{box.remove();resolve(ap);},300);};
        box.appendChild(b);renderTop();
      }
    });
  }

    const box=h('<div class="mod" style="background:rgba(3,8,20,.86)"><div style="text-align:center">'+
      '<div class="rays" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)"></div>'+
      '<div style="position:relative;font-size:84px;animation:pop .6s var(--pop) both;'+
      'filter:drop-shadow(0 10px 20px rgba(0,0,0,.7))">'+o.i+'</div>'+
      '<div class="t gold" style="position:relative;font-size:30px;margin-top:6px;animation:pop .6s .12s var(--pop) both">'+o.title+'</div>'+
      '<div style="position:relative;font-size:14px;color:#cfe2ff;margin-top:5px;animation:rise .5s .25s both">'+o.text+'</div>'+
      '<button class="btn bg lg" style="margin-top:20px;position:relative">Continuer</button></div></div>');
    $('#ovl').appendChild(box);FX.confetti(120);
    return new Promise(res=>{box.querySelector('button').onclick=()=>{SND.play('tap');box.remove();res();};
      box.addEventListener('click',e=>{if(e.target===box){box.remove();res();}});});

  function menu(){

      {i:'🏅',n:'Classement',a:()=>go('ranking')},
      {i:'🎖️',n:'Pass Pompes',a:()=>go('pass')},
      {i:'📋',n:'Quêtes',a:()=>go('quests')},
      {i:'🎯',n:'Régler la caméra',a:()=>DUEL.setupFlow()},
      {i:'🔬',n:'Tester la détection',a:()=>DUEL.testFlow()},
      {i:'⚙️',n:'Réglages',a:()=>go('settings')},
      {i:'❓',n:'Comment jouer',a:()=>howto()}];
    if(window.__ip)items.splice(1,0,{i:'📲',n:"Installer l'application",a:()=>{__ip.prompt();window.__ip=null;}});
    if(document.fullscreenEnabled)items.splice(1,0,{i:'⛶',n:'Plein écran',a:()=>toggleFs()});
    const m=modal({title:'Menu',html:items.map((x,i)=>'<div class="row" data-i="'+i+'">'+
      '<span style="font-size:20px">'+x.i+'</span><div class="rowM"><div class="rowT">'+x.n+'</div></div>'+

      m.close();items[+r.dataset.i].a();});
  }
  function toggleFs(){
    try{if(document.fullscreenElement)document.exitFullscreen();
      else document.documentElement.requestFullscreen({navigationUI:'hide'});}catch(e){}}
  function howto(){

      '<div style="font-size:13px;line-height:1.65;color:#dbe7f7">'+

      '<div style="display:flex;gap:9px;margin-bottom:9px"><span style="font-size:24px">📐</span><div>'+
      'La ligne épaule–hanche–cheville donne ta <b>note de forme</b>. Reste gainé : ça rapporte plus.</div></div>'+

      'Pas de caméra ? <b>ESPACE</b> ou le bouton vert comptent aussi.</div></div></div>',
      buttons:[{label:'Compris',cls:'bg'}]});
  }
  function bind(){
    $('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(b)go(b.dataset.n);});
    onAct($('#top'),{profile:()=>go('profile'),quests:()=>go('quests'),menu:()=>menu(),
      pass:()=>go('pass'),shop:()=>go('shop')});

    Bus.on('res:any',()=>{clearTimeout(rt);rt=setTimeout(renderTop,180);});
    Bus.on('res',d=>{if(d.n>0)SND.play(d.k==='gems'?'gem':'coin');});
    Bus.on('chests',renderNav);

    Bus.on('levelup',d=>{SND.play('levelup');banner({i:'⭐',title:'Niveau '+d.level+' !',

  }
  return Object.assign(U,{reg,go,refresh,renderTop,renderNav,modal,confirm,prompt,openChestAnim,
    banner,menu,howto,bind,toggleFs,NAV,SC});
})();

      (q.done&&!q.claimed?'<button class="btn bv sm" data-a="cq" data-id="'+q.id+'">+'+(q.rw.gold||0)+'🪙</button>':
        q.claimed?'<span style="font-size:18px">✅</span>':
        '<div style="font-size:10px;color:var(--gold-200);text-align:right">'+
        (q.rw.gold?q.rw.gold+'🪙<br>':'')+(q.rw.gems?q.rw.gems+'💎':'')+'</div>')+'</div>';
  }
  const dailyRdy=()=>S.daily.day!==today();
  UI.reg('arena',{
    render(){
      const p=S.profile,ar=arenaFor(p.trophies),nx=nextArena(p.trophies),lg=leagueFor(p.trophies);
      const pct=nx?clamp((p.trophies-ar.min)/(nx.min-ar.min),0,1):1;

        '<div class="emb" style="background:linear-gradient(180deg,'+ar.c1+','+ar.c2+')">'+ar.i+'</div></div>'+
        '<div class="aN t">'+ar.n+'</div>'+
        '<div class="aS">Arène '+(ar.id+1)+' · Ligue '+lg.i+' '+lg.n+'</div>'+
        '<div class="road"><div class="roadB"><i style="width:'+(pct*100).toFixed(1)+'%"></i>'+
          '<span>'+fmt.f(p.trophies)+(nx?' / '+fmt.f(nx.min):' 🏆')+'</span></div>'+
          '<div class="roadL"><span>'+ar.i+' '+ar.n+'</span>'+
          '<span>'+(nx?nx.i+' '+nx.n:'Sommet 👑')+'</span></div></div></div>'+

        '<div style="display:flex;gap:8px;justify-content:center;margin:14px 0 4px">'+
          '<button class="btn bg lg pulse" data-a="fight" style="flex:1;max-width:220px">⚔️ COMBAT</button>'+
          '<button class="btn bp lg" data-a="modes">🎮</button></div>'+
        '<div style="text-align:center;font-size:11px;color:var(--grey-300);margin-bottom:6px">'+
          'Mode : <b style="color:var(--gold-200)">'+M.n+'</b></div>'+

        '<div class="pan au sec"><div style="display:flex;align-items:center;gap:10px">'+
          '<div style="font-size:36px">'+(S.crown.rdy?'👑':'📦')+'</div><div style="flex:1">'+
          '<div style="font-size:10px;color:var(--gold-200);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px">Coffre Couronne</div>'+
          '<div class="bar"><i style="width:'+(S.crown.c/10*100)+'%;background:var(--acc)"></i></div>'+
          '<div style="font-size:11px;color:var(--tx3);margin-top:5px">'+S.crown.c+' / 10 couronnes</div></div>'+
          (S.crown.rdy?'<button class="btn bg sm" data-a="crown">Ouvrir</button>':'')+
          '</div></div>'+

        '<div class="sec"><div class="secH"><span class="secT">Coffres</span>'+
          (dailyRdy()?'<span class="secA" data-a="daily">🎁 Cadeau du jour !</span>':'')+'</div>'+
          '<div class="chrow">'+chestsHtml()+'</div></div>'+

        '<div class="sec"><div class="secH"><span class="secT">Quêtes du jour</span>'+
          '<span class="secA" data-a="allq">Tout voir ›</span></div>'+
          (S.quests.list||[]).slice(0,2).map(qRow).join('')+'</div>'+

        '<div class="pan sec"><div style="display:flex;align-items:center;gap:10px">'+
          '<div style="font-size:30px">🔥</div><div style="flex:1">'+
          '<div style="font-family:var(--ft);font-size:14px">Série de '+S.stats.streak+' jour'+(S.stats.streak>1?'s':'')+'</div>'+
          '<div style="font-size:11px;color:var(--grey-300)">Or ×'+streakMult().toFixed(2)+' · record '+S.stats.bestStreak+'j</div></div>'+
          '<div class="chip au">+'+Math.round((streakMult()-1)*100)+'%</div></div></div>'+

        '<div class="pan dk sec" style="display:flex;gap:9px;align-items:center">'+

    enter(node){
      onAct(node,{

      node.addEventListener('click',e=>{const c=e.target.closest('[data-sl]');if(c)tapChest(+c.dataset.sl);});

        S.chests.forEach((c,i)=>{
          if(!c||c.state!=='unlocking')return;
          const el=node.querySelector('[data-rem="'+i+'"]'),rem=chestLeft(c);

        if(full){UI.refresh();SND.play('unlock');}},1000);
    },
    leave(){clearInterval(tm);}
  });
  function chooseMode(){
    const keys=Object.keys(MODES);
    const m=UI.modal({title:'Mode de duel',html:'<div class="modes">'+keys.map(k=>{

        '<em>'+(x.ranked?'classé':'libre')+'</em></button>';}).join('')+'</div>'});

      FX.toast('Mode : '+MODES[b.dataset.m].n,'g',MODES[b.dataset.m].i);});
  }
  async function tapChest(i){
    const c=S.chests[i];
    if(!c){UI.modal({title:'Emplacement vide',text:'Gagne des duels pour remporter des coffres.',
      buttons:[{label:'Combattre',cls:'bg',action:()=>DUEL.quickStart()}]});return;}
    if(chestRdy(c)){const r=openChest(i);if(r){await UI.openChestAnim(r.type,r.loot);UI.refresh();}return;}
    if(c.state==='locked'){
      if(S.chests.some(x=>x&&x.state==='unlocking')){FX.toast('Un coffre est déjà en cours','b','⏳');skip(i);return;}
      startUnlock(i);SND.play('unlock');FX.toast('Déverrouillage lancé','g','🔓');UI.refresh();return;}
    skip(i);
  }
  function skip(i){
    const c=S.chests[i],cost=gemSkip(c),C=CHESTS[c.type];
    UI.modal({title:C.n,
      text:'Prêt dans <b style="color:var(--gold-200)">'+fmt.dur(chestLeft(c))+'</b>.',
      html:'<div style="text-align:center;font-size:56px">'+C.i+'</div>',
      buttons:[{label:'Plus tard',cls:'bn'},{label:'💎 '+cost,cls:'bg',keepOpen:1,
        action:async(box,close)=>{
          if(!spend({gems:cost})){FX.toast('Pas assez de gemmes','b','💎');SND.play('error');return false;}
          S.chests[i].state='ready';save();close();
          const r=openChest(i);if(r){await UI.openChestAnim(r.type,r.loot);UI.refresh();}}}]});
  }
  async function dailyChest(){
    if(!dailyRdy()){FX.toast('Reviens demain','',' 🎁');return;}
    S.daily.day=today();save(1);
    const l=rollLoot('quotidien');l.gold=Math.round(l.gold*streakMult());
    await UI.openChestAnim('quotidien',l);UI.refresh();
  }
})();
