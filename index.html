<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a1a">
    <title>Clash of Pushups</title>

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;700&family=Permanent+Marker&family=Pacifico&family=Orbitron:wght@700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --cr-blue: #2b78e4;
            --cr-gold: #ffcc00;
            --cr-gold-dark: #cc9900;
            --cr-green: #4caf50;
            --cr-red: #f54242;
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #000; color: white;
            display: flex; justify-content: center;
            height: 100vh; overflow: hidden;
            background-image:
                radial-gradient(circle at 20% 10%, rgba(255,204,0,0.08), transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(43,120,228,0.15), transparent 45%),
                radial-gradient(circle at top, #2a4c73, #0a1128);
            position: relative;
        }

        /* --- THEME DE FOND --- */
        .bg-pattern {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 30px);
            opacity: 0.6;
        }
        .bg-glow {
            position: fixed; width: 300px; height: 300px; border-radius: 50%;
            filter: blur(80px); z-index: 0; pointer-events: none; opacity: 0.35;
            animation: floatGlow 12s ease-in-out infinite alternate;
        }
        .bg-glow.g1 { background: var(--cr-gold); top: -80px; left: -80px; }
        .bg-glow.g2 { background: var(--cr-blue); bottom: -80px; right: -80px; animation-delay: 3s; }
        @keyframes floatGlow { from { transform: translate(0,0); } to { transform: translate(30px,20px); } }

        .screen {
            display: none; width: 100%; max-width: 500px; height: 100%;
            flex-direction: column; position: relative; z-index: 1;
            background: linear-gradient(to bottom, rgba(255,255,255,0.08), rgba(0,0,0,0.75));
            padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
        }
        .active-screen { display: flex; }

        /* --- BOUTONS AMELIORES --- */
        .cr-button {
            position: relative; overflow: hidden;
            background: linear-gradient(to bottom, var(--cr-gold), var(--cr-gold-dark));
            border: 2px solid #1a1a1a; border-radius: 16px;
            color: white; font-family: 'Anton', sans-serif; font-size: 1.4rem; letter-spacing: 1px;
            padding: 16px 30px; text-transform: uppercase; text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            box-shadow: inset 0 4px 0 rgba(255,255,255,0.5), inset 0 -4px 0 rgba(0,0,0,0.3), 0 8px 0 rgba(0,0,0,0.35), 0 10px 15px rgba(0,0,0,0.5);
            cursor: pointer; transition: all 0.08s; margin: 10px 0; width: 100%;
        }
        .cr-button::after {
            content: ''; position: absolute; top: -50%; left: -60%; width: 40%; height: 200%;
            background: rgba(255,255,255,0.35); transform: rotate(25deg);
            animation: shine 3.5s infinite;
        }
        @keyframes shine { 0% { left: -60%; } 25% { left: 130%; } 100% { left: 130%; } }
        .cr-button:active { transform: translateY(6px); box-shadow: inset 0 2px 0 rgba(255,255,255,0.4), inset 0 -2px 0 rgba(0,0,0,0.3), 0 2px 0 rgba(0,0,0,0.35), 0 3px 6px rgba(0,0,0,0.5); }
        .cr-button.blue { background: linear-gradient(to bottom, #4287f5, #195ac2); }
        .cr-button.gray { background: linear-gradient(to bottom, #777, #444); }
        .cr-button:disabled { filter: grayscale(100%); cursor: not-allowed; opacity: 0.6; }
        .cr-button:disabled::after { display: none; }

        /* Login */
        #login-screen { padding: 20px; align-items: center; justify-content: center; overflow-y: auto;}
        .profile-pic-container {
            width: 120px; height: 120px; border-radius: 20px;
            background: #000; border: 4px solid var(--cr-gold);
            margin-bottom: 20px; position: relative; overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .profile-pic-container img { width: 100%; height: 100%; object-fit: cover; }
        .upload-btn {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.7); color: white; text-align: center;
            font-size: 0.8rem; padding: 5px 0; cursor: pointer;
        }
        input[type="file"] { display: none; }
        input[type="text"], select {
            width: 100%; padding: 15px; font-size: 1.2rem;
            border-radius: 10px; border: 2px solid #555; background: #222; color: white;
            margin-bottom: 15px; text-align: center; font-weight: bold;
        }

        /* Top bar */
        .top-bar { display: flex; justify-content: space-between; align-items:center; padding: 10px 20px; background: rgba(0,0,0,0.5); border-bottom: 2px solid #444; }
        .player-profile-small { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .player-profile-small img { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--cr-gold); object-fit: cover; }

        /* Arena */
        .arena-3d-container {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            perspective: 1000px; overflow: hidden; position: relative; touch-action: none;
        }
        .arena-island {
            width: 250px; height: 250px; position: relative;
            transform-style: preserve-3d; transform: rotateX(60deg) rotateZ(-45deg);
            transition: transform 0.3s ease; box-shadow: 20px 20px 50px rgba(0,0,0,0.8); border-radius: 20px;
            cursor: grab;
        }
        .arena-base { position: absolute; width: 100%; height: 100%; background: #4a3b2c; border-radius: 20px; transform: translateZ(-30px); box-shadow: inset 0 0 20px #000; }
        .arena-surface {
            position: absolute; width: 100%; height: 100%; border-radius: 20px; border: 4px solid rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center; font-size: 4rem; text-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .arena-name-badge { position: absolute; top: 8%; z-index: 10; background: rgba(0,0,0,0.7); padding: 5px 20px; border-radius: 20px; font-family: 'Anton'; font-size: 1.5rem; border: 2px solid var(--cr-gold); text-shadow: 2px 2px #000; }
        .arena-hint { position: absolute; bottom: 6%; z-index: 10; font-size: 0.8rem; opacity: 0.6; }
        .arena-decor { position: absolute; inset: 0; pointer-events: none; }
        .arena-decor span {
            position: absolute; font-size: 1.6rem; transform: translate(-50%,-50%);
            filter: drop-shadow(2px 4px 3px rgba(0,0,0,0.6));
            animation: bob 3s ease-in-out infinite;
        }
        @keyframes bob { 0%,100% { transform: translate(-50%,-50%) translateY(0);} 50% { transform: translate(-50%,-50%) translateY(-6px);} }

        /* Tab bar */
        .tab-bar { display: none; position: absolute; bottom: 0; left: 0; right: 0; z-index: 5; background: rgba(0,0,0,0.85); border-top: 2px solid #444; padding-bottom: var(--safe-bottom); }
        .tab-bar.visible { display: flex; }
        .tab-btn {
            flex: 1; background: none; border: none; color: #888; padding: 10px 0;
            display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 1.4rem; cursor: pointer;
        }
        .tab-btn span { font-size: 0.7rem; font-family: 'Roboto'; font-weight: bold; }
        .tab-btn.active { color: var(--cr-gold); }

        /* Modal profil */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 999; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: linear-gradient(#2a2a3a,#151520); border: 3px solid var(--cr-gold); border-radius: 20px;
            padding: 25px; width: 85%; max-width: 360px; position: relative; text-align: center;
        }
        .modal-close { position: absolute; top: 10px; right: 14px; background: none; border: none; color: white; font-size: 1.4rem; cursor: pointer; }
        .modal-pfp { width: 90px; height: 90px; border-radius: 16px; border: 3px solid var(--cr-gold); object-fit: cover; margin-bottom: 10px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .stat-item { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 12px 6px; }
        .stat-value { display: block; font-family: 'Anton'; font-size: 1.6rem; color: var(--cr-gold); }
        .stat-label { display: block; font-size: 0.75rem; opacity: 0.8; margin-top: 3px; }

        /* Contenu écrans menu type (clan / réglages) */
        .sub-screen-content { padding: 20px; overflow-y: auto; flex: 1; padding-bottom: 90px; }
        .sub-screen-content h2 { font-family: 'Anton'; color: var(--cr-gold); text-shadow: 2px 2px #000; }
        .card-box { background: rgba(255,255,255,0.06); border-radius: 14px; padding: 16px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.1); }
        .friend-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .info-note { font-size: 0.8rem; opacity: 0.65; margin-top: 10px; line-height: 1.4; }
        .pfp-mini { width: 60px; height: 60px; border-radius: 12px; border: 3px solid var(--cr-gold); object-fit: cover; margin-bottom: 10px; }

        /* Matchmaking / duel */
        #matchmaking-screen, #duel-screen { justify-content: center; align-items: center; text-align: center; padding: 20px; }

        #camera-wrapper { flex: 1; position: relative; width: 100%; background:
