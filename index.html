<script>
        // ===================== ETAT ET AUTHENTIFICATION =====================
        let user = { 
            username: "", pass: "", pin: "", avatar: "🦍", bio: "Prêt à en découdre !", levelTitle: "Machine à Pompes ⚙️",
            elo: 1000, maxElo: 1000, gamesPlayed: 0, gamesWon: 0, history: [0, 0, 0, 0, 0, 0, 0],
            friends: [], myCode: "", currentLobby: "Aucun"
        };

        const RANKS = [
            { min: 0, max: 599, name: "BRONZE", short: "BRZ", gem: "var(--brz-gem)", glow: "var(--brz-glow)" },
            { min: 600, max: 1199, name: "ARGENT", short: "ARG", gem: "var(--arg-gem)", glow: "var(--arg-glow)" },
            { min: 1200, max: 1799, name: "OR", short: "OR", gem: "var(--or-gem)", glow: "var(--or-glow)" },
            { min: 1800, max: 2499, name: "PLATINE", short: "PLT", gem: "var(--plt-gem)", glow: "var(--plt-glow)" },
            { min: 2500, max: 9999, name: "DIAMANT", short: "DIA", gem: "var(--dia-gem)", glow: "var(--dia-glow)" }
        ];

        // ===================== SAUVEGARDE ET COMPTE =====================
        function loadAccount() {
            const savedData = localStorage.getItem('pushArenaUser');
            if (savedData) {
                user = JSON.parse(savedData);
                document.getElementById('reg-screen').style.display = 'none';
                
                // Si tu veux demander le PIN à chaque fois, décommente la ligne suivante :
                // document.getElementById('pin-screen').style.display = 'block';
                
                // Sinon, on passe directement au jeu :
                document.getElementById('auth-overlay').style.display = 'none';
                updateUI();
                initMultiplayer();
            } else {
                document.getElementById('reg-screen').style.display = 'block';
                document.getElementById('pin-screen').style.display = 'none';
            }
        }

        function submitRegister() {
            const pseudo = document.getElementById('reg-pseudo').value;
            const pass = document.getElementById('reg-pass').value;
            const pin = document.getElementById('reg-pin').value;
            
            if (!pseudo || !pass || pin.length !== 4) {
                alert("Veuillez remplir tous les champs correctement (PIN à 4 chiffres).");
                return;
            }

            user.username = pseudo;
            user.pass = pass;
            user.pin = pin;
            user.bio = document.getElementById('reg-bio').value || user.bio;
            
            localStorage.setItem('pushArenaUser', JSON.stringify(user));
            document.getElementById('auth-overlay').style.display = 'none';
            
            updateUI();
            initMultiplayer();
        }

        function resetAccount() {
            if (confirm("Es-tu sûr de vouloir supprimer ton compte ? Toutes tes statistiques seront perdues.")) {
                localStorage.removeItem('pushArenaUser');
                location.reload();
            }
        }

        function updateUI() {
            document.getElementById('display-username').innerText = user.username;
            document.getElementById('profile-username').innerText = user.username;
            document.getElementById('display-elo').innerText = user.elo;
            document.getElementById('stat-current-elo').innerText = user.elo;
            document.getElementById('stat-max-elo').innerText = user.maxElo;
            document.getElementById('profile-bio').innerText = '"' + user.bio + '"';
            updateRankDisplay();
        }

        // ===================== NAVIGATION & UI =====================
        function goToTab(index) {
            document.getElementById('swipe-container').style.transform = `translateX(-${index * 25}%)`;
            document.querySelectorAll('.nav-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
        }

        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
        }

        // ===================== GESTION DES RANGS =====================
        function updateRankDisplay() {
            let currentRank = RANKS[0];
            for (let r of RANKS) {
                if (user.elo >= r.min) currentRank = r;
            }
            document.getElementById('rank-gem').innerText = currentRank.short;
            document.getElementById('rank-gem').style.background = currentRank.gem;
            document.getElementById('rank-gem').style.boxShadow = `0 0 25px ${currentRank.glow}`;
            document.getElementById('rank-name').innerText = currentRank.name;
        }

        function openRankViewer() {
            const container = document.getElementById('rank-scroll-area');
            container.innerHTML = ''; 
            
            RANKS.forEach(r => {
                const isCurrent = user.elo >= r.min && user.elo <= r.max;
                container.innerHTML += `
                    <div style="background: ${isCurrent ? 'rgba(0,229,255,0.2)' : 'rgba(30,41,59,0.8)'}; 
                                border: 2px solid ${isCurrent ? '#00e5ff' : '#334155'}; 
                                border-radius: 10px; padding: 15px; margin-bottom: 10px; text-align: center;">
                        <div class="text-3d" style="font-size: 1.5rem; color: ${isCurrent ? '#00e5ff' : '#fff'}; text-shadow: 0 0 10px ${r.glow}">
                            ${r.name}
                        </div>
                        <div style="color: #aaa; font-size: 0.8rem; margin-top: 5px;">${r.min} - ${r.max > 9000 ? 'MAX' : r.max} Trophées</div>
                    </div>
                `;
            });
            
            document.getElementById('modal-ranks').style.display = 'flex';
        }

        // ===================== MULTIJOUEUR (PEERJS) & AMIS =====================
        let peer;
        let activeConnection = null;

        function initMultiplayer() {
            // Initialisation de PeerJS pour avoir une connexion P2P unique
            peer = new Peer();
            
            peer.on('open', (id) => {
                user.myCode = id;
                user.currentLobby = "Lobby de " + user.username;
                console.log("Mon Lobby (ID) : " + id);
                renderFriendsList();
            });

            // Quand quelqu'un essaie de rejoindre notre lobby (nous ajoute en ami/duel)
            peer.on('connection', (conn) => {
                if (confirm(`Le joueur ${conn.metadata.username || 'Un joueur'} souhaite te rejoindre en duel ! Accepter ?`)) {
                    activeConnection = conn;
                    setupGameConnection(conn);
                    alert("Joueur accepté ! Préparez-vous au combat.");
                    // Lancer la logique de combat ici
                } else {
                    conn.send({ type: 'REJECTED' });
                    setTimeout(() => conn.close(), 500);
                }
            });
        }

        function shareFriendLink() {
            if (!user.myCode) return alert("Connexion au serveur en cours...");
            const code = prompt("Voici ton code Ami / ID de Lobby à partager avec un ami :", user.myCode);
            if (code && code !== user.myCode) {
                joinFriendLobby(code);
            }
        }

        function joinFriendLobby(friendId) {
            document.getElementById('mm-status').innerText = "Connexion au lobby de l'ami...";
            document.getElementById('screen-matchmaking').style.display = 'flex';

            const conn = peer.connect(friendId, { metadata: { username: user.username } });
            
            conn.on('open', () => {
                document.getElementById('mm-status').innerText = "En attente de l'acceptation...";
            });

            conn.on('data', (data) => {
                if (data.type === 'REJECTED') {
                    alert("L'invitation a été refusée ou le lobby est plein.");
                    cancelMatchmaking();
                } else if (data.type === 'ACCEPTED') {
                    activeConnection = conn;
                    setupGameConnection(conn);
                    document.getElementById('screen-matchmaking').style.display = 'none';
                    document.getElementById('screen-battle').style.display = 'flex';
                }
            });
        }

        function setupGameConnection(conn) {
            conn.on('data', (data) => {
                if (data.type === 'SCORE_UPDATE') {
                    document.getElementById('p2-score').innerText = data.score;
                }
            });
            // Pour envoyer son propre score : activeConnection.send({ type: 'SCORE_UPDATE', score: myScore })
        }

        function startSmartMatchmaking() {
            // Pour le matchmaking classique aléatoire sans serveur central,
            // on simule ici une recherche, mais le mieux avec PeerJS est d'utiliser les codes amis.
            shareFriendLink(); 
        }

        function cancelMatchmaking() {
            document.getElementById('screen-matchmaking').style.display = 'none';
        }

        function renderFriendsList() {
            const container = document.getElementById('friends-catalog-list');
            container.innerHTML = `
                <div class="list-item">
                    <div style="display:flex; align-items:center;">
                        <span class="status-dot"></span>
                        <span class="text-3d" style="font-size: 0.9rem;">Mon Lobby Actuel</span>
                    </div>
                    <div style="font-size: 0.7rem; color: #aaa;">${user.myCode.substring(0,6)}...</div>
                </div>
            `;
            // Tu peux étendre cette fonction pour sauvegarder les amis dans user.friends et les afficher ici.
        }

        // Lancement initial
        window.onload = loadAccount;

    </script>
</body>
</html>
