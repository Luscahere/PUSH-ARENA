          if(s.give.chest)await UI.openChestAnim(s.give.chest,rollLoot(s.give.chest));
          UI.refresh();return;}
        const av=e.target.closest('[data-av]');
        if(av){const a=av.dataset.av;
          if(S.cos.avatars.indexOf(a)>=0){S.profile.avatar=a;save(1);SND.play('tap');UI.renderTop();UI.refresh();return;}
          if(!spend({gold:300})){SND.play('error');FX.toast('300 or nécessaires','b','🪙');return;}
          S.cos.avatars.push(a);S.profile.avatar=a;save(1);SND.play('unlock');
          FX.toast('Avatar débloqué !','a',a);UI.renderTop();UI.refresh();return;}
        const fr=e.target.closest('[data-fr]');
        if(fr){const f=FRAMES.find(x=>x.id===fr.dataset.fr);
          if(S.cos.frames.indexOf(f.id)>=0){S.profile.frame=f.id;save(1);SND.play('tap');UI.refresh();return;}
          if(!spend({gold:f.c})){SND.play('error');FX.toast(f.c+' or nécessaires','b','🪙');return;}
          S.cos.frames.push(f.id);S.profile.frame=f.id;save(1);SND.play('unlock');UI.refresh();}
      });
      clearInterval(tm);
      tm=setInterval(()=>{
        if(UI.current!=='shop')return;
        const t=node.querySelector('#fT');
        if(t){const l=freeLeft();if(l<=0)UI.refresh();else t.textContent='⏳ '+fmt.dur(l);}
        const r=node.querySelector('#sR');
        if(r){const e2=new Date();e2.setHours(24,0,0,0);r.textContent='nouvelles dans '+fmt.dur(e2-Date.now());}
      },1000);
    },
    leave(){clearInterval(tm);}
  });
})();

/* ---------------------------------- TALENTS ---------------------------------- */
(()=>{
  function cardHtml(t,c,slot){
    const need=cardNeed(t.id),pct=isFinite(need)?clamp(c.c/need,0,1)*100:100;
    const can=canUp(t.id),eq=S.deck.indexOf(t.id)>=0;
    return '<div class="tc '+t.r+(eq?' eq':'')+'" data-t="'+t.id+'"'+(slot!=null?' data-sl="'+slot+'"':'')+
      (can?' style="box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 0 0 2px rgba(53,209,92,.7),0 4px 0 rgba(0,0,0,.6)"':'')+'>'+
      '<em>N'+c.l+'</em><u>'+t.i+'</u><s>'+t.n+'</s>'+
      '<div class="bar"><i style="width:'+pct+'%"></i><span>'+(isFinite(need)?c.c+'/'+need:'MAX')+'</span></div></div>';
  }
  function summary(){
    const rows=[['🪙','Or',effect('goldPct')],['⭐','XP',effect('xpPct')],['🏆','Trophées',effect('trophyPct')],
      ['⚡','Critique',effect('critPct')],['🔥','Départ',effect('startBonus')],['🎯','Tolérance',effect('sensDeg')]]
      .filter(r=>r[2]>0);
    if(!rows.length)return '<span class="chip">Aucun bonus actif</span>';
    return rows.map(r=>'<span class="chip au">'+r[0]+' '+r[1]+' +'+round(r[2],1)+
      (r[1]==='Départ'?'':r[1]==='Tolérance'?'°':'%')+'</span>').join('');
  }
  UI.reg('talents',{
    render(){
      const own=TALENTS.filter(t=>S.cards[t.id]),lock=TALENTS.filter(t=>!S.cards[t.id]);
      const up=TALENTS.filter(t=>canUp(t.id)).length;
      return '<div class="pan sec"><div class="panT">Talents équipés</div><div class="deck">'+
        S.deck.map((id,i)=>{const t=TAL[id],c=t&&S.cards[id];
          return t&&c?cardHtml(t,c,i):'<div class="dslot" data-sl="'+i+'">➕</div>';}).join('')+'</div>'+
        '<div style="font-size:11px;color:var(--grey-300);margin-top:8px">Tes talents s\'appliquent '+
        '<b style="color:var(--gold-200)">vraiment</b> : or, XP, trophées, tolérance de détection…</div>'+
        '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:7px">'+summary()+'</div></div>'+

        '<div class="sec"><div class="secH"><span class="secT">Collection ('+own.length+'/'+TALENTS.length+')</span>'+
        (up?'<span class="secA" style="color:#8bf0a4">'+up+' amélioration'+(up>1?'s':'')+' !</span>':'')+'</div>'+
        '<div class="cgrid">'+own.map(t=>cardHtml(t,S.cards[t.id])).join('')+'</div></div>'+

        (lock.length?'<div class="sec"><div class="secH"><span class="secT">À découvrir</span></div>'+
          '<div class="cgrid">'+lock.map(t=>'<div class="tc '+t.r+' lock" data-t="'+t.id+'">'+
          '<u>'+t.i+'</u><s>'+t.n+'</s><div style="font-size:8px;color:var(--grey-300);margin-top:2px">'+
          RAR[t.r].n+'</div></div>').join('')+'</div></div>':'');
    },
    enter(node){
      node.addEventListener('click',e=>{
        const c=e.target.closest('[data-t]');if(c)return open(c.dataset.t);
        if(e.target.closest('.dslot'))FX.toast("Choisis un talent dans ta collection",'','🃏');});
    }
  });
  function open(id){
    const t=TAL[id],c=S.cards[id];
    if(!c){UI.modal({title:t.n,text:t.i+' '+RAR[t.r].n+'<br><br>'+t.d.replace('{v}',tVal(t,1))+
      '<br><br><span style="color:var(--grey-300);font-size:12px">Trouve-la dans les coffres ou la boutique.</span>',
      buttons:[{label:'Fermer',cls:'bn'}]});return;}
    const need=cardNeed(id),cost=cardCost(id),can=canUp(id),eq=S.deck.indexOf(id)>=0,max=!isFinite(need);
    const html='<div style="text-align:center">'+
      '<div class="tc '+t.r+'" style="width:110px;margin:0 auto 10px;padding:10px 6px">'+
      '<em>Niveau '+c.l+'</em><u style="font-size:40px">'+t.i+'</u><s style="font-size:11px">'+t.n+'</s></div>'+
      '<div class="chip au">'+RAR[t.r].n+'</div>'+
      '<p style="font-size:14px;line-height:1.5;margin:10px 0;color:#dbe7f7">'+tDesc(t,c.l)+'</p>'+
      (max?'<div class="chip gr">NIVEAU MAXIMUM</div>':
        '<div style="font-size:12px;color:#9fb4d0">Suivant : '+tDesc(t,c.l+1)+'</div>'+
        '<div class="bar" style="margin:9px 0"><i style="width:'+clamp(c.c/need,0,1)*100+'%"></i>'+
        '<span>'+c.c+' / '+need+' cartes</span></div>')+'</div>';
    const btns=[];
    if(!max)btns.push({label:(can?'⬆️ ':'🔒 ')+fmt.f(cost)+' 🪙',cls:can?'bv':'bn',keepOpen:1,
      action:(box,close)=>{
        if(!canUp(id)){SND.play('error');
          FX.toast(c.c<need?'Il te manque '+(need-c.c)+' cartes':"Pas assez d'or",'b','🔒');return false;}
        upCard(id);SND.play('levelup');FX.confetti(55);close();UI.refresh();UI.renderTop();
        FX.toast(t.n+' niveau '+S.cards[id].l+' !','a',t.i);}});
    btns.push({label:eq?'Retirer':'Équiper',cls:eq?'bn':'bg',action:()=>toggle(id)});
    UI.modal({html,buttons:btns});
  }
  function toggle(id){
    const i=S.deck.indexOf(id);
    if(i>=0){
      if(S.deck.filter(x=>x&&S.cards[x]).length<=1){FX.toast('Garde au moins un talent','b','⚠️');return;}
      S.deck[i]=null;
    }else{
      const free=S.deck.findIndex(x=>!x||!S.cards[x]);
      if(free>=0)S.deck[free]=id;else{pickSlot(id);return;}
    }
    save(1);SND.play('tap');UI.refresh();
  }
  function pickSlot(nid){
    const m=UI.modal({title:'Remplacer quel talent ?',html:'<div class="deck">'+
      S.deck.map((id,i)=>{const t=TAL[id],c=t&&S.cards[id];
        return t&&c?cardHtml(t,c,i):'<div class="dslot" data-sl="'+i+'">➕</div>';}).join('')+'</div>'});
    m.body.addEventListener('click',e=>{const s=e.target.closest('[data-sl]');if(!s)return;
      S.deck[+s.dataset.sl]=nid;save(1);SND.play('tap');m.close();UI.refresh();});
  }
})();

const SOCIAL=(()=>{
  let tab='chat';
  function msgHtml(m){
    if(m.sys)return '<div class="msg sys">'+esc(m.txt)+'</div>';
    return '<div class="msg'+(m.mine?' me':'')+'"><u>'+(m.av||'🙂')+' '+esc(m.n||'Anonyme')+
      '<em>'+fmt.hm(m.ts)+'</em></u>'+esc(m.txt)+'</div>';}
  function leaderboard(){
    const me=pubProfile(),list=[Object.assign({},me,{me:1})];
    NET.peerList().forEach(p=>list.push(p.profile));
    const sb=today()+'|'+arenaFor(me.trophies).id;
    for(let i=0;i<20;i++){const b=makeBot(sb+'|'+i,me.trophies+(i-9)*65);
      list.push({id:b.id,name:b.name,avatar:b.avatar,level:b.level,trophies:b.trophies,
        totalReps:Math.round(b.trophies*2.6+200)});}
    const seen={};
    return list.filter(p=>{if(seen[p.id])return 0;seen[p.id]=1;return 1;})
      .sort((a,b)=>b.trophies-a.trophies);}
  function lbRow(p,i){
    return '<div class="row"'+(p.me?' style="border-color:rgba(255,200,60,.6)"':'')+'>'+
      '<div class="rk'+(i<3?' r'+(i+1):'')+'">'+(i+1)+'</div>'+
      '<div class="av" style="width:32px;height:32px;font-size:16px">'+(p.avatar||'🙂')+'</div>'+
      '<div class="rowM"><div class="rowT">'+esc(p.name)+(p.me?' <span style="color:var(--gold-200)">(toi)</span>':'')+'</div>'+
      '<div class="rowS">Niv '+(p.level||1)+' · 💪 '+fmt.n(p.totalReps||0)+'</div></div>'+
      '<div class="rowR">🏆 '+fmt.f(p.trophies)+'</div></div>';}

  async function addFriend(){

      buttons:[{label:'Fermer',cls:'bn',action:()=>NET.Manual.close()}]});

    catch(e){m.close();FX.toast('WebRTC indisponible','b');return;}
    m.body.innerHTML='<div style="font-size:12px;color:#cfe2ff;line-height:1.5;margin-bottom:6px">'+

      buttons:[{label:'Fermer',cls:'bn'}]});

    const o=Bus.on('net:manual',d=>{if(!d.open)return;o();m.close();
      FX.toast('Connecté !','g','🔗');manualDuel(r.profile,0);});}
  function manualDuel(prof,host){
    const opp={id:'manual',name:(prof&&prof.name)||'Ami',avatar:(prof&&prof.avatar)||'🙂',
      trophies:(prof&&prof.trophies)||0,bot:0};
    if(host){const id='d_'+uid(8),startAt=Date.now()+6500;
      NET.send('inv',{id,mode:quickMode(),startAt,name:S.profile.name,av:S.profile.avatar,
        tr:S.profile.trophies},'manual');
      NET.startNetDuel(id,quickMode(),opp,startAt,'manual');
      DUEL.startDuel({mode:quickMode(),opp,ranked:0,net:1,startAt,duelId:id});}
    else FX.toast("En attente du lancement par l'hôte…",'','⏳');}

  Bus.on('chat:in',m=>{
    if(m.ch==='clan'){Bus.emit('clan:msg',m);return;}
    pushMsg(m);
    if(UI.current!=='social'){SND.play('msg');FX.toast(m.n+' : '+m.txt.slice(0,36),'',m.av);}});
  Bus.on('net:invite',inv=>{
    SND.play('lead');
    UI.modal({title:'⚔️ Défi reçu !',
      text:'<b>'+esc(inv.opp.name)+'</b> (🏆 '+inv.opp.trophies+') te défie en <b>'+MODES[inv.mode].n+'</b>.',
      html:'<div style="text-align:center;font-size:50px">'+inv.opp.avatar+'</div>',
      buttons:[{label:'Refuser',cls:'bn',action:()=>NET.inviteRefuse(inv)},
        {label:'Accepter',cls:'bv',action:()=>{NET.inviteAccept(inv);
          DUEL.startDuel({mode:inv.mode,opp:inv.opp,ranked:0,net:1,startAt:inv.startAt,duelId:inv.id});}}]});});
  Bus.on('net:peers',()=>{if(UI.current==='social'&&tab!=='chat')UI.refresh();});
  Bus.on('net:status',()=>{if(UI.current==='social')UI.refresh();});
  return{leaderboard,pushMsg,copy};
})();

/* ---------------------------------- CLAN ---------------------------------- */
const CLAN=(()=>{
  let tab='info';
  function weekKey(){const t=new Date();t.setHours(0,0,0,0);
    t.setDate(t.getDate()-((t.getDay()+6)%7));return fmt.day(t.getTime());}
  function weekPct(){return clamp((Date.now()-new Date(weekKey()).getTime())/(7*864e5),0,1);}
  function weekLeft(){return Math.max(0,new Date(weekKey()).getTime()+7*864e5-Date.now());}
  function members(c){
    const out=[],n=c.size||14;
    for(let i=0;i<n;i++){
      const b=makeBot(c.id+'|m'+i,c.avgTrophies+(i-n/2)*90);
      const g=seedRng(c.id+'|w'+weekKey()+'|'+i),daily=Math.round(30+g()*190);
      out.push({id:b.id,name:b.name,avatar:b.avatar,trophies:b.trophies,
        role:i===0?'Chef':i<3?'Aîné':'Membre',week:Math.round(daily*weekPct()*7),online:g()>.72});}
    return out.sort((a,b)=>b.week-a.week);}
  function suggested(){
    const tr=S.profile.trophies;
    return CLANS.slice(0,8).map((n,i)=>{const g=seedRng(today()+n);
      return{id:'c_'+n.replace(/\s/g,'').toLowerCase(),name:n,badge:BADGES[i%BADGES.length],
        size:12+Math.floor(g()*30),avgTrophies:Math.max(0,Math.round(tr+(g()-.4)*700)),
        req:Math.max(0,Math.round(tr-300+g()*500)),
        desc:pick(['On pompe tous les jours 💪','Clan sérieux, ambiance détendue','Objectif top 10',
          'Débutants bienvenus !','Guerre chaque semaine ⚔️'])};});}
  const TIERS=[{g:500,rw:{gold:400,chest:'or'}},{g:1500,rw:{gold:900,gems:10}},
    {g:3000,rw:{gold:1800,chest:'guerre'}},{g:6000,rw:{gold:3500,gems:30,chest:'guerre'}}];
  function war(){
    const c=S.clan;if(!c)return null;
    const wk=weekKey();
    if(!c.war||c.war.week!==wk){const g=seedRng(c.id+wk);
      c.war={week:wk,my:0,enemy:pick(CLANS.filter(n=>n!==c.name)),eb:pick(BADGES),
        rate:900+Math.floor(g()*2600),claimed:[]};save(1);}
    const ms=members(c),team=ms.reduce((a,m)=>a+m.week,0);
    return{w:c.war,total:team+c.war.my,enemy:Math.round(c.war.rate*weekPct()*7),members:ms,my:c.war.my};}
  UI.reg('clan',{
    render(){
      if(!S.clan)return noClan();
      return '<div class="tabs">'+['info','guerre','chat'].map(t=>'<button class="tab'+(tab===t?' on':'')+
        '" data-tb="'+t+'">'+({info:'🛡️ Clan',guerre:'⚔️ Guerre',chat:'💬 Chat'})[t]+'</button>').join('')+
        '</div>'+(tab==='info'?infoH():tab==='guerre'?warH():chatH());},
    enter(node){
      node.addEventListener('click',e=>{
        const t=e.target.closest('[data-tb]');if(t){tab=t.dataset.tb;UI.refresh();return;}
        const j=e.target.closest('[data-join]');if(j)return join(j.dataset.join);
        const w=e.target.closest('[data-wc]');if(w)return claimWar(+w.dataset.wc);});
      onAct(node,{create:()=>create(),leave:()=>leaveClan(),fight:()=>DUEL.quickStart(),
        csend:()=>sendClan(node)});
      const i=node.querySelector('#clin');
      if(i)i.addEventListener('keydown',e=>{if(e.key==='Enter')sendClan(node);});
      const l=node.querySelector('#cllog');if(l)l.scrollTop=l.scrollHeight;}
  });
  function noClan(){
    return '<div class="pan au sec" style="text-align:center"><div style="font-size:46px">🛡️</div>'+
      '<div class="t" style="font-size:18px;margin:5px 0">Rejoins un clan</div>'+
      '<div style="font-size:12px;color:#cfe2ff;line-height:1.5;margin-bottom:10px">Chat privé et surtout la '+
      '<b style="color:var(--gold-200)">Guerre de Clans</b> : toutes tes pompes de la semaine comptent pour ton équipe.</div>'+
      '<button class="btn bg lg blk" data-a="create">Créer mon clan</button></div>'+
      '<div class="sec"><div class="secH"><span class="secT">Clans recommandés</span></div>'+
      suggested().map(c=>'<div class="row" data-join="'+c.id+'">'+
        '<div class="av" style="width:42px;height:42px;font-size:21px">'+c.badge+'</div>'+
        '<div class="rowM"><div class="rowT">'+c.name+'</div>'+
        '<div class="rowS">'+c.size+'/50 · '+c.desc+'</div></div>'+
        '<div style="text-align:right"><div class="rowR">🏆 '+fmt.n(c.avgTrophies)+'</div>'+
        '<div style="font-size:9px;color:var(--grey-300)">min '+fmt.n(c.req)+'</div></div></div>').join('')+'</div>';}
  function infoH(){
    const c=S.clan,ms=members(c),me=pubProfile();
    const total=ms.reduce((a,m)=>a+m.week,0)+(c.war?c.war.my:0);
    const myRank=ms.filter(m=>m.week>(c.war?c.war.my:0)).length;
    return '<div class="pan sec"><div style="display:flex;gap:10px;align-items:center">'+
      '<div class="av" style="width:58px;height:58px;font-size:30px">'+c.badge+'</div>'+
      '<div style="flex:1;min-width:0"><div class="t" style="font-size:17px">'+esc(c.name)+'</div>'+
      '<div style="font-size:11px;color:var(--grey-300)">'+(ms.length+1)+' membres · '+
      ms.filter(m=>m.online).length+' en ligne</div></div>'+
      '<button class="btn bn sm" data-a="leave">Quitter</button></div>'+
      '<div class="sgd" style="margin-top:10px">'+
      st(fmt.n(total),'Pompes / semaine')+
      st(fmt.n(Math.round(ms.reduce((a,m)=>a+m.trophies,0)/ms.length)),'Trophées moy.')+
      st(fmt.n(c.war?c.war.my:0),'Ma contribution')+'</div></div>'+
      '<div class="sec"><div class="secH"><span class="secT">Membres</span><span class="secA">cette semaine</span></div>'+
      '<div class="row" style="border-color:rgba(255,200,60,.6)"><div class="rk r1">'+(myRank+1)+'</div>'+
      '<div class="av" style="width:34px;height:34px;font-size:17px">'+me.avatar+'</div>'+
      '<div class="rowM"><div class="rowT">'+esc(me.name)+' <span style="color:var(--gold-200)">(toi)</span></div>'+
      '<div class="rowS">'+(c.role||'Membre')+' · 🏆 '+fmt.n(me.trophies)+'</div></div>'+
      '<div class="rowR">💪 '+fmt.n(c.war?c.war.my:0)+'</div></div>'+
      ms.map((m,i)=>'<div class="row"><div class="rk'+(i<3?' r'+(i+1):'')+'">'+(i+1)+'</div>'+
        '<div class="av" style="width:34px;height:34px;font-size:17px'+(m.online?';box-shadow:0 0 0 2px #35d15c':'')+'">'+
        m.avatar+'</div><div class="rowM"><div class="rowT">'+esc(m.name)+'</div>'+
        '<div class="rowS">'+m.role+' · 🏆 '+fmt.n(m.trophies)+'</div></div>'+
        '<div class="rowR">💪 '+fmt.n(m.week)+'</div></div>').join('')+'</div>';}
  const st=(v,l)=>'<div class="st"><b>'+v+'</b><s>'+l+'</s></div>';
  function warH(){
    const W=war();if(!W)return '';
    const lead=W.total>=W.enemy,max=Math.max(W.total,W.enemy,100);
    return '<div class="pan au sec"><div class="panT">Guerre · fin dans '+fmt.dur(weekLeft())+'</div>'+
      '<div style="display:flex;align-items:center;justify-content:space-between;font-family:var(--ft);font-size:13px">'+
      '<span>'+S.clan.badge+' '+esc(S.clan.name)+'</span><span style="color:var(--grey-500)">VS</span>'+
      '<span>'+W.w.eb+' '+esc(W.w.enemy)+'</span></div>'+
      '<div class="war"><i style="width:'+(W.total/max*100)+'%"></i><span>'+fmt.f(W.total)+' 💪</span></div>'+
      '<div class="war" style="height:34px"><i style="width:'+(W.enemy/max*100)+
      '%;background:linear-gradient(90deg,rgba(232,68,42,.7),rgba(255,160,120,.5))"></i>'+
      '<span style="font-size:12px">'+fmt.f(W.enemy)+' 💪</span></div>'+
      '<div style="text-align:center;margin-top:6px"><span class="chip '+(lead?'gr':'rd')+'">'+
      (lead?'🔥 Vous menez de '+fmt.f(W.total-W.enemy):'⚠️ Retard de '+fmt.f(W.enemy-W.total))+'</span></div></div>'+
      '<div class="pan sec" style="text-align:center">'+
      '<div style="font-family:var(--ft);font-size:38px;color:var(--gold-200)">'+fmt.f(W.my)+'</div>'+
      '<div style="font-size:10px;color:var(--grey-300);text-transform:uppercase;letter-spacing:1px">'+
      'mes pompes cette semaine</div>'+
      '<button class="btn bg lg blk" style="margin-top:10px" data-a="fight">⚔️ Combattre pour le clan</button></div>'+
      '<div class="sec"><div class="secH"><span class="secT">Récompenses</span></div>'+
      TIERS.map((t,i)=>{const done=W.my>=t.g,cl=W.w.claimed.indexOf(i)>=0;
        return '<div class="qst'+(done?' done':'')+'"><div style="font-size:22px">'+
          (cl?'✅':done?'🎁':'🔒')+'</div><div style="flex:1">'+
          '<div style="font-family:var(--ft);font-size:12px">'+fmt.f(t.g)+' pompes</div>'+
          '<div class="bar" style="margin-top:4px"><i style="width:'+clamp(W.my/t.g,0,1)*100+'%"></i>'+
          '<span>'+fmt.n(Math.min(W.my,t.g))+' / '+fmt.n(t.g)+'</span></div></div>'+
          (done&&!cl?'<button class="btn bv sm" data-wc="'+i+'">Récupérer</button>':
            '<div style="font-size:9px;color:var(--gold-200);text-align:right">'+
            (t.rw.gold?t.rw.gold+'🪙<br>':'')+(t.rw.gems?t.rw.gems+'💎<br>':'')+
            (t.rw.chest?CHESTS[t.rw.chest].i:'')+'</div>')+'</div>';}).join('')+'</div>';}
  function chatH(){
    const ms=S.chat.clan.slice(-60);
    return '<div class="pan" style="padding:9px"><div class="panT">'+S.clan.badge+' '+esc(S.clan.name)+'</div>'+
      '<div class="chat"><div class="clog" id="cllog" style="height:min(52vh,380px)">'+
      (ms.length?ms.map(m=>'<div class="msg'+(m.mine?' me':'')+'"><u>'+(m.av||'🙂')+' '+esc(m.n)+
        '<em>'+fmt.hm(m.ts)+'</em></u>'+esc(m.txt)+'</div>').join(''):
        '<div class="msg sys">Lance la discussion 💬</div>')+'</div>'+
      '<div class="cbar"><input class="inp" id="clin" maxlength="200" placeholder="Message au clan…">'+
      '<button class="btn bg" data-a="csend">➤</button></div></div></div>';}
  async function create(){
    const n=await UI.prompt('Créer un clan','Nom du clan (20 max)','Les Bras Cassés','',20);
    if(!n)return;
    const b=await pickBadge();
    S.clan={id:'c_'+uid(8),name:n,badge:b||'🛡️',role:'Chef',size:rndI(8,22),
      avgTrophies:S.profile.trophies,desc:'Fondé par '+(S.profile.name||'un athlète'),
      joined:Date.now(),war:null};
    save(1);SND.play('unlock');FX.confetti(85);FX.toast('Clan créé !','a',b);UI.refresh();}
  function pickBadge(){return new Promise(res=>{
    const m=UI.modal({title:'Blason',html:'<div class="pick" style="justify-content:center">'+
      BADGES.map(b=>'<button data-b="'+b+'">'+b+'</button>').join('')+'</div>',onClose:()=>res('🛡️')});
    m.body.addEventListener('click',e=>{const b=e.target.closest('[data-b]');if(!b)return;
      m.close();res(b.dataset.b);});});}
  function join(id){
    const c=suggested().find(x=>x.id===id);if(!c)return;
    if(S.profile.trophies<c.req){SND.play('error');
      FX.toast('Il te faut '+fmt.f(c.req)+' trophées','b','🔒');return;}
    S.clan=Object.assign({},c,{role:'Membre',joined:Date.now(),war:null});
    save(1);SND.play('unlock');FX.confetti(65);FX.toast('Bienvenue chez '+c.name+' !','a',c.badge);UI.refresh();}
  async function leaveClan(){
    if(!await UI.confirm('Quitter le clan ?','Tu perdras ta contribution de la semaine.','Quitter'))return;
    S.clan=null;S.chat.clan=[];save(1);SND.play('back');UI.refresh();}
  function claimWar(i){
    const W=war();if(!W||W.w.claimed.indexOf(i)>=0||W.my<TIERS[i].g)return;
    W.w.claimed.push(i);const rw=TIERS[i].rw;
    if(rw.gold)addGold(rw.gold);if(rw.gems)addGems(rw.gems);if(rw.chest)grantChest(rw.chest);
    save(1);SND.play('coin');FX.confetti(55);FX.toast('Récompense récupérée !','a','⚔️');UI.refresh();}
  function sendClan(node){
    const i=node.querySelector('#clin');if(!i)return;
    const txt=i.value.trim();if(!txt)return;i.value='';
    const m={id:uid(8),ch:'clan',clan:S.clan.name,txt,n:S.profile.name,av:S.profile.avatar,ts:Date.now()};
    NET.send('chat',m);
    const mine=Object.assign({},m,{mine:1});
    S.chat.clan.push(mine);if(S.chat.clan.length>120)S.chat.clan.shift();
    save();qProgress('clanmsg',1);SND.play('msg');
    const l=node.querySelector('#cllog');
    if(l){l.insertAdjacentHTML('beforeend','<div class="msg me"><u>'+mine.av+' '+esc(mine.n)+
      '<em>'+fmt.hm(mine.ts)+'</em></u>'+esc(mine.txt)+'</div>');l.scrollTop=l.scrollHeight;}}
  Bus.on('session:reps',n=>{if(!S.clan)return;const W=war();if(W){W.w.my+=n;save();}});
  Bus.on('clan:msg',m=>{
    if(!S.clan||m.clan!==S.clan.name)return;
    S.chat.clan.push(m);if(S.chat.clan.length>120)S.chat.clan.shift();save();
    if(UI.current==='clan'&&tab==='chat')UI.refresh();
    else FX.toast(m.n+' (clan) : '+m.txt.slice(0,28),'','🛡️');});
  return{war,weekLeft};
})();

        '<input type="range" class="sld" id="mr" min="200" max="1200" step="20" value="'+t.minRepMs+'"></div>'+
        swh('showSkel','Afficher le squelette',t.showSkeleton)+
        swh('strict','Refuser les pompes mal exécutées',t.strictForm)+
        swh('mirror','Image miroir',s.mirror)+'</div>'+

        '<div class="pan sec"><div class="panT">🔊 Son & retour</div>'+
        swh('sfx','Effets sonores',s.sfx)+swh('music','Musique',s.music)+
        swh('countVoice','Compter à voix haute',s.countVoice)+swh('coach','Coach vocal',s.coach)+
        swh('haptics','Vibrations',s.haptics)+'</div>'+

        '<div class="pan sec"><div class="panT">📡 Connexion</div>'+

        '<div class="pan sec"><div class="panT">💾 Sauvegarde</div>'+

        '<button class="btn sm" style="flex:1" data-a="imp">Importer</button></div>'+

/* ============================ 9. DUEL ============================ */
const DUEL=(()=>{
  let D=null,mmBox=null,wakeLock=null;

  async function keepAwake(on){
    try{
      if(on&&'wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');}
      else if(wakeLock){wakeLock.release();wakeLock=null;}
    }catch(e){}
  }
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'&&D&&D.running)keepAwake(1);});

  function quickStart(o){
    o=o||{};
    if(!S.profile.created){MAIN.createProfile();return;}
    find(o.mode||quickMode(),o);
  }
  function find(mode,o){
    o=o||{};
    const ranked=o.ranked!==0&&!!MODES[mode].ranked;
    mmBox=h('<div class="mm"><div class="mmS"></div>'+
      '<div class="mmT">Recherche d\'un adversaire…</div>'+
      '<div class="mmX" id="mmx">'+(NET.isOnline()?'Joueurs en ligne : '+NET.peerList().length:'Mode hors-ligne')+'</div>'+
      '<div class="chip au">'+MODES[mode].i+' '+MODES[mode].n+'</div>'+
      '<button class="btn bn" id="mmc">Annuler</button></div>');
    $('#ovl').appendChild(mmBox);
    let done=0,stop=null;const t0=Date.now();
    function clean(){if(stop)stop();NET.cancelSeek();clearInterval(iv);
      if(mmBox){mmBox.remove();mmBox=null;}}
    mmBox.querySelector('#mmc').onclick=()=>{done=1;clean();SND.play('back');};
    if(NET.isOnline())stop=NET.seekMatch({mode,onFound:(opp,m,startAt,id)=>{
      if(done)return;done=1;
      vs(opp,()=>{clean();startDuel({mode:m,opp,ranked,net:1,startAt,duelId:id});});}});
    const wait=NET.isOnline()?rndI(4200,7000):rndI(1300,2300);
    const iv=setInterval(()=>{
      if(done)return;
      const el=Date.now()-t0,x=mmBox&&mmBox.querySelector('#mmx');
      if(x)x.textContent=NET.isOnline()
        ?'Joueurs en ligne : '+NET.peerList().length+' · '+Math.floor(el/1000)+'s'
        :'Adversaire simulé en préparation…';
      if(el>wait&&!NET.isPending()){
        done=1;
        const bot=makeBot(Date.now()+'_'+uid(4),S.profile.trophies);
        vs(bot,()=>{clean();startDuel({mode,opp:bot,ranked,net:0});});}
    },400);
  }
  function vs(opp,then){
    if(!mmBox)return then();
    const me=pubProfile();SND.play('swoosh');
    mmBox.innerHTML='<div class="mmV">'+
      '<div class="mmP"><div class="av au">'+me.avatar+'</div><b>'+esc(me.name)+'</b><s>🏆 '+me.trophies+'</s></div>'+
      '<div class="vs" style="width:50px;height:50px;font-size:18px">VS</div>'+
      '<div class="mmP"><div class="av">'+opp.avatar+'</div><b>'+esc(opp.name)+'</b><s>🏆 '+opp.trophies+'</s></div></div>'+
      '<div class="mmX">'+(opp.bot?'Adversaire hors-ligne':'Joueur en ligne · connecté')+'</div>';
    FX.shake(6,280);setTimeout(then,1400);
  }

  function duelHtml(mode,me,opp){
    const M=MODES[mode];
    return '<div class="stage"><video id="dv" playsinline muted autoplay></video>'+
      '<canvas id="dsk"></canvas></div><div class="vig"></div>'+
      '<div class="dTop"><div class="fgs">'+fg('me',me)+'<div class="vs">VS</div>'+fg('op',opp)+'</div></div>'+
      '<div class="dTim" id="dtim"><b>--</b><small>'+M.n+'</small></div>'+
      '<div class="dMid">'+
      '<div class="ring" id="drg"><svg viewBox="0 0 120 120">'+
      '<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">'+
      '<stop offset="0%" stop-color="#8bf0a4"/><stop offset="100%" stop-color="#4aa8ff"/></linearGradient></defs>'+
      '<circle class="rbg" cx="60" cy="60" r="52"/>'+
      '<circle class="rfg" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>'+
      '<div class="rPulse"></div><div style="text-align:center">'+
      '<div class="rN" id="drep">0</div><div class="rL">pompes</div></div></div>'+
      '<div class="post up" id="dpo"><i></i><span>PRÊT</span></div>'+
      '<div class="gauges"><div class="gg"><div class="ggH"><span>Coude</span>'+
      '<span class="ggV" id="gel">—</span></div><div class="ggB"><i id="gelb" style="width:0%"></i></div></div>'+
      '<div class="gg"><div class="ggH"><span>Forme du corps</span>'+
      '<span class="ggV" id="gfo">—</span></div><div class="ggB"><i id="gfob" style="width:0%"></i></div></div></div>'+
      '<div class="trk"><div class="trkH"><span class="trkM" id="dmo"><i></i>—</span>'+
      '<span class="trkQ" id="dq">—</span></div><canvas class="wave" id="dw"></canvas>'+
      '<div class="hint" id="dh">Place-toi de profil devant la caméra.</div></div></div>'+
      '<div class="dBot"><div class="emos">'+
      EMOTES.slice(0,6).map(e=>'<button class="emo" data-e="'+e+'">'+e+'</button>').join('')+'</div>'+
      '<div style="display:flex;gap:6px">'+
      '<button class="btn bn" data-a="quit" style="flex:0 0 auto">Abandonner</button>'+
      '<button class="btn bv" data-a="tap" style="flex:1">+1 POMPE</button></div></div>'+
      '<div class="cd" id="dcd"><div class="cdN">3</div><div class="cdS">Mets-toi en position !</div></div>';
  }
  function fg(side,p){
    return '<div class="fg '+side+'" id="f'+side+'"><div class="fgH">'+
      '<div class="av">'+p.avatar+'</div><div style="min-width:0">'+
      '<div class="fgN">'+esc(p.name)+'</div><div class="fgT">🏆 '+fmt.n(p.trophies)+'</div></div></div>'+
      '<div class="fgS" id="s'+side+'">0</div>'+
      '<div class="fgB"><i id="b'+side+'" style="width:0%"></i></div>'+
      '<div class="fgX" id="x'+side+'"></div></div>';
  }

  async function startDuel(cfg){
    const M=MODES[cfg.mode],me=pubProfile();
    let dur=M.dur;
    if(dur&&(cfg.mode==='sprint'||cfg.mode==='sprint30'))dur+=effect('timeBonus');
    D={mode:cfg.mode,M,opp:cfg.opp,ranked:!!cfg.ranked&&M.ranked!==0,net:!!cfg.net,duelId:cfg.duelId,
      duration:dur,target:M.target||0,myReps:0,oppReps:0,startAt:0,running:0,ended:0,
      bestSet:0,curSet:0,lastRepT:0,formSum:0,formN:0,sw:0,emotes:6,
      lastOpp:Date.now(),warned:0};
    const sb=Math.floor(effect('startBonus'));if(sb>0)D.myReps=sb;

    const el=h('<div class="duel"></div>');
    el.innerHTML=duelHtml(cfg.mode,me,cfg.opp);
    document.body.appendChild(el);D.el=el;
    SND.duck(1);keepAwake(1);
    bindUi(el);

    const hint=el.querySelector('#dh');
    hint.textContent='Activation de la caméra…';
    let mode='manual';
    // waitModel:0 → si le modèle n'est pas encore téléchargé, le duel démarre
    // quand même (mode simple) et passe au squelette dès qu'il est prêt.
    try{mode=await TR.start({waitModel:0,onProg:(p,t)=>{hint.textContent=t+' '+Math.round(p*100)+'%';}});}
    catch(e){mode='manual';}
    reflect(el,mode);
    D.upg=Bus.on('tracker:upgrade',()=>{reflect(el,'pose');
      FX.toast('Squelette IA activé','g','🦴');});
    const v=el.querySelector('#dv');
    if(mode!=='manual'&&TR.video&&TR.video.srcObject){
      v.srcObject=TR.video.srcObject;v.setAttribute('playsinline','');v.play().catch(()=>{});
      el.classList.add('camon');
    }
    const mir=S.settings.mirror?'scaleX(-1)':'none';
    v.style.transform=mir;el.querySelector('#dsk').style.transform=mir;

    TR.onRep=onRep;
    TR.onState=s=>{
      const p=el.querySelector('#dpo');
      if(s==='bad'){FX.floatText('TROP HAUT','50%',innerHeight*.4,'#ff8d78');return;}
      p.className='post '+s;
      p.querySelector('span').textContent=s==='down'?'DESCENTE':'REMONTÉE';};

    // Si l'ouverture de la caméra a pris du temps, l'heure de départ convenue
    // peut déjà être passée : on garde toujours un vrai décompte.
    await countdown(el,Math.max(cfg.startAt||0,Date.now()+3200));
    D.startAt=Date.now();D.running=1;
    TR.reset();TR.reps=0;SND.resetCount();
    if(sb>0)FX.toast('Échauffement : +'+sb,'g','🔥');
    if(S.settings.coach)SND.say("C'est parti !");
    if(!D.net)startBot();
    startClock();startLoop();
  }
  function reflect(el,mode){
    const m=el.querySelector('#dmo');
    m.innerHTML='<i></i>'+TR.modeLabel();
    m.classList.toggle('bad',mode==='manual');
    el.querySelector('#dh').textContent=mode==='pose'
      ?'Comptage automatique par squelette. Descends jusqu\'à '+S.settings.tracker.downAngle+'° de coude.'
      :mode==='motion'?'Mode simple : la caméra suit ton mouvement global.'
      :'Comptage manuel : ESPACE ou le bouton vert.';
    if(mode==='manual')el.querySelector('.gauges').style.display='none';
  }
  function countdown(el,startAt){
    return new Promise(res=>{
      const cd=el.querySelector('#dcd'),n=cd.querySelector('.cdN');let last=-1;
      const iv=setInterval(()=>{
        const left=Math.ceil((startAt-Date.now())/1000);
        if(left===last)return;last=left;
        if(left>0){n.textContent=left;n.style.animation='none';void n.offsetWidth;n.style.animation='';
          SND.play('beep');vibrate(30);
          if(left===3&&S.settings.coach)SND.say('Prêt ?');}
        else{n.textContent='GO !';n.style.animation='none';void n.offsetWidth;n.style.animation='';
          SND.play('go');vibrate([60,40,60]);FX.shake(8,380);clearInterval(iv);
          setTimeout(()=>{cd.remove();res();},580);}
      },60);});
  }
  function onRep(n,form){
    if(!D||!D.running||D.ended)return;
    let add=1;
    const crit=effect('critPct');
    if(crit>0&&Math.random()*100<crit){add=2;
      FX.floatText('CRITIQUE ×2',innerWidth/2,innerHeight*.42,'#ffd24a');SND.play('lead');}
    if(D.duration){
      const left=D.duration-(Date.now()-D.startAt)/1000,tp=effect('titanPct');
      if(left<=5&&tp>0&&Math.random()*100<tp){add*=2;
        FX.floatText('TITAN ×2',innerWidth/2,innerHeight*.5,'#ff5ea8');}}
    D.myReps+=add;
    if(form>0){D.formSum+=form;D.formN++;}
    const now=performance.now();
    if(now-D.lastRepT<8000)D.curSet+=add;else D.curSet=add;
    D.lastRepT=now;
    if(D.curSet>D.bestSet)D.bestSet=D.curSet;
    SND.play('rep');vibrate(22);
    if(S.settings.countVoice)SND.sayCount(D.myReps);
    if(D.myReps%10===0&&S.settings.coach)setTimeout(()=>SND.encourage(),400);
    const rg=D.el.querySelector('#drg');
    rg.classList.remove('fl');void rg.offsetWidth;rg.classList.add('fl');
    bump('#drep');bump('#sme');
    FX.confetti(5,{y:innerHeight*.45,spread:.5,color:'#8bf0a4'});
    if(D.net)NET.duelSend('rep',{n:D.myReps,fm:Math.round(TR.form)});
    scores();
    if(D.target&&D.myReps>=D.target)finish('target');
  }
  function bump(sel){const n=D.el.querySelector(sel);if(!n)return;
    n.classList.remove('bump');void n.offsetWidth;n.classList.add('bump');}
  function startBot(){
    const b=D.opp;let t=0;
    D.bot=setInterval(()=>{
      if(!D||!D.running||D.ended)return;
      t+=.25;
      const fat=Math.exp(-t/(28+b.stamina*55)),rate=b.pace*(.55+.45*fat);
      if(Math.random()<rate*.25*(1+(Math.random()-.5)*b.jitter*2)){
        D.oppReps++;scores();
        if(D.target&&D.oppReps>=D.target)finish('target');}
      if(Math.random()<.006)emotePop(pick(EMOTES),0);
    },250);
  }
  function startClock(){
    let beeped=0;
    D.clock=setInterval(()=>{
      if(!D||!D.running)return;
      const el=D.el.querySelector('#dtim');if(!el)return;
      const e=(Date.now()-D.startAt)/1000;
      if(D.duration){
        const left=Math.max(0,D.duration-e);
        el.querySelector('b').textContent=fmt.clock(left);
        el.classList.toggle('urg',left<=10);
        if(left<=3&&!beeped){beeped=1;SND.play('beep');}
        if(left<=0)finish('time');
      }else el.querySelector('b').textContent=fmt.clock(e);
    },200);
  }
  function startLoop(){
    let lastSync=0,lastLead=null,lastDraw=0,lastGauge=0;
    D.loop=Loop.add((dt,t)=>{
      if(!D||!D.running)return;
      const el=D.el,e=(Date.now()-D.startAt)/1000;
      const rf=el.querySelector('.rfg');
      const goal=D.target||Math.max(20,Math.max(D.myReps,D.oppReps)+8);
      rf.style.strokeDashoffset=(326.7*(1-clamp(D.myReps/goal,0,1))).toFixed(1);
      // rendu limité à ~30 images/s : au-delà, un téléphone rame pour rien
      if(t-lastDraw>32){
        lastDraw=t;
        TR.drawSkeleton(el.querySelector('#dsk'),{mirror:S.settings.mirror?1:0});
        TR.drawWave(el.querySelector('#dw'));
      }
      // jauges : écritures DOM limitées à ~8/s
      if(t-lastGauge>120){
      lastGauge=t;
      if(TR.mode!=='manual'){
        const ge=el.querySelector('#gel'),gf=el.querySelector('#gfo');
        if(TR.mode==='pose'){
          if(TR.visible){
            const a=Math.round(TR.elbow);
            ge.textContent=a+'°';
            ge.className='ggV'+(a<S.settings.tracker.downAngle?' bad':a>S.settings.tracker.upAngle?'':' warn');
            el.querySelector('#gelb').style.width=clamp((180-a)/120*100,0,100)+'%';
            const f=Math.round(TR.form);
            gf.textContent=f+'%';
            gf.className='ggV'+(f>80?'':f>55?' warn':' bad');
            el.querySelector('#gfob').style.width=f+'%';
          }else{ge.textContent='?';gf.textContent='—';el.querySelector('#dh').textContent=
            'Je ne te vois pas : recule le téléphone et mets-toi de profil.';}
        }
      }
      el.querySelector('#dq').textContent=TR.quality?'précision '+TR.quality+'%':'—';
      }
      if(!D.sw){
        const sw=effect('secondWind');
        if(sw>0&&D.oppReps-D.myReps>=3&&(!D.duration||e>D.duration*.55)){
          D.sw=1;const n=Math.floor(sw);D.myReps+=n;
          FX.floatText('SECOND SOUFFLE +'+n,innerWidth/2,innerHeight*.4,'#b45cff');
          SND.play('levelup');scores();}}
      if(D.net){
        if(t-lastSync>260){lastSync=t;NET.duelSend('sync',{n:D.myReps,fm:Math.round(TR.form)});}
        const sil=Date.now()-D.lastOpp;
        if(sil>6000&&!D.warned){D.warned=1;FX.toast('Connexion instable…','b','📡');
          el.querySelector('#xop').textContent='connexion perdue ?';}
        if(sil>15000){finish('oppquit');return;}}
      const lead=D.myReps>D.oppReps?'me':D.myReps<D.oppReps?'op':'eq';
      if(lead!==lastLead){
        if(lead==='me'&&lastLead)SND.play('lead');
        lastLead=lead;
        el.querySelector('#fme').classList.toggle('led',lead==='me');
        el.querySelector('#fop').classList.toggle('led',lead==='op');}
    });
  }
  function scores(){
    if(!D||!D.el)return;
    const el=D.el;
    el.querySelector('#drep').textContent=D.myReps;
    el.querySelector('#sme').textContent=D.myReps;
    el.querySelector('#sop').textContent=D.oppReps;
    const max=Math.max(D.target||0,D.myReps,D.oppReps,10);
    el.querySelector('#bme').style.width=(D.myReps/max*100)+'%';
    el.querySelector('#bop').style.width=(D.oppReps/max*100)+'%';
    const d=D.myReps-D.oppReps;
    el.querySelector('#xme').textContent=d>0?'+'+d+' d\'avance':'';
    el.querySelector('#xop').textContent=d<0?'+'+(-d)+' d\'avance':'';
  }
  function bindUi(el){
    onAct(el,{
      quit:async()=>{if(await UI.confirm('Abandonner ?','Tu perdras le duel et des trophées.','Abandonner')){
        if(D&&D.net)NET.duelSend('quit',{});finish('forfeit');}},
      tap:()=>{if(D&&D.running)TR.manualRep();}
    });
    el.addEventListener('click',e=>{const b=e.target.closest('[data-e]');if(b)sendEmote(b.dataset.e);});
    D.key=e=>{if(!D||!D.running)return;
      if(e.code==='Space'){e.preventDefault();TR.manualRep();}};

  function sendEmote(e){
    if(!D||D.emotes<=0)return;
    D.emotes--;emotePop(e,1);
    if(D.net)NET.duelSend('emote',{e});
    SND.play('emote');}
  function emotePop(e,mine){
    const n=h('<div class="emoPop">'+e+'</div>');
    n.style.left=(mine?innerWidth*.25:innerWidth*.75)+'px';
    n.style.top=(innerHeight*.32)+'px';
    document.body.appendChild(n);setTimeout(()=>n.remove(),1550);}

  function finish(reason){
    if(!D||D.ended)return;
    D.ended=1;D.running=0;
    clearInterval(D.bot);clearInterval(D.clock);
    if(D.loop)D.loop();
    if(D.upg)D.upg();
    removeEventListener('keydown',D.key);
    TR.onRep=null;TR.onState=null;TR.stop();SND.shutUp();keepAwake(0);
    if(D.net)NET.duelSend('end',{n:D.myReps});
    const sec=(Date.now()-D.startAt)/1000;
    let result='draw';
    if(reason==='forfeit')result='lose';
    else if(reason==='oppquit')result='win';
    else if(D.myReps>D.oppReps)result='win';
    else if(D.myReps<D.oppReps)result='lose';
    const form=D.formN?D.formSum/D.formN:0;
    recordSession(D.myReps,sec,D.bestSet,form);
    touchDay();
    const rw=rewards(result,form);
    recordDuel({mode:D.mode,oppName:D.opp.name,oppAvatar:D.opp.avatar,myReps:D.myReps,
      oppReps:D.oppReps,result,delta:rw.trophies,seconds:sec,bot:!!D.opp.bot,form});
    if(D.net)NET.endNetDuel();
    const el=D.el;el.classList.add('out');setTimeout(()=>el.remove(),330);
    SND.duck(0);
    showResult(result,rw,sec,form);
  }
  function rewards(result,form){
    const s=S.stats,reps=D.myReps;
    const o={trophies:0,gold:0,xp:0,crowns:0,chest:null,chest2:null,recs:[]};
    if(D.ranked){
      const diff=(D.opp.trophies||0)-S.profile.trophies;
      const base=30*(1+clamp(diff/420,-.45,.55));
      if(result==='win')o.trophies=clamp(Math.round(base*(1+effect('trophyPct')/100)),12,60);
      else if(result==='lose')o.trophies=clamp(-Math.round(base*(1-effect('trophyGuard')/100)),-50,-6);
    }
    let gm=(1+effect('goldPct')/100)*streakMult();
    if(form>85&&effect('formPct')>0)gm*=1+effect('formPct')/100;
    o.gold=Math.round((reps*1.35+(result==='win'?45:12))*gm);
    o.xp=Math.round((reps*2.1+(result==='win'?30:10))*(1+effect('xpPct')/100));
    if(result==='win'){
      o.crowns=D.myReps-D.oppReps>=15?3:D.myReps-D.oppReps>=6?2:1;
      const t=randChest();if(grantChest(t))o.chest=t;
      if(Math.random()*100<effect('dblChest')){const t2=randChest();if(grantChest(t2))o.chest2=t2;}
    }
    if(D.bestSet>=s.bestSet&&D.bestSet>0)o.recs.push('Série record : '+D.bestSet);
    if(D.mode==='sprint'&&reps>=s.bestSprint60&&reps>0)o.recs.push('Record 60s : '+reps);
    addGold(o.gold,1);addXp(o.xp);
    if(o.trophies)addTrophies(o.trophies);
    if(o.crowns)addCrowns(o.crowns);
    return o;
  }
  function showResult(result,rw,sec,form){
    const ban=result==='win'?'VICTOIRE !':result==='lose'?'DÉFAITE':'ÉGALITÉ';
    const cls=result==='win'?'win':result==='lose'?'lose':'draw';
    const items=[];
    if(rw.trophies)items.push({i:'🏆',v:(rw.trophies>0?'+':'')+rw.trophies,l:'Trophées'});
    items.push({i:'🪙',v:'+'+fmt.f(rw.gold),l:'Or'});

    if(rw.crowns)items.push({i:'👑',v:'+'+rw.crowns,l:'Couronnes'});
    if(rw.chest)items.push({i:CHESTS[rw.chest].i,v:'×'+(rw.chest2?2:1),l:'Coffre'});
    const box=h('<div class="rslt">'+
      '<div class="resB '+cls+'">'+ban+'</div>'+
      '<div class="resS"><span>'+D.myReps+'</span><em>—</em>'+
      '<span style="color:#ff8d78">'+D.oppReps+'</span></div>'+
      '<div style="font-size:12px;color:var(--grey-300);margin-top:-4px">'+
      esc(S.profile.name)+' vs '+esc(D.opp.name)+' · '+MODES[D.mode].n+'</div>'+
      '<div class="rwds">'+items.map((r,i)=>'<div class="rwd" style="animation-delay:'+(i*.09+.3)+'s">'+
      '<u>'+r.i+'</u><b>'+r.v+'</b><s>'+r.l+'</s></div>').join('')+'</div>'+
      (rw.recs.length?'<div class="chip au">📈 '+rw.recs.join(' · ')+'</div>':'')+
      '<div class="stg">'+
      '<div class="st"><b>'+D.bestSet+'</b><s>Meilleure série</s></div>'+
      '<div class="st"><b>'+Math.round(sec)+'s</b><s>Durée</s></div>'+
      '<div class="st"><b>'+Math.round(form)+'%</b><s>Forme</s></div>'+
      '<div class="st"><b>'+Math.round(D.myReps*.32)+'</b><s>kcal</s></div>'+
      '<div class="st"><b>'+(TR.quality||0)+'%</b><s>Précision</s></div>'+
      '<div class="st"><b>'+(D.myReps&&sec?(D.myReps/sec*60).toFixed(0):0)+'</b><s>Pompes/min</s></div>'+
      '</div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center">'+
      '<button class="btn bn" data-a="home">Accueil</button>'+
      '<button class="btn bg lg" data-a="again">REJOUER</button></div></div>');
    $('#ovl').appendChild(box);
    if(result==='win'){SND.play('win');FX.confetti(150);vibrate([40,60,40,60]);}
    else if(result==='lose'){SND.play('lose');vibrate(180);}else SND.play('unlock');
    if(S.settings.coach)setTimeout(()=>SND.say(result==='win'?'Victoire ! '+D.myReps+' pompes.':
      result==='lose'?'Défaite. '+D.myReps+' pompes quand même.':'Égalité !'),600);
    const mode=D.mode;
    onAct(box,{home:()=>{box.remove();D=null;UI.go('arena',{force:1});UI.renderTop();},
      again:()=>{box.remove();D=null;UI.renderTop();quickStart({mode});}});
    UI.renderTop();checkAchs();
  }

  Bus.on('duel:opp',d=>{
    if(!D||!D.running)return;
    D.lastOpp=Date.now();
    if(D.warned){D.warned=0;D.el.querySelector('#xop').textContent='';}
    if(d.reps>D.oppReps){D.oppReps=d.reps;bump('#sop');}else D.oppReps=d.reps;

  Bus.on('duel:emote',e=>emotePop(e,0));

  async function setupFlow(){

      if(m!=='pose'){cx.innerHTML='<b style="color:#ffd24a">Le modèle IA n\'a pas pu être chargé.</b><br>'+
        'Mode simple utilisé (moins précis mais fonctionnel).';return;}
      cx.innerHTML='Mets-toi en position de pompes. Les voyants passent au vert quand tout est bon.';
      if(off)off();
      off=Loop.add(()=>{
        TR.drawSkeleton(box.querySelector('#cc'),{force:1,mirror:S.settings.mirror?1:0});
        const kp=TR.pose;
        const seen=i=>kp&&kp[i]&&kp[i].score>.32;

          {ok:!!kp,t:'Je te vois'},
          {ok:seen(TR.KP.lSho)||seen(TR.KP.rSho),t:'Épaules visibles'},
          {ok:seen(TR.KP.lElb)||seen(TR.KP.rElb),t:'Coudes visibles'},
          {ok:seen(TR.KP.lWri)||seen(TR.KP.rWri),t:'Poignets visibles'},
          {ok:seen(TR.KP.lHip)||seen(TR.KP.rHip),t:'Hanches visibles'},
          {ok:seen(TR.KP.lAnk)||seen(TR.KP.rAnk)||seen(TR.KP.lKne)||seen(TR.KP.rKne),t:'Jambes visibles'}
        ];
        pk.innerHTML=checks.map(c=>'<div class="pck '+(c.ok?'ok':'no')+'"><u>'+(c.ok?'✅':'⬜')+'</u>'+c.t+'</div>').join('');
      });
    }
    box.querySelector('#cq').onclick=()=>{if(off)off();TR.stop();box.remove();};
    box.querySelector('#cf').onclick=()=>{facing=facing==='user'?'environment':'user';boot();};
    box.querySelector('#cok').onclick=()=>{
      if(off)off();TR.stop();S.pose.calibrated=1;S.pose.at=Date.now();save(1);
      box.remove();SND.play('unlock');FX.toast('Caméra réglée !','g','🎯');};
    boot();
  }

    else box.querySelector('.calCam').style.display='none';
    const mir=S.settings.mirror?'scaleX(-1)':'none';
    v.style.transform=mir;box.querySelector('#tc').style.transform=mir;
    TR.onRep=n=>{cnt.textContent=n;
      cnt.animate([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:280,easing:'cubic-bezier(.2,1.4,.35,1)'});
      SND.play('rep');vibrate(20);};
    TR.onState=s=>{if(s==='bad'){inf.textContent='pompe refusée : pas assez bas / dos creusé';return;}
      po.className='post '+s;po.querySelector('span').textContent=s==='down'?'DESCENTE':'REMONTÉE';};
    const off=Loop.add(()=>{
      TR.drawSkeleton(box.querySelector('#tc'),{force:1,mirror:S.settings.mirror?1:0});
      TR.drawWave(box.querySelector('#tw'));
      inf.textContent=TR.modeLabel()+(TR.mode==='pose'?
        ' · coude '+Math.round(TR.elbow)+'° · forme '+Math.round(TR.form)+'%':'')+
        (TR.quality?' · '+TR.quality+'%':'');});
    const key=e=>{if(e.code==='Space'){e.preventDefault();TR.manualRep();}};
    addEventListener('keydown',key);
    const bind=(i,vv,k)=>{const el=box.querySelector(i);
      el.addEventListener('input',()=>{S.settings.tracker[k]=+el.value;
        box.querySelector(vv).textContent=el.value;save();});};
    bind('#td','#tdv','downAngle');bind('#tu','#tuv','upAngle');
    box.querySelector('#tr0').onclick=()=>{TR.reset();cnt.textContent='0';};
    box.querySelector('#tcl').onclick=()=>{
      off();removeEventListener('keydown',key);
      TR.onRep=null;TR.onState=null;TR.stop();
      const n=TR.reps;box.remove();
      if(n>0){recordSession(n,0,n,TR.form);FX.toast(n+' pompe'+(n>1?'s':'')+' ajoutée'+(n>1?'s':''),'g','💪');
        UI.renderTop();}};
  }
  return{quickStart,find,startDuel,setupFlow,testFlow,get current(){return D;}};
})();

/* ============================ 10. DÉMARRAGE ============================ */
const MAIN=(()=>{
  function prog(p,t){const b=$('#boot .bootBar i'),x=$('#boot .bootTip');
    if(b)b.style.width=(p*100)+'%';if(x&&t)x.textContent=t;}
  async function boot(){
    prog(.12,'Chargement de la sauvegarde…');loadSave();await sleep(150);
    prog(.32,"Préparation de l'arène…");rollQuests();rollShop();await sleep(120);
    prog(.55,'Effets visuels…');FX.init();UI.bind();UI.renderTop();await sleep(110);
    prog(.78,'Recherche de joueurs…');
    NET.init().then(s=>{
      if(s==='online')FX.toast('Connecté au réseau de joueurs','g','📡');
      else if(s==='local')FX.toast('Mode local (multi-onglets)','','💻');});
    await sleep(180);
    prog(1,'Prêt !');await sleep(230);
    $('#boot').classList.add('out');$('#app').classList.remove('hide');
    setTimeout(()=>{const b=$('#boot');if(b)b.remove();},500);
    UI.go('arena');
    // Le modèle de pose se télécharge en tâche de fond : quand le joueur
    // lance son premier duel, il est déjà prêt.
    if(S.settings.tracker.mode!=='manual')
      setTimeout(()=>TR.preload().catch(()=>{}),2500);
    if(!S.profile.created)setTimeout(createProfile,350);
    else setTimeout(welcome,450);
  }
  function createProfile(){
    let av=pick(S.cos.avatars);
    const m=UI.modal({title:'Bienvenue !',text:'Crée ton athlète. Tout reste sur ton appareil.',
      closable:0,backdrop:0,
      html:'<div style="text-align:center">'+
        '<div class="av au" id="pv" style="width:80px;height:80px;font-size:40px;margin:0 auto 12px">'+av+'</div>'+
        '<input class="inp" id="pn" maxlength="14" placeholder="Ton pseudo" '+
        'style="text-align:center;font-family:var(--ft);font-size:17px">'+
        '<div style="font-size:11px;color:var(--grey-300);margin:10px 0 5px;text-transform:uppercase;letter-spacing:1px">Ton avatar</div>'+
        '<div class="pick" style="justify-content:center;max-height:120px;overflow:auto">'+
        S.cos.avatars.map(a=>'<button class="'+(a===av?'on':'')+'" data-a="'+a+'">'+a+'</button>').join('')+
        '</div></div>',
      buttons:[{label:'Commencer',cls:'bg lg',keepOpen:1,action:(box,close)=>{
        const n=box.querySelector('#pn').value.trim();
        if(n.length<2){FX.toast('Choisis un pseudo (2 caractères min)','b','✏️');SND.play('error');return false;}
        S.profile.name=n;S.profile.avatar=av;S.profile.created=1;save(1);
        close();SND.play('levelup');FX.confetti(110);UI.renderTop();UI.refresh();
        setTimeout(onboarding,420);}}]});
    m.body.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
      av=b.dataset.a;
      m.body.querySelectorAll('[data-a]').forEach(x=>x.classList.toggle('on',x.dataset.a===av));
      m.body.querySelector('#pv').textContent=av;SND.play('tap');});
    setTimeout(()=>{const i=m.body.querySelector('#pn');if(i)i.focus();},280);
  }
  function onboarding(){
    UI.modal({title:'Comment ça marche',closable:0,
      html:'<div style="font-size:13px;line-height:1.65;color:#dbe7f7">'+
      '<div style="display:flex;gap:9px;margin-bottom:9px"><span style="font-size:24px">📱</span><div>'+
      '<b style="color:var(--gold-200)">Pose le téléphone au sol, sur le côté</b>, à 1–2 m, calé contre '+
      'un mur. Il doit voir tout ton corps de profil.</div></div>'+
      '<div style="display:flex;gap:9px;margin-bottom:9px"><span style="font-size:24px">🦴</span><div>'+
      "L'IA détecte ton squelette et mesure <b style=\"color:var(--gold-200)\">l'angle de ton coude</b>. "+
      'Aucune image ne quitte ton téléphone.</div></div>'+
      '<div style="display:flex;gap:9px;margin-bottom:9px"><span style="font-size:24px">⚔️</span><div>'+
      'Fais <b style="color:var(--gold-200)">plus de pompes que ton adversaire</b> pour gagner trophées, '+
      'or et coffres.</div></div>'+
      '<div style="display:flex;gap:9px"><span style="font-size:24px">👆</span><div>'+
      'Pas de caméra ? <b>ESPACE</b> ou le bouton vert comptent aussi.</div></div></div>',
      buttons:[{label:'Plus tard',cls:'bn',action:()=>gift()},
        {label:'📷 Régler la caméra',cls:'bg',action:()=>{gift();setTimeout(()=>DUEL.setupFlow(),800);}}]});
  }
  function gift(){
    grantChest('argent');
    if(S.chests[0])S.chests[0].state='ready';
    save(1);UI.refresh();UI.renderNav();FX.toast('Coffre de bienvenue offert !','a','🎁');
  }
  function welcome(){
    const r=touchDay();if(!r.changed)return;
    const s=S.stats,bonus=Math.round(80*streakMult()+s.streak*25);
    addGold(bonus,1);addGems(s.streak%5===0?5:1,1);UI.renderTop();
    UI.modal({title:r.broke?'Nouvelle série !':'Série de '+s.streak+' jours 🔥',
      text:r.broke?"Ta série s'était arrêtée. On repart de zéro — tu peux le faire."
        :'Tu reviens '+s.streak+' jour'+(s.streak>1?'s':'')+" d'affilée. Or ×"+streakMult().toFixed(2)+'.',
      html:'<div style="text-align:center"><div style="font-size:56px;animation:float 2.4s ease-in-out infinite">🔥</div>'+
        '<div style="display:flex;gap:8px;justify-content:center;margin-top:8px">'+
        '<div class="rwd"><u>🪙</u><b>+'+fmt.f(bonus)+'</b><s>Or</s></div>'+
        '<div class="rwd"><u>💎</u><b>+'+(s.streak%5===0?5:1)+'</b><s>Gemmes</s></div></div></div>',
      buttons:[{label:'Super !',cls:'bg'}]});
    SND.play('coin');FX.confetti(65);
  }
  function bindGlobal(){
    addEventListener('pagehide',()=>save(1));
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden){save(1);SND.stopMusic();}
      else if(S.settings.music)SND.startMusic();});
    const unlock=()=>{SND.unlock();if(S.settings.music)SND.startMusic();
      document.removeEventListener('pointerdown',unlock);document.removeEventListener('keydown',unlock);};
    document.addEventListener('pointerdown',unlock);
    document.addEventListener('keydown',unlock);
    addEventListener('keydown',e=>{
      if(DUEL.current)return;
      const tg=(e.target.tagName||'').toLowerCase();
      if(tg==='input'||tg==='textarea')return;
      const map={'1':'shop','2':'talents','3':'arena','4':'social','5':'clan'};
      if(map[e.key]){UI.go(map[e.key]);return;}
      if((e.code==='Space'||e.key==='Enter')&&UI.current==='arena'&&!$('.mod')){
        e.preventDefault();DUEL.quickStart();}});
    // évite le zoom par double-tap sur iOS
    let lt=0;
    document.addEventListener('touchend',e=>{const n=Date.now();
      if(n-lt<300)e.preventDefault();lt=n;},{passive:false});
    addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__ip=e;
      if(!S.flags.ih){S.flags.ih=1;save();
        setTimeout(()=>FX.toast("Installe le jeu : menu ☰ → Installer",'a','📲'),6000);}});
    addEventListener('error',e=>console.error('[erreur]',e.error||e.message));
  }
  bindGlobal();
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
  else boot();
  return{createProfile,onboarding,welcome};
})();
</script>
</body>
