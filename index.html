<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Clash of Pushups - Duel Edition</title>

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- MediaPipe pour les pompes -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <!-- PeerJS pour le multijoueur P2P SANS SERVEUR -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --cr-blue: #2b78e4;
            --cr-red: #f54242;
            --cr-gold: #ffcc00;
            --cr-wood: #5c4033;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #050a14; color: white;
            display: flex; justify-content: center;
            height: 100vh; overflow: hidden;
            /* Nouveau fond inspiré de l'image (dots bleus foncés) */
            background-image: radial-gradient(#112244 15%, transparent 16%), radial-gradient(#112244 15%, transparent 16%);
            background-size: 40px 40px; background-position: 0 0, 20px 20px;
        }

        .screen {
            display: none; width: 100%; max-width: 500px; height: 100%;
            flex-direction: column; position: relative; z-index: 1;
            background: linear-gradient(to bottom, rgba(10,20,40,0.9), rgba(0,0,0,0.95));
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .active-screen { display: flex; }

        .cr-button {
            background: linear-gradient(to bottom, #ffe44d, var(--cr-gold) 40%, #cc9900);
            border: 3px solid #332200; border-radius: 12px;
            color: #4a3000; font-family: 'Anton', sans-serif; font-size: 1.2rem;
            padding: 12px 20px; text-transform: uppercase; cursor: pointer;
            box-shadow: inset 0 4px 0 rgba(255,255,255,0.6), 0 6px 0 #805500;
            margin: 10px 0; width: 100%; transition: 0.1s;
        }
        .cr-button.blue { background: linear-gradient(to bottom, #69a3ff, var(--cr-blue) 40%, #124d9c); color: white; box-shadow: inset 0 4px 0 rgba(255,255,255,0.4), 0 6px 0 #092c5c; }
        .cr-button.red { background: linear-gradient(to bottom, #ff6b6b, var(--cr-red) 40%, #9c1212); color: white; box-shadow: inset 0 4px 0 rgba(255,255,255,0.4), 0 6px 0 #5c0909; }
        .cr-button:active { transform: translateY(6px); box-shadow: 0 0px 0 #805500; }

        /* --- NOUVEAU DESIGN D'ARÈNE --- */
        .arena-3d-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; perspective: 1000px; }
        .arena-island {
            width: 260px; height: 340px; position: relative;
            transform-style: preserve-3d; transform: rotateX(55deg) rotateZ(-35deg);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .arena-surface {
            position: absolute; width: 100%; height: 100%;
            background: #5da13b;
            border: 8px solid #8c6239; border-radius: 10px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.7);
            overflow: hidden;
            /* Damier de gazon */
            background-image: 
                linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.05) 75%, rgba(0,0,0,0.05)), 
                linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.05) 75%, rgba(0,0,0,0.05));
            background-size: 40px 40px; background-position: 0 0, 20px 20px;
        }

        /* La Rivière au milieu */
        .arena-surface::before {
            content: ''; position: absolute; top: 45%; left: -10%; width: 120%; height: 10%;
            background: #2ab7ca; border-top: 3px solid #e0ce9a; border-bottom: 3px solid #e0ce9a;
            transform: rotate(-5deg); box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* Les deux ponts */
        .bridge {
            position: absolute; top: 44%; width: 40px; height: 15%; background: #a57147;
            border-left: 2px solid #3e2723; border-right: 2px solid #3e2723;
            box-shadow: 2px 5px 10px rgba(0,0,0,0.6);
        }
        .bridge.left { left: 20%; transform: rotate(-5deg); }
        .bridge.right { right: 20%; transform: rotate(-5deg); }

        /* Zones de déploiement (Couronnes) */
        .zone-red { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); opacity: 0.3; font-size: 3rem; }
        .zone-blue { position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%); opacity: 0.3; font-size: 3rem; }

        /* Epaisseur 3D */
        .arena-island::before {
            content: ''; position: absolute; width: 100%; height: 30px; background: var(--cr-wood);
            transform-origin: bottom; transform: rotateX(-90deg) translateY(30px); bottom: 0; border: 2px solid #2a1c0d; border-radius: 0 0 10px 10px;
        }
        .arena-island::after {
            content: ''; position: absolute; width: 30px; height: 100%; background: #3a2b1c;
            transform-origin: right; transform: rotateY(90deg) translateX(30px); right: 0; border: 2px solid #2a1c0d; border-radius: 0 10px 10px 0;
        }

        input {
            width: 100%; padding: 15px; font-size: 1.2rem;
            border-radius: 10px; border: 3px solid var(--cr-gold); background: rgba(0,0,0,0.7); color: white;
            margin-bottom: 15px; text-align: center; font-family: 'Anton'; letter-spacing: 1px;
        }

        /* HUB MULTIJOUEUR */
        .multiplayer-box { background: rgba(0,0,0,0.6); border: 2px solid #555; padding: 15px; border-radius: 10px; margin-top: 20px; text-align: center;}
        .code-display { font-size: 2rem; font-family: 'Anton'; color: var(--cr-gold); letter-spacing: 4px; margin: 10px 0; background: #000; padding: 10px; border-radius: 8px; border: 1px dashed var(--cr-gold);}

        /* BATAILLE HUD */
        #camera-wrapper { flex: 1; position: relative; background: #000; overflow: hidden; border-radius: 10px;}
        video { display: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        .battle-hud-top { display: flex; justify-content: space-between; padding: 10px 20px; position: absolute; top:0; width: 100%; z-index: 10; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);}
        .score { font-family: 'Anton'; font-size: 3.5rem; text-shadow: 3px 3px 0 #000; }
        
        .timer-box { font-family: 'Anton'; font-size: 2.5rem; color: white; text-shadow: 2px 2px #000; background: rgba(0,0,0,0.6); padding: 5px 20px; border-radius: 8px; border: 2px solid #555;}
        
        .sudden-death { animation: pulseRed 0.5s infinite alternate; }
        @keyframes pulseRed { from { box-shadow: inset 0 0 0px red; } to { box-shadow: inset 0 0 50px red; } }

    </style>
</head>
<body>

    <!-- MENU PRINCIPAL -->
    <div id="menu-screen" class="screen active-screen">
        <div style="padding: 20px; text-align: center;">
            <h1 style="font-family: 'Anton'; color: var(--cr-gold); font-size: 2.5rem; margin:0;">CLASH OF PUSHUPS</h1>
            <input type="text" id="player-name" placeholder="Ton Pseudo (ex: [DEV] GigaChad)" value="[DEV] PGM">
        </div>

        <div class="arena-3d-container">
            <h2 style="font-family: 'Anton';">1. Stade Gobelin</h2>
            <div class="arena-island" id="arena-island">
                <div class="arena-surface">
                    <div class="zone-red">🏰</div>
                    <div class="zone-blue">🏰</div>
                    <div class="bridge left"></div>
                    <div class="bridge right"></div>
                </div>
            </div>
        </div>

        <div style="padding: 20px;">
            <button class="cr-button" onclick="startBotMatch()">JOUER (VS IA)</button>
            
            <div class="multiplayer-box">
                <h3 style="margin: 0; font-family: 'Anton';">DUEL ENTRE AMIS (P2P)</h3>
                <p style="font-size: 0.8rem; color: #aaa;">Aucun serveur requis. Connexion directe.</p>
                
                <button class="cr-button blue" onclick="hostGame()">1. CRÉER UN CODE</button>
                <div id="my-code-box" style="display: none;">
                    <div>Ton code à envoyer :</div>
                    <div class="code-display" id="my-code">...</div>
                    <div style="font-size: 0.8rem; color: var(--cr-gold); animation: pulse 1s infinite;">En attente d'un adversaire...</div>
                </div>

                <div style="margin: 15px 0; border-top: 1px solid #444;"></div>
                
                <input type="text" id="friend-code" placeholder="Code de ton ami" style="margin-bottom: 5px;">
                <button class="cr-button red" onclick="joinGame()">2. REJOINDRE</button>
            </div>
        </div>
    </div>

    <!-- BATAILLE -->
    <div id="battle-screen" class="screen">
        <div id="camera-wrapper">
            <div class="battle-hud-top">
                <div style="text-align: left;">
                    <div id="p1-name" style="color: var(--cr-blue); font-weight: bold;">Toi</div>
                    <div class="score" id="player-score" style="color: var(--cr-blue);">0</div>
                </div>
                <div class="timer-box" id="timer">30</div>
                <div style="text-align: right;">
                    <div id="p2-name" style="color: var(--cr-red); font-weight: bold;">Ennemi</div>
                    <div class="score" id="enemy-score" style="color: var(--cr-red);">0</div>
                </div>
            </div>
            <video id="video" playsinline autoplay muted></video>
            <canvas id="canvas"></canvas>
            <div id="pose-hint" style="position: absolute; bottom: 20px; width: 100%; text-align: center; font-family: 'Anton'; font-size: 1.5rem; text-shadow: 2px 2px #000; color: var(--cr-gold);">Mets-toi en position !</div>
        </div>
    </div>

    <!-- RÉSULTAT -->
    <div id="result-screen" class="screen" style="justify-content: center; align-items: center;">
        <h1 id="result-title" style="font-family: 'Anton'; font-size: 5rem; text-shadow: 4px 4px 0 #000;">VICTOIRE</h1>
        <button class="cr-button" onclick="location.reload()" style="width: 80%;">RETOUR AU MENU</button>
    </div>

    <script>
        // ===================== LOGIQUE RESEAU P2P (PeerJS) =====================
        let peer = null;
        let conn = null;
        let isHost = false;
        let isMultiplayer = false;
        
        function initPeer() {
            if(peer) return;
            // Génère un ID aléatoire court de 5 lettres
            const id = Math.random().toString(36).substring(2, 7).toUpperCase();
            peer = new Peer(id);
            
            peer.on('open', (id) => {
                document.getElementById('my-code').innerText = id;
            });

            // Quand quelqu'un se connecte à moi (Le Host reçoit la connexion)
            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
            });
        }

        function hostGame() {
            document.getElementById('my-code-box').style.display = 'block';
            isHost = true;
            isMultiplayer = true;
            initPeer();
        }

        function joinGame() {
            const friendId = document.getElementById('friend-code').value.toUpperCase().trim();
            if(!friendId) return alert("Rentre un code !");
            
            isHost = false;
            isMultiplayer = true;
            initPeer();
            
            // On attend une demi-seconde que notre peer soit prêt avant de connecter
            setTimeout(() => {
                conn = peer.connect(friendId);
                setupConnection();
            }, 500);
        }

        function setupConnection() {
            conn.on('open', () => {
                alert("Connexion établie ! Le duel va commencer.");
                // On envoie notre pseudo à l'autre
                conn.send({ type: 'hello', name: document.getElementById('player-name').value });
                
                if(isHost) {
                    setTimeout(() => {
                        // Le host dicte le début de la partie
                        conn.send({ type: 'start' });
                        startBattle(document.getElementById('player-name').value, "Adversaire");
                    }, 2000);
                }
            });

            conn.on('data', (data) => {
                if (data.type === 'hello') {
                    document.getElementById('p2-name').innerText = data.name;
                }
                if (data.type === 'start' && !isHost) {
                    startBattle(document.getElementById('player-name').value, document.getElementById('p2-name').innerText);
                }
                if (data.type === 'score') {
                    enemyScore = data.score;
                    document.getElementById('enemy-score').innerText = enemyScore;
                }
            });
        }

        // ===================== LOGIQUE JEU =====================
        let playerScore = 0, enemyScore = 0, time = 30;
        let gameActive = false, timerInterval;
        let suddenDeath = false;

        function startBotMatch() {
            isMultiplayer = false;
            startBattle(document.getElementById('player-name').value, "Robot PGM");
            // Simulation IA très basique
            setInterval(() => { if(gameActive && Math.random() > 0.4 && !suddenDeath) { enemyScore++; document.getElementById('enemy-score').innerText = enemyScore; } }, 1500);
        }

        function startBattle(p1Name, p2Name) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById('battle-screen').classList.add('active-screen');
            
            document.getElementById('p1-name').innerText = p1Name;
            document.getElementById('p2-name').innerText = p2Name;
            
            playerScore = 0; enemyScore = 0; time = 30; gameActive = true; suddenDeath = false;
            startCamera();

            timerInterval = setInterval(() => {
                if(time > 0 && !suddenDeath) {
                    time--;
                    document.getElementById('timer').innerText = time;
                } else if (time === 0 && playerScore === enemyScore) {
                    // FEATURE : MORT SUBITE
                    suddenDeath = true;
                    document.getElementById('timer').innerText = "MORT SUBITE";
                    document.getElementById('timer').style.color = "var(--cr-red)";
                    document.getElementById('battle-screen').classList.add('sudden-death');
                } else if (time === 0 && playerScore !== enemyScore) {
                    endGame();
                }
            }, 1000);
        }

        function playerScored() {
            if(!gameActive) return;
            playerScore++;
            document.getElementById('player-score').innerText = playerScore;
            
            if(isMultiplayer && conn) {
                // On envoie la mise à jour du score par P2P
                conn.send({ type: 'score', score: playerScore });
            }

            // Si on est en mort subite et qu'on vient de marquer, on gagne direct.
            if(suddenDeath && playerScore > enemyScore) {
                setTimeout(endGame, 500);
            }
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById('result-screen').classList.add('active-screen');
            
            let title = document.getElementById('result-title');
            if(playerScore > enemyScore) { title.innerText = "VICTOIRE"; title.style.color = "#4caf50"; }
            else if(playerScore < enemyScore) { title.innerText = "DÉFAITE"; title.style.color = "var(--cr-red)"; }
            else { title.innerText = "ÉGALITÉ"; title.style.color = "white"; }
        }

        // ===================== DÉTECTION (Nouveau Système + Fiable + Fix Caméra) =====================
        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');
        let isDown = false;

        async function startCamera() {
            try {
                // 1. Force la demande de permission AVANT de lancer l'IA
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                videoElement.srcObject = stream;
                
                // 2. Initialise MediaPipe
                const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
                pose.setOptions({ modelComplexity: 0, smoothLandmarks: true });
                pose.onResults(onPoseResults);

                // 3. Lance la boucle de capture
                const camera = new Camera(videoElement, {
                    onFrame: async () => { await pose.send({image: videoElement}); },
                    width: 640, height: 480
                });
                camera.start();
                
            } catch (err) {
                alert("Impossible d'accéder à la caméra 🎥\nAssure-toi d'être sur GitHub Pages (HTTPS) ou sur un serveur local, et d'avoir autorisé l'accès.\nErreur technique : " + err.message);
            }
        }

        function onPoseResults(results) {
            if (!gameActive) return;
            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;
            canvasCtx.save(); 
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.translate(canvasElement.width, 0); 
            canvasCtx.scale(-1, 1);
            
            // Dessine le flux vidéo sur le canvas
            if (results.image) {
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            }

            if (results.poseLandmarks) {
                document.getElementById('pose-hint').style.display = 'none';
                
                // Repères : 11 (Epaule G), 12 (Epaule D), 13 (Coude G), 14 (Coude D)
                let shoulderL = results.poseLandmarks[11];
                let elbowL = results.poseLandmarks[13];
                let shoulderR = results.poseLandmarks[12];
                let elbowR = results.poseLandmarks[14];

                if(shoulderL && elbowL && shoulderR && elbowR) {
                    let avgShoulderY = (shoulderL.y + shoulderR.y) / 2;
                    let avgElbowY = (elbowL.y + elbowR.y) / 2;

                    if (avgShoulderY > avgElbowY - 0.05 && !isDown) {
                        isDown = true;
                        canvasElement.style.filter = "brightness(1.5)"; 
                        setTimeout(() => canvasElement.style.filter = "none", 100);
                    } 
                    else if (avgShoulderY < avgElbowY - 0.15 && isDown) {
                        isDown = false;
                        playerScored();
                    }
                }
            } else {
                document.getElementById('pose-hint').style.display = 'block';
            }
            canvasCtx.restore();
        }

        // Test sur mobile/PC sans faire de vraies pompes en cliquant sur la vidéo
        document.getElementById('camera-wrapper').addEventListener('click', playerScored);
    </script>
</body>
</html>
