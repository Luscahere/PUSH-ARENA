<title>Pushup Rivals — Duels de pompes classés</title>

<!-- =================================================================
     PUSHUP RIVALS
     - Compte local en 4 étapes + session persistante
     - Vision : MediaPipe Tasks Vision (PoseLandmarker lite, GPU)
       → fusion angle de coude + course verticale, calibrée au démarrage,
         pour compter aussi bien de profil que de FACE
     - Réseau : WebRTC via PeerJS ; adversaire de remplissage après 40 s
     ================================================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@400;500;600&family=Luckiest+Guy&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
/* ============================================================
   PUSHUP RIVALS — direction visuelle tirée du logo
   Ciel et nuages, bleu royal du personnage, or de la couronne,
   contour navy épais sur absolument tout, gouttes de sueur.
   ============================================================ */
:root{
  --sky-hi:#CDEBFF; --sky:#63BCEF; --sky-dk:#2E86C9;
  --royal:#3355B4;  --royal-hi:#4E76DA; --royal-dk:#1C3277;
  --ink:#14224C;                        /* le trait de contour */
  --cream:#FFF6E2;  --cream-dk:#E8D3A8;
  --gold-hi:#FFDF80; --gold:#F5B71E; --gold-dk:#A56A04;
  --sweat:#BFE3FF;
  --lime:#7DD321;   --lime-dk:#4C8A0B;
  --red:#FF5A5A;    --red-dk:#A81E1E;
  --blue:#2FA8FF;   --orange:#FF8A1F;
  --dim:#7286B5;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --nav-h:80px;
  /* Contour de texte, réutilisé partout : c'est la signature du logo */
  --stroke:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),
           2px 2px 0 var(--ink),0 -2px 0 var(--ink),0 2px 0 var(--ink),
           -2px 0 0 var(--ink),2px 0 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--sky);color:var(--ink);
  font-family:'Fredoka',system-ui,sans-serif;font-weight:500;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
}
.mono{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
h1,h2,h3,.disp{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;margin:0;line-height:1.05;
  text-transform:uppercase;letter-spacing:.01em}
.ol{color:#fff;text-shadow:var(--stroke),0 4px 0 rgba(20,34,76,.30)}

/* ---------- Ciel, nuages, sol d'arène ---------- */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(60vw 40vh at 50% 8%, rgba(255,223,128,.45), transparent 65%),
    linear-gradient(180deg,var(--sky-hi) 0%,var(--sky) 42%,var(--sky-dk) 100%)}
/* sol carrelé en perspective, comme sous le personnage du logo */
#bg::after{content:'';position:absolute;left:-40%;right:-40%;bottom:-8%;height:46%;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.30) 0 2px,transparent 2px 70px),
    repeating-linear-gradient(0deg,rgba(255,255,255,.24) 0 2px,transparent 2px 52px),
    linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.30));
  transform:perspective(300px) rotateX(70deg);
  mask-image:linear-gradient(transparent,#000 60%);
  -webkit-mask-image:linear-gradient(transparent,#000 60%)}
/* deux amas de nuages en pur CSS, dérive très lente */
#bg::before{content:'';position:absolute;top:11%;left:-14%;width:64px;height:64px;
  border-radius:50%;background:#fff;opacity:.92;
  box-shadow:
     44px 12px 0 -4px #fff, 86px 20px 0 -12px #fff, -34px 16px 0 -10px #fff,
     30vw 6vh 0 -6px #fff, calc(30vw + 46px) calc(6vh + 14px) 0 -14px #fff,
     58vw -3vh 0 -10px #fff, calc(58vw + 40px) calc(-3vh + 12px) 0 -18px #fff,
     78vw 14vh 0 -4px #fff, calc(78vw + 50px) calc(14vh + 16px) 0 -12px #fff;
  animation:drift 46s linear infinite}
@keyframes drift{to{transform:translateX(16vw)}}

/* ============================================================
   PLAQUES ET BOUTONS — tout est cerné, tout a une tranche
   ============================================================ */
.plate{position:relative;border:3px solid var(--ink);border-radius:22px;padding:15px;
  background:linear-gradient(180deg,var(--royal-hi),var(--royal));
  box-shadow:inset 0 4px 0 rgba(255,255,255,.28),inset 0 -7px 0 rgba(20,34,76,.30),
             0 6px 0 var(--royal-dk),0 14px 18px -10px rgba(20,34,76,.55);
  color:#fff}
.plate.cream{background:linear-gradient(180deg,#FFFDF6,var(--cream));color:var(--ink);
  box-shadow:inset 0 4px 0 rgba(255,255,255,.9),inset 0 -7px 0 rgba(200,170,110,.35),
             0 6px 0 var(--cream-dk),0 14px 18px -10px rgba(20,34,76,.45)}

.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  border:3px solid var(--ink);border-radius:18px;cursor:pointer;padding:13px 16px 15px;
  font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:20px;letter-spacing:.01em;
  text-transform:uppercase;color:#fff;
  background:linear-gradient(180deg,#6FC8FF,var(--blue));
  text-shadow:0 2px 0 rgba(20,34,76,.55);
  box-shadow:inset 0 4px 0 rgba(255,255,255,.45),inset 0 -6px 0 rgba(20,34,76,.28),
             0 6px 0 #0E5FA8,0 12px 14px -8px rgba(20,34,76,.5);
  transition:transform .09s cubic-bezier(.3,1.4,.5,1),box-shadow .09s ease}
.btn:active{transform:translateY(6px);
  box-shadow:inset 0 4px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(20,34,76,.25),0 0 0 #0E5FA8}
.btn:disabled{filter:saturate(.35) brightness(.9);opacity:.7;pointer-events:none}
.btn:focus-visible{outline:4px solid var(--lime);outline-offset:3px}
.btn.gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold));box-shadow:
  inset 0 4px 0 rgba(255,255,255,.55),inset 0 -6px 0 rgba(120,75,0,.28),
  0 6px 0 var(--gold-dk),0 12px 16px -8px rgba(165,106,4,.6)}
.btn.gold:active{box-shadow:inset 0 4px 0 rgba(255,255,255,.45),0 0 0 var(--gold-dk)}
.btn.steel{background:linear-gradient(180deg,#F3F7FF,#CFDDF2);color:var(--ink);
  text-shadow:none;box-shadow:inset 0 4px 0 #fff,inset 0 -6px 0 rgba(20,34,76,.14),
  0 6px 0 #8FA4C8,0 12px 14px -8px rgba(20,34,76,.4)}
.btn.steel:active{box-shadow:inset 0 4px 0 #fff,0 0 0 #8FA4C8}
.btn.danger{background:linear-gradient(180deg,#FF9090,var(--red));box-shadow:
  inset 0 4px 0 rgba(255,255,255,.45),inset 0 -6px 0 rgba(120,10,10,.3),
  0 6px 0 var(--red-dk),0 12px 14px -8px rgba(168,30,30,.5)}
.btn.danger:active{box-shadow:inset 0 4px 0 rgba(255,255,255,.4),0 0 0 var(--red-dk)}
.btn.sm{font-size:16px;padding:10px 12px 12px;border-radius:15px;border-width:3px}

.eyebrow{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:12px;letter-spacing:.10em;
  text-transform:uppercase;color:var(--gold-hi)}
.plate.cream .eyebrow,.sheet .eyebrow{color:#A5731A}

.field{width:100%;border:3px solid var(--ink);border-radius:16px;padding:12px 14px;
  text-align:center;background:#FFFDF6;color:var(--ink);
  font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:19px;
  box-shadow:inset 0 4px 0 rgba(20,34,76,.10)}
.field::placeholder{color:#A9B6D2}
.field:focus{outline:none;border-color:var(--gold);box-shadow:inset 0 4px 0 rgba(20,34,76,.10),0 0 0 4px rgba(245,183,30,.4)}
.field.up{text-transform:uppercase}
.field.low{text-transform:none;font-family:'Fredoka';font-weight:600;font-size:17px}
.hint{font-size:13px;line-height:1.45;color:#EAF3FF;text-align:center;font-weight:500}
.hint.err{color:#FFD9D9;text-shadow:0 1px 0 rgba(20,34,76,.5)}
.hint.ok{color:#DDFFB0;text-shadow:0 1px 0 rgba(20,34,76,.5)}

/* ============================================================
   ÉCRAN DE LANCEMENT
   ============================================================ */
#splash{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  background:linear-gradient(180deg,var(--sky-hi),var(--sky-dk));transition:opacity .45s ease}
#splash.off{opacity:0;pointer-events:none}
#splash .sp-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
#splash .sp-logo{width:min(88vw,430px);display:block;
  filter:drop-shadow(0 8px 0 rgba(20,34,76,.35)) drop-shadow(0 0 32px rgba(120,205,255,.7));
  animation:land .8s cubic-bezier(.2,1.5,.4,1)}
#splash .sp-hero{width:min(46vw,190px);border:4px solid var(--ink);border-radius:24px;
  box-shadow:0 8px 0 var(--royal-dk),0 20px 30px -12px rgba(20,34,76,.75);
  animation:land .8s .12s cubic-bezier(.2,1.5,.4,1) backwards}
#splash .load{margin-top:20px;font-family:'Baloo 2';font-weight:800;font-size:15px;
  color:#fff;text-shadow:var(--stroke);letter-spacing:.06em;animation:bob 1.4s ease-in-out infinite}
@keyframes land{0%{transform:scale(.6) translateY(-40px);opacity:0}
                70%{opacity:1}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* ============================================================
   PORTAIL — inscription et connexion
   ============================================================ */
#gate{position:fixed;inset:0;z-index:12;display:none;flex-direction:column;
  padding:calc(var(--safe-t) + 14px) 18px calc(var(--safe-b) + 16px)}
#gate.on{display:flex}
.gate-head{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:16px}
.logo-art{width:min(84vw,330px);display:block;
  filter:drop-shadow(0 6px 0 rgba(20,34,76,.30)) drop-shadow(0 0 22px rgba(120,205,255,.55))}
.dots{display:flex;gap:8px}
.dots i{width:36px;height:9px;border-radius:6px;background:rgba(20,34,76,.22);
  border:2px solid var(--ink);transition:background .3s}
.dots i.on{background:var(--gold);box-shadow:0 0 12px rgba(245,183,30,.9)}
.step{flex:1;display:none;flex-direction:column;gap:13px;overflow-y:auto;
  border:3px solid var(--ink);border-radius:22px;padding:17px 15px;
  background:linear-gradient(180deg,var(--royal-hi),var(--royal));
  box-shadow:inset 0 4px 0 rgba(255,255,255,.26),0 6px 0 var(--royal-dk),
             0 16px 20px -12px rgba(20,34,76,.6)}
.step.on{display:flex;animation:tab-in .3s cubic-bezier(.2,1.3,.4,1)}
.step h2{font-size:29px;color:#fff;text-shadow:var(--stroke),0 4px 0 rgba(20,34,76,.3);text-align:center}
.step .sub{font-size:14px;color:#fff;line-height:1.45;margin:-4px 0 2px;text-align:center;
  text-shadow:0 1px 2px rgba(20,34,76,.45)}
.gate-foot{display:flex;gap:10px;padding-top:12px}
.gate-foot .btn{flex:1}
.gate-foot .btn.back{flex:0 0 106px}

.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avpick{aspect-ratio:1;border:3px solid var(--ink);padding:0;cursor:pointer;border-radius:16px;
  overflow:hidden;background:#fff;box-shadow:0 4px 0 rgba(20,34,76,.35);
  transition:transform .12s cubic-bezier(.3,1.5,.5,1),box-shadow .15s}
.avpick.on{border-color:var(--gold);box-shadow:0 4px 0 var(--gold-dk),0 0 0 4px rgba(245,183,30,.5);
  transform:translateY(-3px) scale(1.05)}
.avpick svg,.avpick img{width:100%;height:100%;display:block;object-fit:cover}
.avbig{width:136px;height:136px;border:4px solid var(--ink);border-radius:26px;overflow:hidden;
  margin:0 auto;background:#fff;box-shadow:0 7px 0 var(--royal-dk)}
.avbig svg,.avbig img{width:100%;height:100%;display:block;object-fit:cover}

/* ============================================================
   COQUE
   ============================================================ */
#shell{position:fixed;inset:0;z-index:1;display:none;flex-direction:column}
#shell.on{display:flex}
#topbar{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 9px) 13px 11px;
  background:linear-gradient(180deg,var(--royal),var(--royal-dk));
  border-bottom:3px solid var(--ink);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.20),0 4px 12px rgba(20,34,76,.35)}
#tbAvatar{width:46px;height:46px;flex:0 0 46px;border:3px solid var(--ink);border-radius:14px;
  overflow:hidden;background:#fff;box-shadow:0 3px 0 rgba(20,34,76,.45)}
#tbAvatar svg,#tbAvatar img{width:100%;height:100%;display:block;object-fit:cover}
#topMini{width:34px;height:39px;flex:0 0 34px}
#topbar .who{flex:1;min-width:0}
#topbar .who .n{font-family:'Baloo 2';font-weight:800;font-size:18px;color:#fff;
  text-shadow:0 2px 0 rgba(20,34,76,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .who .r{font-size:12px;color:var(--gold-hi);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:flex;align-items:center;gap:6px;padding:5px 12px;border:3px solid var(--ink);
  border-radius:20px;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--ink);
  font-family:'Baloo 2';font-weight:800;font-size:15px;box-shadow:0 3px 0 var(--gold-dk)}
.chip .k{font-size:10px;letter-spacing:.06em;opacity:.72}

#tabs{flex:1;position:relative;overflow:hidden}
.tab{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 14px calc(var(--nav-h) + var(--safe-b) + 20px);display:none;flex-direction:column;gap:12px}
.tab.on{display:flex;animation:tab-in .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes tab-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

#navbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  background:linear-gradient(180deg,var(--royal),var(--royal-dk));border-top:3px solid var(--ink);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.18),0 -8px 20px rgba(20,34,76,.4)}
.navbtn{background:none;border:0;cursor:pointer;color:rgba(255,255,255,.62);
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;
  font-family:'Baloo 2';font-weight:800;font-size:12px;text-transform:uppercase;
  transition:color .18s,transform .12s}
.navbtn svg{width:26px;height:26px;fill:currentColor}
.navbtn.on{color:#fff;transform:translateY(-2px)}
.navbtn.on svg{fill:var(--gold-hi);filter:drop-shadow(0 2px 0 var(--gold-dk))}
.navbtn:focus-visible{outline:3px solid var(--gold-hi);outline-offset:-4px;border-radius:12px}
.navbtn.main{position:relative;top:-18px}
.navbtn.main .disc{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;
  border:4px solid var(--ink);color:var(--ink);
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  box-shadow:0 6px 0 var(--gold-dk),0 14px 18px -8px rgba(165,106,4,.7),inset 0 4px 0 rgba(255,255,255,.6)}
.navbtn.main .disc svg{width:32px;height:32px;fill:var(--ink)}
.navbtn.main.on{transform:none}
.navbtn.main.on .disc{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.navbtn.main span{margin-top:3px;color:#fff}

/* ============================================================
   ONGLET DUEL
   ============================================================ */
.hero{display:flex;flex-direction:column;align-items:center;gap:1px;padding:14px 14px 17px;overflow:hidden}
.hero::before{content:'';position:absolute;inset:-40% -30% auto;height:180%;
  background:repeating-conic-gradient(from 0deg at 50% 30%,
    rgba(255,255,255,.13) 0deg 9deg,transparent 9deg 22deg);pointer-events:none}
.hero>*{position:relative}
.hero .badge-xl{width:168px;height:192px;filter:drop-shadow(0 6px 0 rgba(20,34,76,.35))}
.hero .tiername{font-family:'Baloo 2';font-weight:800;font-size:31px;margin-top:5px;
  color:#fff;text-shadow:var(--stroke),0 4px 0 rgba(20,34,76,.35);text-transform:uppercase}
.hero .divname{font-size:14px;color:var(--gold-hi);font-weight:600}
.progress{width:100%;margin-top:13px}
.progress .rail{height:20px;border:3px solid var(--ink);border-radius:12px;overflow:hidden;
  background:rgba(20,34,76,.4);box-shadow:inset 0 3px 0 rgba(0,0,0,.25)}
.progress .fill{height:100%;width:0%;
  background:linear-gradient(180deg,var(--lime) 0%,var(--lime) 45%,var(--lime-dk) 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.45);
  transition:width .9s cubic-bezier(.2,1.2,.4,1)}
.progress .lbl{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;
  font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(20,34,76,.5)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ============================================================
   RANGS
   ============================================================ */
.ladder{display:flex;flex-direction:column;gap:9px}
.rung{display:flex;align-items:center;gap:12px;padding:9px 12px;border:3px solid var(--ink);
  border-radius:18px;background:linear-gradient(180deg,#FFFDF6,var(--cream));
  box-shadow:0 4px 0 var(--cream-dk)}
.rung.cur{background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  box-shadow:0 5px 0 var(--gold-dk),0 0 0 4px rgba(255,255,255,.5)}
.rung .b{width:48px;height:55px;flex:0 0 48px}
.rung .t{flex:1;min-width:0}
.rung .t .nm{font-family:'Baloo 2';font-weight:800;font-size:18px;color:var(--ink)}
.rung .t .rg{font-size:12px;color:#7C6A44;font-weight:600}
.rung .you{font-family:'Baloo 2';font-weight:800;font-size:12px;color:#fff;background:var(--ink);
  padding:3px 10px;border-radius:20px}
.divrow{display:flex;gap:6px;margin-top:7px}
.divrow i{width:30px;height:9px;border-radius:6px;background:rgba(20,34,76,.25);border:2px solid var(--ink)}
.divrow i.on{background:var(--gold);box-shadow:0 0 10px rgba(245,183,30,.9)}

/* ============================================================
   PROFIL / DRILLS / HISTORIQUE
   ============================================================ */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.kpi{padding:11px 6px;text-align:center;border:3px solid var(--ink);border-radius:16px;
  background:linear-gradient(180deg,#FFFDF6,var(--cream));box-shadow:0 4px 0 var(--cream-dk)}
.kpi .v{font-family:'Baloo 2';font-weight:800;font-size:25px;color:var(--ink);line-height:1.1}
.kpi .k{font-size:11px;color:#7C6A44;font-weight:600;margin-top:1px}
.idrow{display:flex;gap:13px;align-items:center}
.idrow .pic{width:78px;height:78px;flex:0 0 78px;border:3px solid var(--ink);border-radius:20px;
  overflow:hidden;background:#fff;box-shadow:0 4px 0 rgba(20,34,76,.4)}
.idrow .pic svg,.idrow .pic img{width:100%;height:100%;display:block;object-fit:cover}
.rule{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-top:2px dashed rgba(20,34,76,.18)}
.rule:first-of-type{border-top:0}
.rule .num{font-family:'Baloo 2';font-weight:800;font-size:15px;color:#fff;flex:0 0 30px;
  height:30px;display:grid;place-items:center;background:var(--gold);border:2px solid var(--ink);
  border-radius:50%;text-shadow:0 1px 0 rgba(20,34,76,.5)}
.rule p{margin:0;font-size:14px;line-height:1.45;color:var(--ink)}
.rule b{font-weight:600;color:#A5731A}
.hrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:2px dashed rgba(20,34,76,.18)}
.hrow:first-child{border-top:0}
.hrow .res{width:36px;height:36px;flex:0 0 36px;border:3px solid var(--ink);border-radius:11px;
  display:grid;place-items:center;font-family:'Baloo 2';font-weight:800;font-size:16px;color:#fff}
.hrow .res.w{background:var(--lime);box-shadow:0 3px 0 var(--lime-dk)}
.hrow .res.l{background:var(--red);box-shadow:0 3px 0 var(--red-dk)}
.hrow .res.d{background:#A9B6D2;box-shadow:0 3px 0 #6B7BA8}
.hrow .mid{flex:1;min-width:0}
.hrow .mid .a{font-family:'Baloo 2';font-weight:800;font-size:16px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .mid .b{font-size:12px;color:#7C6A44;font-weight:600}
.hrow .sc{font-family:'Baloo 2';font-weight:800;font-size:17px;color:var(--ink)}
.hrow .dl{font-family:'Baloo 2';font-weight:800;font-size:14px;width:46px;text-align:right}
.dl.up{color:var(--lime-dk)}.dl.down{color:var(--red-dk)}.dl.flat{color:#8B96AD}
.empty{text-align:center;color:#7C6A44;font-size:14px;padding:22px 10px;line-height:1.55;font-weight:500}
/* Sur le ciel, les libellés repassent en navy : l'or ne tient pas sur fond clair */
.tab>.eyebrow,#gate .eyebrow,#result>.eyebrow{color:var(--ink)}
.tab>.empty{color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.4)}

/* ============================================================
   VUES PLEIN ÉCRAN
   ============================================================ */
.view{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;
  padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px)}
.view.on{display:flex;animation:tab-in .3s cubic-bezier(.2,1.3,.4,1)}

/* ---- recherche ---- */
#search{align-items:center;justify-content:center;gap:16px;text-align:center;
  background:linear-gradient(180deg,var(--sky-hi),var(--sky-dk))}
.scan{position:relative;width:236px;height:236px;display:grid;place-items:center}
.scan i{position:absolute;inset:0;border:4px solid rgba(255,255,255,.65);border-radius:50%;
  animation:ping 2.8s cubic-bezier(.2,.7,.3,1) infinite}
.scan i:nth-child(2){animation-delay:.9s}
.scan i:nth-child(3){animation-delay:1.8s}
@keyframes ping{0%{transform:scale(.28);opacity:1}100%{transform:scale(1);opacity:0}}
.scan svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.scan .track{fill:none;stroke:rgba(20,34,76,.28);stroke-width:12}
.scan .arc{fill:none;stroke:var(--gold);stroke-width:12;stroke-linecap:round;
  filter:drop-shadow(0 2px 0 var(--gold-dk));transition:stroke-dashoffset .25s linear}
.scan .core{display:flex;flex-direction:column;align-items:center;gap:0}
.scan .core .t{font-family:'Baloo 2';font-weight:800;font-size:16px;color:#fff;text-shadow:var(--stroke)}
.scan .core .c{font-family:'Baloo 2';font-weight:800;font-size:46px;color:#fff;
  text-shadow:var(--stroke),0 4px 0 rgba(20,34,76,.35);line-height:1}
.scan .core .s{font-size:12px;color:var(--ink);font-weight:600}
#searchMascot{width:150px;height:auto;border:4px solid var(--ink);border-radius:22px;
  box-shadow:0 7px 0 var(--royal-dk);animation:bob 2.2s ease-in-out infinite}
#searchLog{font-size:14px;color:#fff;font-weight:600;min-height:21px;
  text-shadow:0 2px 2px rgba(20,34,76,.55)}

/* ---- arène ---- */
#arena{padding:0;background:#0B1836}
#stage{position:absolute;inset:0;overflow:hidden}
#cam,#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cam{background:#0B1836}
.mirror{transform:scaleX(-1)}
.duel{position:absolute;top:calc(var(--safe-t) + 9px);left:9px;right:9px;z-index:3}
.duel .heads{display:flex;align-items:center;gap:8px}
.head{flex:1;display:flex;align-items:center;gap:8px;padding:6px 9px;border:3px solid var(--ink);
  border-radius:16px;background:linear-gradient(180deg,var(--royal-hi),var(--royal));
  box-shadow:inset 0 3px 0 rgba(255,255,255,.28),0 4px 0 var(--royal-dk)}
.head.op{flex-direction:row-reverse;text-align:right;
  background:linear-gradient(180deg,#FFB160,var(--orange));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 #A34C00}
.head .av{width:36px;height:36px;flex:0 0 36px;border:2px solid var(--ink);border-radius:11px;
  overflow:hidden;background:#fff}
.head .av svg,.head .av img{width:100%;height:100%;display:block;object-fit:cover}
.head .nm{flex:1;font-family:'Baloo 2';font-weight:800;font-size:14px;color:#fff;
  text-shadow:0 2px 0 rgba(20,34,76,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .sc{font-family:'Baloo 2';font-weight:800;font-size:29px;line-height:1;color:#fff;
  text-shadow:var(--stroke)}
.duel .bar{position:relative;height:18px;margin-top:7px;border:3px solid var(--ink);
  border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#FFB160,var(--orange));
  box-shadow:inset 0 3px 0 rgba(255,255,255,.3)}
.duel .bar>span{position:absolute;inset:0 auto 0 0;width:50%;
  background:linear-gradient(180deg,#6FC8FF,var(--blue));
  border-right:3px solid var(--ink);box-shadow:inset 0 3px 0 rgba(255,255,255,.4);
  transition:width .35s cubic-bezier(.2,1.2,.4,1)}
.clock{position:absolute;top:calc(var(--safe-t) + 112px);left:0;right:0;z-index:3;text-align:center;
  font-family:'Baloo 2';font-weight:800;font-size:52px;color:#fff;
  font-variant-numeric:tabular-nums;text-shadow:var(--stroke),0 5px 0 rgba(20,34,76,.4)}
.clock.low{color:#FFD1D1;animation:tick 1s steps(2) infinite}
@keyframes tick{50%{opacity:.45}}
.viewtag{position:absolute;top:calc(var(--safe-t) + 168px);left:0;right:0;z-index:3;text-align:center;
  font-size:12px;font-weight:600;color:#fff;text-shadow:0 2px 3px rgba(20,34,76,.8)}
.viewtag b{color:var(--gold-hi);font-weight:600}
.viewtag.calib b{color:#FFE9A8}
.depth{position:absolute;right:11px;top:50%;transform:translateY(-50%);z-index:3;width:22px;height:38vh;
  border:3px solid var(--ink);border-radius:14px;background:rgba(20,34,76,.55);overflow:hidden;
  box-shadow:inset 0 3px 0 rgba(0,0,0,.3)}
.depth>span{position:absolute;left:0;right:0;bottom:0;height:0%;
  background:linear-gradient(180deg,#8FD6FF,var(--blue));
  box-shadow:inset 0 3px 0 rgba(255,255,255,.45);transition:height .08s linear,background .2s}
.depth.hit>span{background:linear-gradient(180deg,#C4FF8F,var(--lime))}
.depth.bad>span{background:linear-gradient(180deg,#FFA0A0,var(--red))}
.depth::after{content:'';position:absolute;left:-4px;right:-4px;bottom:32%;height:5px;
  background:var(--gold);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.formmsg{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 100px);z-index:3;text-align:center;
  font-family:'Baloo 2';font-weight:800;font-size:19px;text-transform:uppercase;color:#fff;
  text-shadow:var(--stroke),0 3px 0 rgba(20,34,76,.35);transition:color .2s}
.formmsg.bad{color:#FFC2C2}.formmsg.ok{color:#D8FFA8}
#flash{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;background:var(--blue);
  mix-blend-mode:screen}
@keyframes fl{from{opacity:.32}to{opacity:0}}
/* Signature : la sueur gicle du compteur à chaque pompe validée */
#drops{position:absolute;left:0;right:0;top:38%;height:1px;z-index:4;pointer-events:none}
.drop{position:absolute;left:22%;top:0;width:14px;height:14px;background:var(--sweat);
  border:2px solid var(--ink);border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  animation:splash .75s cubic-bezier(.25,.9,.4,1) forwards}
@keyframes splash{
  0%{opacity:1;transform:translate(0,0) rotate(-45deg) scale(.5)}
  60%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(-45deg) scale(1.05)}}
.arena-actions{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-b) + 12px);z-index:4;
  display:flex;gap:10px}
.icon-btn{flex:0 0 58px;height:58px;border:3px solid var(--ink);cursor:pointer;border-radius:18px;
  background:linear-gradient(180deg,#F3F7FF,#CFDDF2);color:var(--ink);font-size:22px;
  box-shadow:inset 0 4px 0 #fff,0 6px 0 #8FA4C8}
.icon-btn:active{transform:translateY(6px);box-shadow:inset 0 4px 0 #fff,0 0 0 #8FA4C8}
#countdown{position:absolute;inset:0;z-index:6;display:none;place-items:center;text-align:center;
  background:rgba(11,24,54,.78);backdrop-filter:blur(3px)}
#countdown.on{display:grid}
#cdNum{font-family:'Baloo 2';font-weight:800;font-size:29vw;line-height:.95;color:var(--gold);
  text-shadow:var(--stroke),0 8px 0 rgba(20,34,76,.5)}
#cdNum.pop{animation:pop .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}55%{opacity:1}to{transform:scale(1);opacity:1}}
#cdHint{font-size:15px;color:#fff;margin-top:14px;padding:0 26px;line-height:1.45;font-weight:600;
  text-shadow:0 2px 3px rgba(0,0,0,.6)}
#cdCal{margin-top:10px;font-family:'Baloo 2';font-weight:800;font-size:14px;color:var(--gold-hi)}

/* ---- résultat ---- */
#result{align-items:center;justify-content:center;gap:14px;text-align:center;
  background:linear-gradient(180deg,var(--sky-hi),var(--sky-dk))}
.verdict{font-family:'Baloo 2';font-weight:800;font-size:50px;color:#fff;
  text-shadow:var(--stroke),0 6px 0 rgba(20,34,76,.4)}
.verdict.win{color:var(--lime)}
.verdict.loss{color:var(--orange)}
.verdict.draw{color:#DCE6F5}
.scoreline{display:flex;align-items:center;justify-content:center;gap:16px;
  font-family:'Baloo 2';font-weight:800;font-size:58px;color:#fff}
.scoreline .s1{color:var(--blue);text-shadow:var(--stroke)}
.scoreline .s2{color:var(--orange);text-shadow:var(--stroke)}
.delta{font-family:'Baloo 2';font-weight:800;font-size:28px}
.delta.up{color:var(--lime)}.delta.down{color:#FFB4B4}.delta.flat{color:#DCE6F5}
#resBadge{filter:drop-shadow(0 5px 0 rgba(20,34,76,.35))}

/* ============================================================
   FEUILLES ET NOTIFICATIONS
   ============================================================ */
.sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;
  background:rgba(11,24,54,.55);backdrop-filter:blur(3px)}
.sheet.on{display:flex;animation:tab-in .22s}
.sheet .inner{width:100%;padding:20px 16px calc(var(--safe-b) + 20px);border-radius:26px 26px 0 0;
  background:linear-gradient(180deg,#FFFDF6,var(--cream));border:3px solid var(--ink);border-bottom:0;
  display:flex;flex-direction:column;gap:12px;max-height:86vh;overflow-y:auto;color:var(--ink)}
.sheet h3{font-size:23px;text-align:center;color:var(--ink)}
.sheet p{margin:0;font-size:14px;line-height:1.5;color:#4A5678;font-weight:500}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + var(--nav-h) + 16px);transform:translateX(-50%);
  z-index:30;padding:11px 18px;border:3px solid var(--ink);border-radius:18px;font-size:14px;
  font-weight:600;text-align:center;color:var(--ink);
  background:linear-gradient(180deg,#FFFDF6,var(--cream));box-shadow:0 5px 0 var(--cream-dk);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:88vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}
@media (max-height:690px){
  .hero .badge-xl{width:132px;height:151px}
  .hero .tiername{font-size:26px}
  .logo-art{width:min(52vw,210px)}
}


/* ============================================================ */
/* ============================================================
   FAÇADE DE MENU — architecture inspirée des grands jeux mobiles :
   ressources en haut, carte de profil, piste de saison, scène
   centrale, deux boutons de lancement, navigation basse.
   Tous les visuels sont dessinés dans l'univers du logo.
   ============================================================ */

/* ---------- Fond d'arène : profondeur, faisceaux, poussières ---------- */
#bg{background:
  /* halo de projecteur au-dessus de l'arène */
  radial-gradient(58vw 34vh at 50% 20%, rgba(160,225,255,.38), transparent 66%),
  /* collines lointaines, deux plans */
  radial-gradient(75vw 22vh at 12% 62%, #17507F 0 99%, transparent 100%),
  radial-gradient(85vw 26vh at 88% 66%, #12406B 0 99%, transparent 100%),
  /* eau et vignettage */
  radial-gradient(120vw 46vh at 50% 112%, rgba(6,16,40,.95), transparent 74%),
  linear-gradient(180deg,#1B5FA0 0%,#17508A 30%,#0F3163 62%,#0A1D40 100%)}
#bg::before{content:'';position:absolute;inset:-20% -30% auto;height:110%;left:-30%;right:-30%;
  width:auto;border-radius:0;background:repeating-conic-gradient(from 196deg at 50% -14%,
    rgba(190,235,255,.09) 0deg 3deg, transparent 3deg 13deg);
  box-shadow:none;opacity:.9;animation:none;
  mask-image:linear-gradient(#000 6%,transparent 62%);
  -webkit-mask-image:linear-gradient(#000 6%,transparent 62%)}
#bg::after{content:'';position:absolute;left:0;right:0;bottom:0;height:100%;transform:none;
  background:
    radial-gradient(2px 2px at 14% 30%, rgba(255,255,255,.55), transparent),
    radial-gradient(2px 2px at 72% 18%, rgba(255,255,255,.40), transparent),
    radial-gradient(3px 3px at 38% 62%, rgba(255,255,255,.30), transparent),
    radial-gradient(2px 2px at 88% 54%, rgba(255,255,255,.45), transparent),
    radial-gradient(2px 2px at 26% 82%, rgba(255,255,255,.30), transparent),
    radial-gradient(60vw 40vh at 50% 100%, rgba(0,0,0,.45), transparent 70%);
  mask-image:none;-webkit-mask-image:none;
  animation:motes 14s ease-in-out infinite alternate}
@keyframes motes{to{transform:translateY(-16px)}}

/* ---------- Barre de ressources ---------- */
#topbar{gap:8px;padding:calc(var(--safe-t) + 8px) 11px 10px;
  background:linear-gradient(180deg,rgba(9,22,50,.96),rgba(9,22,50,.72));
  border-bottom:3px solid var(--ink)}
.res{display:flex;align-items:center;gap:7px;height:34px;padding:0 11px 0 4px;
  border:3px solid var(--ink);border-radius:20px;
  background:linear-gradient(180deg,#2C4A8E,#1B3168);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.22),0 3px 0 rgba(9,18,42,.9)}
.res .v{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:16px;color:#fff;
  text-shadow:0 2px 0 rgba(20,34,76,.7);font-variant-numeric:tabular-nums}
.res svg{width:26px;height:26px;flex:0 0 26px;display:block}
.res.grow{flex:1;min-width:0;padding-right:8px}
/* niveau : pastille dorée + jauge d'expérience */
.lvlbadge{width:30px;height:30px;flex:0 0 30px;border:3px solid var(--ink);border-radius:50%;
  display:grid;place-items:center;background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:14px;color:var(--ink);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.6)}
.xp{flex:1;min-width:34px;height:11px;border:2px solid var(--ink);border-radius:7px;overflow:hidden;
  background:rgba(9,18,42,.75)}
.xp i{display:block;height:100%;width:0%;border-radius:5px;
  background:linear-gradient(180deg,#9BE6FF,#2FA8FF);box-shadow:inset 0 2px 0 rgba(255,255,255,.5);
  transition:width .6s cubic-bezier(.2,1.2,.4,1)}

/* ---------- Carte de profil ---------- */
.profcard{display:flex;align-items:center;gap:11px;padding:10px 12px}
.profcard .pc-av{width:52px;height:52px;flex:0 0 52px;border:3px solid var(--ink);border-radius:15px;
  overflow:hidden;background:#fff;box-shadow:0 3px 0 rgba(9,18,42,.7)}
.profcard .pc-av svg,.profcard .pc-av img{width:100%;height:100%;display:block;object-fit:cover}
.profcard .pc-txt{flex:1;min-width:0}
.profcard .pc-name{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:19px;color:#fff;
  text-shadow:0 2px 0 rgba(20,34,76,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profcard .pc-rank{font-size:12px;font-weight:600;color:var(--gold-hi);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profcard .pc-badge{width:34px;height:39px;flex:0 0 34px}
.profcard .pc-elo{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 5px;
  border:3px solid var(--ink);border-radius:16px;background:rgba(9,18,42,.55)}
.profcard .pc-elo svg{width:20px;height:20px}
.profcard .pc-elo span{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:15px;color:#fff}

/* ---------- Piste de saison ---------- */
.passrow{display:flex;gap:9px;align-items:stretch}
.daily{flex:0 0 78px;border:3px solid var(--ink);border-radius:18px;padding:6px 5px 7px;cursor:pointer;
  background:linear-gradient(180deg,#3E63C4,#22397C);color:#fff;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.22),0 5px 0 var(--royal-dk);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;
  transition:transform .09s cubic-bezier(.3,1.4,.5,1),box-shadow .09s}
.daily:active{transform:translateY(5px);box-shadow:inset 0 3px 0 rgba(255,255,255,.2),0 0 0 var(--royal-dk)}
.daily.done{background:linear-gradient(180deg,#A0E85C,#5FA518);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 5px 0 var(--lime-dk)}
.daily svg{width:30px;height:30px}
.daily .lab{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:11px;
  text-transform:uppercase;text-shadow:0 1px 0 rgba(20,34,76,.6)}
.daily .mini{width:100%;height:8px;border:2px solid var(--ink);border-radius:6px;overflow:hidden;
  background:rgba(9,18,42,.7)}
.daily .mini i{display:block;height:100%;width:0%;background:var(--gold);transition:width .6s}

.passbar{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:8px 9px;
  border:3px solid var(--ink);border-radius:18px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#3E63C4,#22397C);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.22),0 5px 0 var(--royal-dk)}
.passbar::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 10px,transparent 10px 24px)}
.passbar>*{position:relative}
.pass-left{flex:1;min-width:0}
.pass-ttl{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:12px;color:var(--gold-hi);
  text-transform:uppercase;line-height:1.1}
.pass-track{height:16px;margin-top:4px;border:2px solid var(--ink);border-radius:9px;overflow:hidden;
  background:rgba(9,18,42,.75);position:relative}
.pass-track i{display:block;height:100%;width:0%;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5);transition:width .7s cubic-bezier(.2,1.2,.4,1)}
.pass-track b{position:absolute;inset:0;display:grid;place-items:center;
  font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:11px;color:#fff;
  text-shadow:var(--stroke)}
.pass-tier{width:38px;height:38px;flex:0 0 38px;border:3px solid var(--ink);border-radius:11px;
  display:grid;place-items:center;background:linear-gradient(180deg,#8FD0FF,#2F7FD0);
  font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:17px;color:#fff;
  text-shadow:0 2px 0 rgba(20,34,76,.6);box-shadow:inset 0 3px 0 rgba(255,255,255,.4)}
.pass-cta{flex:0 0 62px;border:3px solid var(--ink);border-radius:14px;cursor:pointer;padding:6px 4px;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--ink);
  font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:12px;line-height:1.05;
  text-transform:uppercase;box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 4px 0 var(--gold-dk);
  transition:transform .09s cubic-bezier(.3,1.4,.5,1),box-shadow .09s}
.pass-cta:active{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 0 0 var(--gold-dk)}

/* ---------- Scène centrale : podium et blason ---------- */
.stage{position:relative;flex:1;min-height:210px;display:grid;place-items:center;margin:2px 0}
.stage svg.podium{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:min(94%,340px);height:auto;filter:drop-shadow(0 14px 18px rgba(6,14,34,.6))}
.stage .halo{position:absolute;top:6%;left:50%;transform:translateX(-50%);width:74%;height:74%;
  border-radius:50%;background:radial-gradient(closest-side,rgba(150,220,255,.42),transparent 72%);
  pointer-events:none}
.stage .crest{position:relative;width:152px;height:174px;margin-bottom:44px;
  filter:drop-shadow(0 8px 0 rgba(9,18,42,.45));animation:hover 4.2s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.stage .caption{position:absolute;bottom:12px;left:0;right:0;text-align:center}
.stage .caption .t{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:23px;color:#fff;
  text-shadow:var(--stroke),0 4px 0 rgba(20,34,76,.45);text-transform:uppercase}
.stage .caption .d{font-size:13px;font-weight:600;color:var(--gold-hi);
  text-shadow:0 2px 3px rgba(9,18,42,.8)}

/* ---------- Boutons de lancement ---------- */
.launch{display:grid;grid-template-columns:1.35fr 1fr;gap:11px}
.launch .btn{font-size:23px;padding:16px 10px 19px;border-radius:20px;border-width:4px;flex-direction:column;gap:0}
.launch .btn small{display:block;font-family:'Fredoka';font-weight:500;font-size:11px;
  text-transform:none;opacity:.85;margin-top:1px;text-shadow:none}

/* ---------- Navigation basse ---------- */
#navbar{background:linear-gradient(180deg,#1B3168,#0C1C42)}
.navbtn{position:relative}
.navbtn.on::before{content:'';position:absolute;inset:2px 6px;border-radius:14px;
  background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.navbtn.main.on::before{display:none}
.navbtn>*{position:relative}

/* ---------- Feuille de la saison ---------- */
.tierlist{display:flex;flex-direction:column;gap:7px;max-height:44vh;overflow-y:auto;padding-right:2px}
.tier{display:flex;align-items:center;gap:10px;padding:8px 10px;border:3px solid var(--ink);
  border-radius:14px;background:#FFFDF6;box-shadow:0 3px 0 var(--cream-dk)}
.tier.got{background:linear-gradient(180deg,#D6F5AE,#AEE882);box-shadow:0 3px 0 var(--lime-dk)}
.tier .n{width:30px;height:30px;flex:0 0 30px;border:2px solid var(--ink);border-radius:9px;
  display:grid;place-items:center;background:var(--royal);color:#fff;
  font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:14px}
.tier.got .n{background:var(--lime-dk)}
.tier .r{flex:1;font-size:14px;font-weight:600;color:var(--ink)}
.tier .s{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:12px;color:#7C6A44}

/* ============================================================
   ARÈNE — bandeau unique en haut, compteur géant au centre,
   pastille d'abandon pleine largeur en bas.
   ============================================================ */
.hud{position:absolute;top:calc(var(--safe-t) + 10px);left:10px;right:10px;z-index:3;
  padding:9px 11px 11px;border:3px solid var(--ink);border-radius:24px;
  background:rgba(11,24,54,.72);backdrop-filter:blur(7px);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.14),0 6px 18px rgba(6,14,34,.5)}
.hud-row{display:flex;align-items:center;gap:6px}
.fighter{flex:0 0 62px;display:flex;flex-direction:column;align-items:center;gap:3px}
.fav{width:50px;height:50px;border:3px solid var(--ink);border-radius:50%;overflow:hidden;background:#fff}
.fav.me{box-shadow:0 0 0 3px #6BE84A}
.fav.op{box-shadow:0 0 0 3px #FF5FA8}
.fav svg,.fav img{width:100%;height:100%;display:block;object-fit:cover}
.fname{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:12px;color:#fff;
  max-width:62px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;
  text-shadow:0 2px 0 rgba(20,34,76,.8)}
.fsc{flex:1;text-align:center;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;
  font-size:36px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:var(--stroke)}
.fsc.me{color:#8CFF5A}
.fsc.op{color:#FF5FA8}
.htime{flex:0 0 80px;text-align:center}
.htime .tl{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:11px;
  color:#A8C4E8;text-transform:uppercase;letter-spacing:.06em}
.htime .tv{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:28px;color:#fff;
  line-height:1.05;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(20,34,76,.8)}
.htime .tv.low{color:#FF9A9A;animation:tick 1s steps(2) infinite}
.hud-bar{position:relative;height:22px;margin-top:9px;border:3px solid var(--ink);
  border-radius:13px;overflow:hidden;background:linear-gradient(180deg,#FF7FBC,#D9327E);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.32)}
.hud-bar>span{position:absolute;inset:0 auto 0 0;width:50%;
  background:linear-gradient(180deg,#B4FF7A,#5FD41C);border-right:3px solid var(--ink);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.45);
  transition:width .35s cubic-bezier(.2,1.2,.4,1)}

/* Compteur central */
.counter{position:absolute;left:0;right:0;top:45%;transform:translateY(-50%);z-index:3;
  text-align:center;pointer-events:none}
.counter .clab{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:15px;
  letter-spacing:.34em;color:#fff;text-transform:uppercase;opacity:.92;
  text-shadow:0 2px 6px rgba(6,14,34,.9)}
.counter .cnum{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:33vw;
  line-height:.92;color:#fff;font-variant-numeric:tabular-nums;
  text-shadow:-4px -4px 0 var(--ink),4px -4px 0 var(--ink),-4px 4px 0 var(--ink),4px 4px 0 var(--ink),
               0 -5px 0 var(--ink),0 5px 0 var(--ink),-5px 0 0 var(--ink),5px 0 0 var(--ink),
               -3px -5px 0 var(--ink),3px -5px 0 var(--ink),0 10px 0 rgba(20,34,76,.35)}
.counter .cnum.tick{animation:count .34s cubic-bezier(.2,1.7,.4,1)}
@keyframes count{0%{transform:scale(1)}42%{transform:scale(1.22)}100%{transform:scale(1)}}
.counter .formmsg{position:static;bottom:auto;margin-top:6px;font-size:17px}

/* Jauge de profondeur et étiquette de suivi */
.depth{right:10px;width:20px;height:30vh}
.viewtag{top:auto;bottom:calc(var(--safe-b) + 90px)}

/* Abandon en pastille pleine largeur */
.arena-actions{gap:9px;align-items:center}
.giveup{flex:1;border-radius:34px;font-size:21px;padding:14px 16px 17px}
.giveup svg{width:22px;height:22px;flex:0 0 22px}
.icon-btn{flex:0 0 54px;height:54px;border-radius:50%;font-size:21px}

/* ---------- Gains de fin de duel ---------- */
.gains{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.gain{display:flex;align-items:center;gap:6px;padding:6px 13px;border:3px solid var(--ink);
  border-radius:16px;background:linear-gradient(180deg,#FFFDF6,var(--cream));
  box-shadow:0 4px 0 var(--cream-dk);color:var(--ink);
  font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:16px;
  animation:pop .5s cubic-bezier(.2,1.6,.4,1) backwards}
.gain:nth-child(2){animation-delay:.10s}
.gain:nth-child(3){animation-delay:.20s}
.gain svg{width:21px;height:21px;flex:0 0 21px}

/* ---------- Reprises de contraste : le fond est redevenu sombre ---------- */
.tab>.eyebrow{color:var(--gold-hi)}
.tab>.empty{color:#DCE9FF;text-shadow:0 2px 3px rgba(9,18,42,.7)}


/* ============================================================ */
/* ============================================================
   PASSE DE COMBAT — piste verticale
   ============================================================ */
#pass,#deck{background:
  radial-gradient(60vw 34vh at 50% 0%, rgba(120,205,255,.28), transparent 66%),
  linear-gradient(180deg,#123A6B 0%,#12365F 50%,#0B1E42 100%);
  padding:calc(var(--safe-t) + 12px) 12px calc(var(--safe-b) + 12px);gap:10px}
.pass-head{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.pass-head .icon-btn{flex:0 0 46px;height:46px;font-size:22px}
.ph-txt{flex:1;min-width:0}
.ph-t{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:22px;color:#fff;
  text-shadow:var(--stroke)}
.ph-s{font-size:12px;font-weight:600;color:var(--gold-hi)}
.ph-tier{width:48px;height:48px;flex:0 0 48px;border:3px solid var(--ink);border-radius:14px;
  display:grid;place-items:center;background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:21px;color:var(--ink);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 4px 0 var(--gold-dk)}

.pass-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;
  padding:6px 2px 10px;display:flex;flex-direction:column-reverse;gap:0}
/* rail vertical qui relie les paliers */
.prow{position:relative;display:flex;align-items:center;gap:12px;padding:7px 4px;min-height:76px}
.prow::before{content:'';position:absolute;left:35px;top:0;bottom:0;width:8px;
  background:rgba(9,18,42,.75);border-left:3px solid var(--ink);border-right:3px solid var(--ink)}
.prow.got::before{background:linear-gradient(180deg,var(--gold-hi),var(--gold))}
.prow:first-child::before{bottom:50%}
.prow:last-child::before{top:50%}
.pnum{position:relative;width:46px;height:46px;flex:0 0 46px;border:3px solid var(--ink);
  border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(180deg,#3E63C4,#22397C);color:#fff;
  font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:18px;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.28),0 3px 0 rgba(9,18,42,.8)}
.prow.got .pnum{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--ink)}
.prow.next .pnum{animation:pulse 1.8s ease-in-out infinite;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 0 0 4px rgba(255,223,128,.5)}
.pcard{position:relative;flex:1;display:flex;align-items:center;gap:11px;padding:9px 12px;
  border:3px solid var(--ink);border-radius:18px;
  background:linear-gradient(180deg,#FFFDF6,var(--cream));box-shadow:0 4px 0 var(--cream-dk)}
.prow.got .pcard{background:linear-gradient(180deg,#D6F5AE,#AEE882);box-shadow:0 4px 0 var(--lime-dk)}
.prow.lock .pcard{filter:saturate(.5) brightness(.86)}
.pcard .pico{width:46px;height:46px;flex:0 0 46px;border:3px solid var(--ink);border-radius:13px;
  display:grid;place-items:center;font-size:24px;background:#fff}
.pcard .ptxt{flex:1;min-width:0}
.pcard .pt{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:17px;color:var(--ink);
  line-height:1.1}
.pcard .ps{font-size:12px;font-weight:600;color:#7C6A44}
.pcard .pchk{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:12px;
  color:#fff;background:var(--lime-dk);border:2px solid var(--ink);border-radius:20px;padding:2px 9px}

.pass-foot{flex:0 0 auto;text-align:center}
.pf-bar{position:relative;height:22px;border:3px solid var(--ink);border-radius:13px;overflow:hidden;
  background:rgba(9,18,42,.75)}
.pf-bar i{display:block;height:100%;width:0%;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  box-shadow:inset 0 3px 0 rgba(255,255,255,.5);transition:width .7s cubic-bezier(.2,1.2,.4,1)}
.pf-bar b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;
  font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:13px;text-shadow:var(--stroke)}
.pf-lab{font-size:12px;font-weight:600;color:#BFD6F5;margin-top:5px}

/* ============================================================
   STICKERS — vignette, rareté, deck
   ============================================================ */
.stk{position:relative;aspect-ratio:1;border:3px solid var(--ink);border-radius:16px;cursor:pointer;
  display:grid;place-items:center;font-size:clamp(20px,7vw,30px);padding:0;
  background:linear-gradient(180deg,#FFFDF6,var(--cream));
  box-shadow:0 4px 0 var(--cream-dk);transition:transform .12s cubic-bezier(.3,1.5,.5,1)}
.stk:active{transform:translateY(4px) scale(.97)}
.stk[data-r="commun"]    {box-shadow:0 4px 0 #54688A, inset 0 0 0 3px #A8C0E0}
.stk[data-r="rare"]      {box-shadow:0 4px 0 #0E5FA8, inset 0 0 0 3px #4FC3FF}
.stk[data-r="epique"]    {box-shadow:0 4px 0 #5B2A9E, inset 0 0 0 3px #C58AFF}
.stk[data-r="legendaire"]{box-shadow:0 4px 0 #A56A04, inset 0 0 0 3px #FFD166,0 0 18px rgba(255,209,102,.6)}
.stk.off{filter:grayscale(1) brightness(.62);cursor:default}
.stk .rlab{position:absolute;bottom:-2px;left:0;right:0;font-family:'Baloo 2',system-ui,sans-serif;
  font-weight:800;font-size:8px;text-transform:uppercase;color:#fff;text-shadow:var(--stroke)}
.stk.eq::after{content:'✓';position:absolute;top:-6px;right:-6px;width:20px;height:20px;
  border:2px solid var(--ink);border-radius:50%;background:var(--lime);color:var(--ink);
  font-size:12px;font-weight:800;display:grid;place-items:center}

.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:9px}
.slot{aspect-ratio:1;border:3px dashed rgba(255,255,255,.35);border-radius:14px;cursor:pointer;
  display:grid;place-items:center;font-size:clamp(17px,5.4vw,24px);background:rgba(9,18,42,.4);
  color:rgba(255,255,255,.4);padding:0}
.slot.full{border-style:solid;border-color:var(--ink);background:linear-gradient(180deg,#FFFDF6,var(--cream))}
.invgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;overflow-y:auto;
  -webkit-overflow-scrolling:touch;padding:3px 2px 6px;flex:1}

/* Stickers envoyés pendant le duel */
.stkbar{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-b) + 78px);z-index:5;
  display:none;grid-template-columns:repeat(6,1fr);gap:7px;padding:9px;
  border:3px solid var(--ink);border-radius:20px;background:rgba(11,24,54,.9);backdrop-filter:blur(6px)}
.stkbar.on{display:grid;animation:tab-in .2s cubic-bezier(.2,1.3,.4,1)}
#stkFly{position:absolute;inset:0;z-index:6;pointer-events:none}
.fly{position:absolute;font-size:64px;filter:drop-shadow(0 5px 0 rgba(20,34,76,.5));
  animation:flyup 1.9s cubic-bezier(.2,.9,.4,1) forwards}
@keyframes flyup{
  0%{opacity:0;transform:translateY(30px) scale(.4)}
  18%{opacity:1;transform:translateY(0) scale(1.15)}
  30%{transform:translateY(0) scale(1)}
  80%{opacity:1;transform:translateY(-14px) scale(1)}
  100%{opacity:0;transform:translateY(-40px) scale(.85)}}

/* ============================================================
   FLAMME, GRAPHIQUE, STYLE DE PSEUDO
   ============================================================ */
.flame{display:inline-flex;align-items:center;gap:5px;padding:3px 12px 4px 8px;
  border:3px solid var(--ink);border-radius:20px;margin-bottom:5px;
  background:linear-gradient(180deg,#FFAE4D,#F2620E);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 4px 0 #8A3200}
.flame svg{width:19px;height:19px}
.flame span{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:16px;color:#fff;
  text-shadow:0 2px 0 rgba(20,34,76,.6)}
.flame.cold{background:linear-gradient(180deg,#9FB4D6,#5A6B8C);box-shadow:inset 0 3px 0 rgba(255,255,255,.3),0 4px 0 #35435E}

.chart{width:100%;height:132px;display:block;margin-top:10px}
.chart .bar{fill:var(--blue);stroke:var(--ink);stroke-width:2}
.chart .bar.top{fill:var(--lime)}
.chart .lab{font-family:'Fredoka';font-size:7px;fill:#7C6A44;font-weight:600}
.chart .val{font-family:'Baloo 2',system-ui,sans-serif;font-size:9px;font-weight:800;fill:var(--ink)}
.chart .base{stroke:rgba(20,34,76,.25);stroke-width:2}

.nameprev{text-align:center;font-size:30px;padding:14px 10px;border:3px solid var(--ink);
  border-radius:16px;background:rgba(9,18,42,.5);word-break:break-all}
.pickrow{display:flex;gap:8px;flex-wrap:wrap}
.pick{flex:1;min-width:64px;padding:9px 6px;border:3px solid var(--ink);border-radius:14px;
  cursor:pointer;background:#FFFDF6;color:var(--ink);font-size:15px;box-shadow:0 4px 0 var(--cream-dk)}
.pick.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold));box-shadow:0 4px 0 var(--gold-dk)}
.swatch{flex:0 0 44px;height:44px;min-width:0;border-radius:50%;padding:0}
.nm-blanc{color:#fff;text-shadow:var(--stroke)}
.nm-or{color:var(--gold);text-shadow:var(--stroke)}
.nm-lime{color:var(--lime);text-shadow:var(--stroke)}
.nm-cyan{color:#5FE0FF;text-shadow:var(--stroke)}
.nm-rose{color:#FF7BC0;text-shadow:var(--stroke)}
.nm-feu{background:linear-gradient(180deg,#FFE066,#FF6B1A);-webkit-background-clip:text;
  background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(20,34,76,.85))}
.nf-baloo{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800}
.nf-fredoka{font-family:'Fredoka',system-ui,sans-serif;font-weight:600}
.nf-lucky{font-family:'Luckiest Guy',system-ui,sans-serif;font-weight:400;letter-spacing:.03em}
.nf-mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:800}


/* ============================================================
   TUTORIEL — halo découpé et boîte de dialogue
   ============================================================ */
#tuto{position:fixed;inset:0;z-index:40;display:none}
#tuto.on{display:block;animation:tab-in .3s cubic-bezier(.2,1.3,.4,1)}
#tutoSpot{position:absolute;display:none;border-radius:20px;pointer-events:none;
  border:3px solid var(--gold-hi);
  box-shadow:0 0 0 9999px rgba(6,14,34,.80),0 0 26px 6px rgba(255,223,128,.75),
             inset 0 0 20px rgba(255,223,128,.35);
  transition:all .38s cubic-bezier(.2,1.2,.4,1);animation:spot 2s ease-in-out infinite}
@keyframes spot{0%,100%{box-shadow:0 0 0 9999px rgba(6,14,34,.80),0 0 22px 4px rgba(255,223,128,.65),inset 0 0 20px rgba(255,223,128,.3)}
                50%{box-shadow:0 0 0 9999px rgba(6,14,34,.80),0 0 34px 10px rgba(255,223,128,.9),inset 0 0 26px rgba(255,223,128,.45)}}

#tutoBox{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-b) + 14px);
  display:flex;align-items:flex-end;gap:10px}
#tutoFace{width:96px;height:65px;flex:0 0 96px;border:4px solid var(--ink);border-radius:20px;
  box-shadow:0 6px 0 var(--royal-dk),0 0 30px rgba(120,205,255,.5);
  animation:bob 2.6s ease-in-out infinite}
.tb-body{flex:1;min-width:0;border:4px solid var(--ink);border-radius:22px;padding:11px 13px 12px;
  background:linear-gradient(180deg,#FFFDF6,var(--cream));
  box-shadow:0 7px 0 var(--cream-dk),0 16px 26px -12px rgba(6,14,34,.8)}
.tb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.tb-name{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:16px;color:var(--royal)}
.tb-step{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:12px;color:#9A8659}
.tb-body p{margin:0 0 10px;font-size:15px;line-height:1.4;color:var(--ink);font-weight:500;min-height:62px}
.tb-act{display:flex;gap:8px}
.tb-act .btn{flex:1}
.tb-act .btn:first-child{flex:0 0 92px}

/* ============================================================ */
/* ============================================================
   PASSE VISUELLE — matière, lumière, profondeur
   ============================================================ */

/* ---------- Boutons : vernis, grain et lueur au repos ---------- */
.btn{position:relative;overflow:hidden;isolation:isolate}
/* reflet vitré sur la moitié haute, comme un bouton moulé */
.btn::before{content:'';position:absolute;left:3%;right:3%;top:4%;height:42%;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));
  pointer-events:none;z-index:-1}
/* balayage lumineux lent sur les boutons d'action principaux */
.btn.gold::after,.btn.danger::after{content:'';position:absolute;top:-60%;left:-30%;width:26%;height:220%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  transform:rotate(18deg);animation:sheen 4.5s ease-in-out infinite;pointer-events:none;z-index:-1}
@keyframes sheen{0%{left:-30%}55%{left:120%}100%{left:120%}}
.btn.gold{box-shadow:inset 0 4px 0 rgba(255,255,255,.55),inset 0 -6px 0 rgba(120,75,0,.28),
  0 6px 0 var(--gold-dk),0 12px 16px -8px rgba(165,106,4,.6),0 0 26px -6px rgba(255,199,74,.75)}
.btn:not(.steel){text-shadow:0 2px 0 rgba(20,34,76,.55),0 0 12px rgba(255,255,255,.25)}

/* ---------- Plaques : grain fin et liseré lumineux ---------- */
.plate{overflow:hidden}
.plate::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.30;
  background-image:radial-gradient(rgba(255,255,255,.16) 1px, transparent 1px);
  background-size:5px 5px}
.plate.cream::after{opacity:.22;
  background-image:radial-gradient(rgba(120,90,30,.14) 1px, transparent 1px)}
.plate>*{position:relative;z-index:1}

/* ---------- Emblèmes : halo coloré et vernis animé ---------- */
.crest,.pc-badge,#curBadge,#resBadge,#topMini{position:relative}
.crest::after{content:'';position:absolute;inset:6% 12%;border-radius:50%;z-index:-1;
  background:radial-gradient(closest-side,rgba(180,225,255,.55),transparent 72%);
  filter:blur(10px);animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.12)}}
.rung .b{filter:drop-shadow(0 3px 0 rgba(9,18,42,.5))}
.rung.cur .b{filter:drop-shadow(0 3px 0 rgba(9,18,42,.5)) drop-shadow(0 0 12px rgba(255,240,190,.95))}

/* ---------- Barres de progression : reflet et pulsation ---------- */
.progress .fill,.pass-track i,.pf-bar i,.xp i,.daily .mini i{position:relative;overflow:hidden}
.progress .fill::after,.pass-track i::after,.pf-bar i::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  animation:flow 2.6s linear infinite}
@keyframes flow{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* ---------- Ressources : éclat sur la pastille de niveau ---------- */
.lvlbadge{position:relative;overflow:hidden}
.lvlbadge::after{content:'';position:absolute;top:-40%;left:-60%;width:40%;height:200%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);
  transform:rotate(20deg);animation:sheen 5.5s ease-in-out infinite}
.res{position:relative}
.chip,.res svg{filter:drop-shadow(0 2px 0 rgba(9,18,42,.55))}

/* ---------- Navigation : lueur sous l'onglet actif ---------- */
.navbtn.on::after{content:'';position:absolute;bottom:2px;left:26%;right:26%;height:4px;border-radius:3px;
  background:var(--gold-hi);box-shadow:0 0 12px 2px rgba(255,223,128,.85)}
.navbtn.main.on::after{display:none}
.navbtn.main .disc{position:relative;overflow:hidden}
.navbtn.main .disc::after{content:'';position:absolute;top:-40%;left:-60%;width:38%;height:200%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);
  transform:rotate(20deg);animation:sheen 4s ease-in-out infinite}

/* ---------- Scène : sol lumineux sous le podium ---------- */
.stage .halo{background:
  radial-gradient(closest-side,rgba(190,235,255,.55),rgba(120,190,255,.18) 55%,transparent 74%)}
.stage::after{content:'';position:absolute;bottom:14px;left:22%;right:22%;height:16px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(150,220,255,.55),transparent 72%);
  filter:blur(5px);pointer-events:none}

  radial-gradient(70vw 20vh at 10% 60%, #1A5687 0 99%, transparent 100%),
  radial-gradient(82vw 24vh at 90% 64%, #14446F 0 99%, transparent 100%),
