<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>HeyePay</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #1C1C1E;
            --surface-elevated: #2C2C2E;
            --text-primary: #F5F5F7;
            --text-secondary: #86868B;
            --accent-blue: #0071E3;
            --accent-green: #30D158;
            --accent-red: #FF3B30;
            --glass-bg: rgba(28, 28, 30, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --separator: rgba(255, 255, 255, 0.15);
            --radius-btn: 14px;
            --radius-card: 24px;
            --safe-b: env(safe-area-inset-bottom, 0px);
            --safe-t: env(safe-area-inset-top, 0px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-primary); overflow: hidden; -webkit-font-smoothing: antialiased; }

        button { border: none; background: none; color: inherit; cursor: pointer; font: inherit; }
        .title { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 20px; }
        .subtitle { font-size: 20px; font-weight: 600; margin: 24px 0 12px 0; color: var(--text-primary); }
        .muted { color: var(--text-secondary); font-size: 15px; }

        .btn { display: flex; justify-content: center; align-items: center; width: 100%; padding: 16px; background-color: var(--accent-blue); color: #FFFFFF; border-radius: var(--radius-btn); font-size: 17px; font-weight: 600; transition: transform 0.1s, background-color 0.2s; margin-top: 12px; }
        .btn:active { transform: scale(0.97); background-color: #005BB5; }
        .btn.alt { background-color: var(--surface-elevated); color: var(--text-primary); }
        .btn.red { background-color: rgba(255, 59, 48, 0.1); color: var(--accent-red); }
        input.f { width: 100%; padding: 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-radius: var(--radius-btn); color: var(--text-primary); font-size: 17px; margin-bottom: 16px; outline: none; }

        #app { height: 100vh; display: flex; flex-direction: column; position: relative; }
        .header { padding: calc(var(--safe-t) + 20px) 20px 10px; display: flex; justify-content: space-between; align-items: center; }
        .content { flex: 1; overflow-y: auto; padding: 0 20px calc(var(--safe-b) + 100px); }
        
        .tab-view { display: none; }
        .tab-view.active { display: block; }

        .avatar { display: flex; justify-content: center; align-items: center; width: 44px; height: 44px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 18px; flex: none; background: linear-gradient(135deg, #0071E3, #004494); border: 1px solid var(--glass-border); }
        
        .balance-card { background: var(--surface-color); border: 1px solid var(--glass-border); border-radius: var(--radius-card); padding: 30px 24px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .balance-amt { font-size: 52px; font-weight: 700; letter-spacing: -0.04em; margin: 4px 0; font-variant-numeric: tabular-nums; }
        .balance-currency { font-size: 24px; font-weight: 600; color: var(--text-secondary); margin-left: 4px; }

        .quick-actions { display: flex; justify-content: space-between; margin: 24px 0; padding: 0 10px; }
        .action-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--text-primary); }
        .action-icon { display: flex; align-items: center; justify-content: center; width: 60px; height: 60px; border-radius: 50%; background: var(--surface-elevated); color: var(--accent-blue); font-size: 24px; border: 1px solid var(--glass-border); }

        .list-group { background: var(--surface-color); border-radius: 20px; padding: 0 16px; border: 1px solid var(--glass-border); }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--separator); }
        .list-item:last-child { border-bottom: none; }
        .tx-info { display: flex; flex-direction: column; gap: 4px; }
        .tx-title { font-size: 16px; font-weight: 600; }
        .tx-date { font-size: 13px; color: var(--text-secondary); }
        .tx-amt { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .tx-amt.pos { color: var(--accent-green); }
        
        .friend-row { display: flex; align-items: center; gap: 12px; }

        .cc { aspect-ratio: 1.586; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(135deg, #2C2C2E, #000000); box-shadow: 0 20px 40px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.15); position: relative; overflow: hidden; }
        .cc.fz { filter: grayscale(1); opacity: 0.6; }
        .cc-logo { font-size: 20px; font-weight: 700; display: flex; justify-content: space-between; align-items: center;}
        .cc-num { font-size: 22px; letter-spacing: 0.1em; font-variant-numeric: tabular-nums; font-weight: 600; }
        .cc-bot { display: flex; justify-content: space-between; font-size: 13px; color: #A1A1A6; }
        .cc-bot b { color: #FFF; font-size: 15px; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: calc(85px + var(--safe-b)); background: rgba(28, 28, 30, 0.85); backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border); display: flex; justify-content: space-around; align-items: center; padding-bottom: var(--safe-b); z-index: 50; }
        .nav-item { color: var(--text-secondary); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 500; cursor: pointer; }
        .nav-item.active { color: var(--accent-blue); }
        .nav-icon { font-size: 24px; }

        .sheet-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 300; align-items: flex-end; justify-content: center; backdrop-filter: blur(5px); }
        .sheet-overlay.active { display: flex; }
        .sheet-content { width: 100%; max-width: 500px; background: var(--surface-color); border-radius: 24px 24px 0 0; padding: 32px 24px calc(var(--safe-b) + 24px); border-top: 1px solid var(--glass-border); max-height: 90vh; overflow-y: auto; }
        
        .chips { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
        .chip { padding: 10px 20px; border-radius: 20px; background: var(--surface-elevated); font-size: 15px; font-weight: 600; border: 1px solid var(--glass-border); }
        .chip.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }

        .amt-input { font-size: 44px; font-weight: 700; text-align: center; background: transparent; border: none; color: white; width: 100%; outline: none; margin: 20px 0; font-variant-numeric: tabular-nums; }
        
        #toast { position: fixed; top: calc(var(--safe-t) + 20px); left: 50%; transform: translate(-50%, -150%); background: rgba(255,255,255,0.95); color: #000; padding: 14px 24px; border-radius: 99px; font-weight: 600; font-size: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 9999; }
        #toast.show { transform: translate(-50%, 0); }
    </style>
</head>
<body>

    <div style="position: absolute; top: 15px; left: 15px; z-index: 200;" id="heye-back-btn">
        <button onclick="exitApp()" style="background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 20px; color: white; font-weight: 600; font-size: 15px; border: 1px solid rgba(255,255,255,0.1);">‹ Quitter</button>
    </div>

    <!-- APPLICATION PRINCIPALE -->
    <div id="app">
        <!-- ACCUEIL -->
        <div id="tab-home" class="tab-view active content">
            <div class="header" style="padding-top: 70px;">
                <div class="title" style="margin: 0;">HeyePay</div>
                <div class="avatar" id="home-av">A</div>
            </div>
            
            <div class="balance-card">
                <div class="muted">Solde total</div>
                <div class="balance-amt"><span id="bal-val">0,00</span><span class="balance-currency">H$</span></div>
            </div>

            <div class="quick-actions">
                <button class="action-btn" onclick="openSheet('send')"><div class="action-icon">↗</div>Envoyer</button>
                <button class="action-btn" onclick="openSheet('mint')"><div class="action-icon">↓</div>Ajouter</button>
                <button class="action-btn" onclick="switchTab('card')"><div class="action-icon">💳</div>Carte</button>
            </div>

            <div class="subtitle">Transactions récentes</div>
            <div class="list-group" id="tx-list"></div>
        </div>

        <!-- CARTE -->
        <div id="tab-card" class="tab-view content">
            <div class="header" style="padding-top: 70px;"><div class="title" style="margin: 0;">Ma Carte</div></div>
            <div id="card-view"></div>
        </div>

        <!-- AMIS -->
        <div id="tab-friends" class="tab-view content">
            <div class="header" style="padding-top: 70px;"><div class="title" style="margin: 0;">Amis Heye</div></div>
            <p class="muted" style="margin-bottom: 16px;">Sélectionnez un contact pour lui envoyer des fonds.</p>
            <div class="list-group" id="friends-list"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')"><div class="nav-icon">⌂</div>Accueil</div>
        <div class="nav-item" onclick="switchTab('card')"><div class="nav-icon">💳</div>Carte</div>
        <div class="nav-item" onclick="switchTab('friends')"><div class="nav-icon">👥</div>Amis</div>
    </nav>

    <div id="action-sheet" class="sheet-overlay" onclick="if(event.target===this) closeSheet()">
        <div class="sheet-content" id="sheet-content"></div>
    </div>

    <div id="toast">✅ Message</div>

    <script>
        const DB_KEY = 'heye_database';
        let db = { users: {} };
        let myEmail = null;
        let me = null;
        let showCardDetails = false;
        let currentSendTarget = null;
        let toastTimeout;

        const $ = s => document.querySelector(s); const $$ = s => document.querySelectorAll(s);

        const formatCurrency = n => (n / 100).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const formatCardNum = s => s.replace(/(.{4})/g, '$1 ').trim();
        const randDigits = n => Array.from({length: n}, () => Math.floor(Math.random() * 10)).join('');

        function toast(msg) {
            const t = $('#toast');
            t.innerHTML = msg;
            t.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => t.classList.remove('show'), 2600);
        }

        function exitApp() {
            if (window.parent !== window) {
                try { window.parent.closeApp('heyepay-app'); } catch(e) {}
            }
        }

        function saveDB() {
            try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch(e) {}
        }

        // --- CONNEXION INSTANTANÉE AUTOMATIQUE ---
        function autoConnect() {
            try {
                // 1. Essai direct parent OS
                if (window.parent && window.parent.db && window.parent.db.currentUser) {
                    return processSSO(window.parent.db.users[window.parent.db.currentUser]);
                }
            } catch(e) {}

            try {
                // 2. Essai LocalStorage
                let rawDb = localStorage.getItem(DB_KEY);
                if (rawDb) {
                    let tempDb = JSON.parse(rawDb);
                    if (tempDb.currentUser && tempDb.users[tempDb.currentUser]) {
                        return processSSO(tempDb.users[tempDb.currentUser]);
                    }
                }
            } catch(e) {}

            // 3. Fallback de secours absolu (zéro blocage)
            processSSO({ prenom: "Alex", nom: "Heye", email: "alex@heye.us" });
        }

        function processSSO(hUser) {
            myEmail = hUser.email;
            try {
                let rawDb = localStorage.getItem(DB_KEY);
                if(rawDb) db = JSON.parse(rawDb);
            } catch(e) {}
            
            if(!db.users) db.users = {};
            db.users[myEmail] = { ...(db.users[myEmail] || {}), ...hUser };
            db.currentUser = myEmail;
            
            if (!db.users[myEmail].heyepay) {
                db.users[myEmail].heyepay = { balance: 0, tx: [], card: null };
            }
            me = db.users[myEmail];
            saveDB();

            $('#home-av').textContent = (me.prenom ? me.prenom.charAt(0).toUpperCase() : "A");
            renderAll();
        }

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'HEYE_SSO') {
                processSSO(event.data.user);
            }
        });

        window.onload = () => {
            if(window.parent === window) $('#heye-back-btn').style.display = 'none'; autoConnect(); // Connexion immédiate dès l'ouverture ! };          // UI & ACTIONS function switchTab(tabId) { $$('.tab-view').forEach(el => el.classList.remove('active'));$$('.nav-item').forEach(el => el.classList.remove('active'));$(`#tab-${tabId}`).classList.add('active');
            $$('.nav-item').forEach(el => {
                if (el.getAttribute('onclick').includes(tabId)) el.classList.add('active');
            });
            renderAll();
        }

        function openSheet(type, arg = null) {
            const content = $('#sheet-content');
            if (type === 'mint') {
                content.innerHTML = `
                    <h2 class="title" style="margin-bottom: 8px;">Ajouter des fonds</h2>
                    <input type="text" class="amt-input" id="amt-input" inputmode="decimal" placeholder="0,00 H$" oninput="this.value = this.value.replace(/[^0-9,]/g, '')">
                    <div class="chips" style="justify-content: center;">
                        <button class="chip" onclick="setAmt(50)">50 H$</button>
                        <button class="chip" onclick="setAmt(100)">100 H$</button>
                        <button class="chip" onclick="setAmt(500)">500 H$</button>
                    </div>
                    <button class="btn" onclick="processMint()">Ajouter au solde</button>
                `;
            } else if (type === 'send') {
                currentSendTarget = arg;
                let friendsHtml = getFriendsList().map(f => `
                    <button class="chip ${currentSendTarget === f.email ? 'active' : ''}" onclick="selectFriend('${f.email}')" id="chip-${f.email}">${f.name}</button>
                `).join('') || `<p class="muted">Aucun ami trouvé.</p>`;

                content.innerHTML = `
                    <h2 class="title" style="margin-bottom: 8px;">Envoyer de l'argent</h2>
                    <div class="chips">${friendsHtml}</div>
                    <input type="text" class="amt-input" id="amt-input" inputmode="decimal" placeholder="0,00 H$" oninput="this.value = this.value.replace(/[^0-9,]/g, '')">
                    <input type="text" class="f" id="note-input" placeholder="Message (facultatif)" style="background: var(--surface-color);">
                    <button class="btn" onclick="processSend()">Confirmer l'envoi</button>
                `;
            }
            $('#action-sheet').classList.add('active');
        }

        function closeSheet() { $('#action-sheet').classList.remove('active'); }
        function setAmt(val) { $('#amt-input').value = val + ',00'; }
        function getAmtValue() { return Math.round(parseFloat($('#amt-input').value.replace(',', '.') \vert{}\vert{} 0) * 100); }  function selectFriend(email) { currentSendTarget = email; $$('.chip').forEach(c => c.classList.remove('active'));
            const targetEl = document.getElementById(`chip-${email}`);
            if(targetEl) targetEl.classList.add('active');
        }

        function getFriendsList() {
            let list = [];
            for (let k in db.users) {
                if (k !== myEmail) list.push({ email: k, name: db.users[k].prenom || "Ami" });
            }
            return list;
        }

        function renderAll() {
            $('#bal-val').textContent = formatCurrency(me.heyepay.balance);
            
            let sortedTx = [...me.heyepay.tx].sort((a,b) => b.date - a.date);
            let txHtml = sortedTx.length === 0 ? `<p class="muted" style="padding: 20px 0; text-align:center;">Aucune transaction récente.</p>` 
                : sortedTx.slice(0, 10).map(t => {
                    let isPos = t.amount > 0;
                    let title = t.type === 'mint' ? 'Recharge' : t.type === 'buy' ? `Carte · ${t.note}` : t.type === 'send' ? `À ${db.users[t.peer]?.prenom || 'Ami'}` : `De ${db.users[t.peer]?.prenom || 'Ami'}`;
                    let dateStr = new Date(t.date).toLocaleDateString('fr-FR', {day: 'numeric', month: 'short'});
                    return `
                    <div class="list-item">
                        <div class="tx-info"><div class="tx-title">${title}</div><div class="tx-date">${dateStr}</div></div>
                        <div class="tx-amt ${isPos ? 'pos' : ''}">${isPos ? '+' : ''}${formatCurrency(t.amount)} H$</div>
                    </div>`;
                }).join('');
            $('#tx-list').innerHTML = txHtml;

            let fHtml = getFriendsList().map(f => `
                <div class="list-item">
                    <div class="friend-row"><div class="avatar">${f.name.charAt(0).toUpperCase()}</div><div class="tx-title">${f.name}</div></div>
                    <button class="btn alt" style="width: auto; margin:0; padding: 8px 16px; border-radius: 20px;" onclick="openSheet('send', '${f.email}')">Envoyer</button>
                </div>
            `).join('') || `<p class="muted" style="padding: 20px 0; text-align:center;">Aucun autre ami dans le Launcher.</p>`;
            $('#friends-list').innerHTML = fHtml;

            let cardView = $('#card-view');
            if (me.heyepay.card) {
                let c = me.heyepay.card;
                cardView.innerHTML = `
                    <div class="cc ${c.frozen ? 'fz' : ''}">
                        <div class="cc-logo"><span>HeyePay</span> <span>💳</span></div>
                        <div class="cc-num">${showCardDetails ? formatCardNum(c.num) : '•••• •••• •••• ' + c.num.slice(-4)}</div>
                        <div class="cc-bot"><div>EXP<br><b>${showCardDetails ? c.exp : '••/••'}</b></div><div>CVV<br><b>${showCardDetails ? c.cvv : '•••'}</b></div></div>
                    </div>
                    <button class="btn alt" onclick="showCardDetails = !showCardDetails; renderAll()">${showCardDetails ? 'Masquer' : 'Afficher les numéros'}</button>
                    <div class="list-group" style="margin-top:20px;"><div class="list-item"><div><b>Geler la carte</b></div><input type="checkbox" style="width:30px;height:30px;accent-color:var(--accent-blue);" ${c.frozen ? 'checked' : ''} onchange="me.heyepay.card.frozen = this.checked; saveDB(); renderAll();"></div></div>
                    <button class="btn" onclick="simulateBuy()" style="margin-top:20px;">Simuler un achat (5 H$)</button>
                    <button class="btn red" onclick="generateCard()">Nouveau numéro</button>
                `;
            } else {
                cardView.innerHTML = `
                    <div class="balance-card" style="margin-top:20px;">
                        <div style="font-size: 50px; margin-bottom: 10px;">💳</div>
                        <div class="tx-title" style="margin-bottom: 8px;">Pas encore de carte</div>
                        <button class="btn" onclick="generateCard()">Générer ma carte</button>
                    </div>
                `;
            }
        }

        function processMint() {
            let amt = getAmtValue();
            if (amt <= 0) return toast("Montant invalide.");
            me.heyepay.balance += amt;
            me.heyepay.tx.push({ id: Date.now(), type: 'mint', amount: amt, date: Date.now() });
            saveDB(); closeSheet(); renderAll(); toast(`✅ ${formatCurrency(amt)} H$ ajoutés.`);
        }

        function processSend() {
            if (!currentSendTarget) return toast("Sélectionnez un contact.");
            let amt = getAmtValue();
            if (amt <= 0 || amt > me.heyepay.balance) return toast("Montant invalide ou solde insuffisant.");
            
            let note = $('#note-input').value.trim();
            me.heyepay.balance -= amt;
            me.heyepay.tx.push({ id: Date.now(), type: 'send', amount: -amt, date: Date.now(), peer: currentSendTarget, note });
            
            if (!db.users[currentSendTarget]) db.users[currentSendTarget] = { prenom: "Ami", email: currentSendTarget };
            let targetUser = db.users[currentSendTarget];
            if (!targetUser.heyepay) targetUser.heyepay = { balance: 0, tx: [], card: null };
            
            targetUser.heyepay.balance += amt;
            targetUser.heyepay.tx.push({ id: Date.now()+1, type: 'receive', amount: amt, date: Date.now(), peer: myEmail, note });
            
            saveDB(); closeSheet(); renderAll(); toast(`💸 ${formatCurrency(amt)} H$ envoyés.`);
        }

        function generateCard() {
            let y = (new Date().getFullYear() + 4) % 100;
            me.heyepay.card = { num: '5412' + randDigits(12), exp: String(1 + Math.floor(Math.random() * 12)).padStart(2, '0') + '/' + y, cvv: randDigits(3), frozen: false };
            saveDB(); showCardDetails = false; renderAll(); toast("✅ Carte prête.");
        }

        function simulateBuy() {
            if (me.heyepay.card.frozen || me.heyepay.balance < 500) return toast("❌ Refusé (Gelée ou solde bas).");
            me.heyepay.balance -= 500;
            me.heyepay.tx.push({ id: Date.now(), type: 'buy', amount: -500, date: Date.now(), note: 'Achat Simulé' });
            saveDB(); renderAll(); toast(`🛒 Achat validé de 5,00 H$.`);
        }
    </script>
</body>
</html>
